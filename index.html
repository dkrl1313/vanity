<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1716">
<title>화장대</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧴%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f5; --card: #fff; --ink: #2b2523; --muted: #756a65; --line: #ebe3de;
  --accent: #a94f43; --on-accent: #fff; --soft: #f6e9e5;
  --warn: #8a5300; --warn-bg: #fdf0d5; --bad: #b3261e; --bad-bg: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1716; --card: #262120; --ink: #f2eae7; --muted: #a99d98; --line: #3a322f;
    --accent: #e8a094; --on-accent: #2a1410; --soft: #3a2824;
    --warn: #ffd08a; --warn-bg: #3e2f12; --bad: #ffb4ab; --bad-bg: #4b1f1b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto; max-width: 560px; min-height: 100dvh; background: var(--bg); color: var(--ink);
  padding: 0 16px calc(80px + env(safe-area-inset-bottom));
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 0; }
small, .muted { color: var(--muted); font-size: 13px; font-weight: 400; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .35; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.danger { color: var(--bad); border-color: transparent; background: none; }
.wide { width: 100%; min-height: 48px; margin-bottom: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
header button { border: 0; background: none; font-size: 22px; min-width: 44px; min-height: 44px; padding: 0; }
nav {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav button { border: 0; border-radius: 0; background: none; min-height: 56px; color: var(--muted); font-size: 14px; }
nav button[aria-current] { color: var(--accent); font-weight: 700; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: #b3261e; color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.secret { -webkit-text-security: disc; }     /* 비밀번호 칸으로 두면 비밀번호 관리자가 키를 저장하려 든다 */
.ai { margin: 0; background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
.empty { text-align: center; padding: 40px 12px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 17px; }
.chip { min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.filters .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }

/* 루틴 */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.day { padding: 4px 0; min-height: 54px; display: grid; justify-items: center; align-content: center; border-radius: 12px; }
.day b { font-size: 15px; }
.day small { font-size: 10.5px; line-height: 15px; min-height: 15px; }
.day[aria-current] { border-color: var(--accent); }
.day[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed=true] small { color: inherit; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.bar small { flex: 1; min-width: 150px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.what { flex: 1; min-width: 0; display: grid; }
.what b { font-weight: 600; }
.ctl { display: flex; gap: 4px; flex: none; }
.ctl button { min-width: 36px; min-height: 36px; padding: 0; }
.card select { margin-top: 8px; }

/* 화장품 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prod { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.prod .name { border: 0; background: none; padding: 4px 0; min-height: 0; text-align: left; font-weight: 600; }

/* 피부 기록 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.log { padding: 0 0 10px; border-radius: 16px; overflow: hidden; display: grid; gap: 4px; text-align: left; align-content: start; }
.log img, .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.log b, .log small, .log .tags { padding: 0 10px; }
.log .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.log small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 입력 창 */
dialog { border: 0; border-radius: 18px; padding: 20px; width: min(100vw - 24px, 480px); max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
form { display: grid; gap: 14px; }
form > label, .two label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-size: 13px; color: var(--muted); }
input:not([type=checkbox]), select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
textarea { resize: vertical; }
input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
form > label.pill, label.pill { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--ink); cursor: pointer; }
label.pill:has(:checked) { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 10px; }
form:has([name=opened]:not(:checked)) .if-opened { display: none; }
.actions { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
form > label.btn, .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:has(:disabled) { opacity: .35; pointer-events: none; }
.adds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.adds > * { min-height: 48px; }
.preview { width: 100%; max-height: 46dvh; object-fit: contain; border-radius: 12px; background: var(--bg); }
.sr, input.sr { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); }

#toast { inset: auto auto calc(72px + env(safe-area-inset-bottom)) 50%; translate: -50% 0; margin: 0; border: 0; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; max-width: calc(100vw - 32px); }
#toast.bad { background: #b3261e; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>화장대</h1>
  <button data-act="backup" aria-label="설정·백업" title="설정·백업">⋯</button>
</header>
<main id="view"></main>
<nav aria-label="화면">
  <button data-act="tab" data-tab="routine">루틴</button>
  <button data-act="tab" data-tab="products">화장품<span id="soon" class="count" hidden></span></button>
  <button data-act="tab" data-tab="skin">피부 기록</button>
</nav>
<dialog id="dlg"></dialog>
<p id="toast" role="status" popover="manual"></p>

<script>
'use strict';

/* ───────── 기준값 ───────── */
// 종류: 적힌 순서 = 바르는 순서. [이름, 자동 루틴에 넣는 때] ('' = 루틴에 넣지 않음)
const CATS = {
  oil: ['클렌징오일·밤', 'pm'], cleanser: ['폼클렌저', 'both'], exfol: ['각질케어', 'pm'], toner: ['토너·스킨', 'both'],
  mask: ['마스크팩', 'pm'], essence: ['에센스', 'both'], serum: ['세럼·앰플', 'both'], eye: ['아이크림', 'both'],
  lotion: ['로션·에멀전', 'both'], cream: ['크림', 'both'], faceoil: ['페이스오일', 'pm'], sleep: ['슬리핑팩', 'pm'],
  sun: ['선크림', 'am'], makeup: ['메이크업', ''], body: ['바디·헤어', ''], etc: ['기타', ''],
};
const ORDER = Object.keys(CATS);
const ACTIVES = { retinol: '레티놀', acid: 'AHA·BHA', vitc: '비타민C' };
const PAOS = [3, 6, 12, 18, 24, 36];          // 개봉 후 사용기간(개월) 선택지
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SLOTS = { am: '아침', pm: '저녁' };
const TAGS = ['좋음', '건조', '유분', '트러블', '홍조', '예민'];
// 레티놀·각질케어는 저녁에만, 서로 다른 날에. 목·일은 쉬는 날이라 팩을 둔다
const NIGHTS = { retinol: [0, 2, 4], acid: [1, 5], pack: [3, 6] };
const SOON = 30;                              // 기한이 이 날수 안이면 '임박'

/* ───────── 계산 (화면과 무관 — 점검: index.html?test) ───────── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const todayIdx = () => (new Date().getDay() + 6) % 7;      // 월=0 … 일=6
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function addMonths(s, n) {                    // 1/31 + 1개월 = 2월 말일 (다음 달로 넘치지 않게)
  const [y, m, d] = s.split('-').map(Number);
  return ymd(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate())));
}

const openLimit = p => (p.opened && p.openedAt && p.pao ? addMonths(p.openedAt, p.pao) : '');
const expiryOf = p => [p.expiry, openLimit(p)].filter(Boolean).sort()[0] || '';   // 적힌 기한과 개봉 기한 중 빠른 쪽
const left = (p, now) => (expiryOf(p) ? daysBetween(now, expiryOf(p)) : null);    // 남은 날 (기한 없으면 null)
const expired = (p, now) => (left(p, now) ?? 0) < 0;                              // 기한 당일까지는 사용

function group(p) {                           // 주기 묶음. 씻어내는 클렌저는 성분과 상관없이 매일
  if (p.cat === 'oil' || p.cat === 'cleanser') return 'daily';
  if (p.actives.includes('retinol')) return 'retinol';
  if (p.cat === 'exfol' || p.actives.includes('acid')) return 'acid';
  if (p.cat === 'mask' || p.cat === 'sleep') return 'pack';
  return 'daily';
}
const vitcAm = p => p.actives.includes('vitc') && p.cat !== 'cleanser' && CATS[p.cat][1] === 'both';      // 바르는 비타민C는 아침으로
function fits(p, d, t, calm) {                // 이 제품을 d요일 t(am/pm)에 써도 되는가
  const when = CATS[p.cat][1], g = group(p);
  if (!when) return false;
  if (g !== 'daily') return t === 'pm' && NIGHTS[g].includes(d) && !(calm && g !== 'pack');
  if (vitcAm(p)) return t === 'am';
  return when === 'both' || when === t;
}
// 사용중·기한 안 지난 제품으로 일주일 루틴을 짠다 → [{am: [id…], pm: [id…]} × 7]
// calm = 피부가 예민한 주: 레티놀·각질케어를 뺀다
function generate(products, calm, now) {
  const usable = products.filter(p => p.inUse && !expired(p, now))
    .sort((a, b) => (expiryOf(a) || '9').localeCompare(expiryOf(b) || '9'));      // 기한 임박한 것부터
  const turn = {};
  return DAYS.map((_, d) => {
    const day = {};
    for (const t in SLOTS) {
      day[t] = [];
      for (const cat of ORDER) {
        const fit = usable.filter(p => p.cat === cat && fits(p, d, t, calm));
        const due = fit.filter(p => group(p) !== 'daily' || vitcAm(p));           // 요일·시간이 정해진 성분이 그 자리를 먼저 차지
        const pool = due.length ? due : fit;
        if (!pool.length) continue;
        // ponytail: 같은 종류가 여러 개면 날마다 번갈아 쓴다(아침·저녁 따로 센다). 제형·궁합까지 보려면 규칙 추가
        const key = cat + t + (due.length ? '*' : '');
        day[t].push(pool[(turn[key] = (turn[key] ?? -1) + 1) % pool.length].id);
      }
    }
    return day;
  });
}
function isCalm(logs, now) {                  // 가장 최근 피부 기록이 7일 안이고 '예민'이면 (앞날짜로 잘못 적은 기록은 무시)
  const last = logs.filter(l => l.date <= now).reduce((m, l) => (!m || l.date >= m.date ? l : m), null);
  return !!last && daysBetween(last.date, now) <= 7 && last.tags.includes('예민');
}

// ponytail: 이름 키워드로 종류·성분을 어림짐작한다(위에서부터 먼저 맞는 것). 틀리면 폼에서 고치면 됨. 더 정확히 하려면 제품 DB·AI 조회로 교체
const CAT_HINTS = [
  ['oil', /클렌징\s*(오일|밤|워터|밀크|티슈)|리무버/i],
  ['makeup', /쿠션|파운데이션|(^|[^임])팩트|립\s*(스틱|밤|글로스|틴트|라이너|오일|마스크|케어)|틴트|섀도|마스카라|블러셔|컨실러|프라이머|파우더|아이라이너|브로우/i],
  ['sun', /선\s*(크림|스틱|젤|로션|밀크|세럼|에센스|스프레이)|썬|자외선|spf/i],
  ['body', /바디|샴푸|린스|트리트먼트|핸드|헤어|풋/i],
  ['sleep', /슬리핑|수면\s*팩|나이트\s*(팩|마스크)/i],
  ['mask', /마스크|팩(?!트)/i],
  ['exfol', /필링|각질|스크럽|peel/i],
  ['cleanser', /클렌저|클렌징|폼|세안|워시/i],
  ['eye', /아이\s*(크림|세럼|밤|젤)/i],
  ['toner', /토너|스킨|패드|toner/i],
  ['essence', /에센스|essence/i],
  ['serum', /세럼|앰플|serum|ampoule/i],
  ['lotion', /로션|에멀[전젼]|lotion/i],
  ['faceoil', /오일|oil/i],
  ['cream', /크림|밤|젤|cream/i],
];
const ACTIVE_HINTS = {
  retinol: /레티놀|레티날|레티닐|retin/i,
  acid: /\b(aha|bha|pha|lha)\b|살리실|글리콜|필링|각질/i,
  vitc: /비타민\s*c\b|vitamin\s*c\b|vita\s*c\b|아스코르/i,
};
function guess(name) {                        // 종류를 못 찾았어도 성분이 보이면 세럼으로
  const actives = Object.keys(ACTIVE_HINTS).filter(a => ACTIVE_HINTS[a].test(name));
  return { cat: CAT_HINTS.find(([, re]) => re.test(name))?.[0] ?? (actives.length ? 'serum' : 'etc'), actives };
}

/* ───────── 데이터 정리 (폼 저장·백업 가져오기 공통 — 모르는 값은 버린다) ───────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const text = (v, max) => (typeof v === 'string' ? v : '').trim().slice(0, max);
const date = v => {                           // 2/30 같은 없는 날짜는 버린다 (Date.parse 는 브라우저마다 달라 직접 되짚는다)
  const m = typeof v === 'string' && /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  return m && ymd(new Date(m[1], m[2] - 1, m[3])) === v ? v : '';
};
const isPhoto = v => typeof v === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(v);
function cleanProduct(p) {
  p = p && typeof p === 'object' ? p : {};
  const opened = !!p.opened || !!p.inUse;     // 사용중이면 개봉한 것
  return {
    id: text(p.id, 40) || uid(), name: text(p.name, 80), cat: typeof p.cat === 'string' && Object.hasOwn(CATS, p.cat) ? p.cat : 'etc',
    actives: Object.keys(ACTIVES).filter(a => Array.isArray(p.actives) && p.actives.includes(a)),
    expiry: date(p.expiry), opened, openedAt: opened ? date(p.openedAt) : '', pao: PAOS.includes(+p.pao) ? +p.pao : 0,
    inUse: !!p.inUse, memo: text(p.memo, 300),
  };
}
function cleanLog(l) {
  l = l && typeof l === 'object' ? l : {};
  return {
    id: text(l.id, 40) || uid(), date: date(l.date) || today(), tags: TAGS.filter(t => Array.isArray(l.tags) && l.tags.includes(t)),
    memo: text(l.memo, 500), thumb: isPhoto(l.thumb) ? l.thumb : '',      // thumb 가 있으면 원본 사진은 저장소의 photo:<id>
  };
}
function cleanAnalysis(r) {                   // AI 답도 믿지 않고 정해진 값만 남긴다. '좋음'은 다른 상태와 같이 두지 않는다
  const tags = r?.ok === true ? TAGS.filter(t => Array.isArray(r.tags) && r.tags.includes(t)) : [];
  return { ok: r?.ok === true, tags: tags.length > 1 ? tags.filter(t => t !== '좋음') : tags,

function cleanState(s) {

/* ───────── 저장소 (이 브라우저의 IndexedDB. 키: state, photo:<기록 id>) ───────── */
const idb = (() => {
  let open;                                   // 연결이 끊기면(iOS 가 백그라운드 탭에서 끊기도 함) 다음 요청 때 다시 연다
  const conn = () => open ??= new Promise((ok, no) => {
    const r = indexedDB.open('vanity', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { r.result.onclose = () => (open = null); ok(r.result); };
    r.onerror = () => no(r.error);
  });
  const run = (mode, fn) => conn().then(db => new Promise((ok, no) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => ok(q.result);
    t.onerror = t.onabort = () => no(t.error);
  })).catch(e => { open = null; throw e; });
  return { get: k => run('readonly', s => s.get(k)), set: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)),
    run };
})();

function shrink(file, max, q) {               // 긴 변 max px JPEG data URL 로 줄인다
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const out = c.toDataURL('image/jpeg', q); c.width = c.height = 0; ok(out);     // iOS 캔버스 메모리 반납
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('사진을 읽을 수 없어요.')); };
    img.src = url;
  });
}
async function exportAll() {

  const blob = new Blob([JSON.stringify({ app: 'vanity', v: 1, at: today(), state, photos })], { type: 'application/json' });
  if (blob.size > BACKUP_MAX) toast('백업이 300MB를 넘어 이 앱으로는 다시 가져올 수 없어요. 오래된 피부 기록을 지우고 다시 내보내 주세요.', true);
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: `화장대-백업-${today()}.json` }).click();
  setTimeout(() => URL.revokeObjectURL(url), 6e4);
}
async function importFile(file) {

  // 새 사진 → 새 state → 옛 사진 삭제 순서. 중간에 실패해도 지금 기록은 남는다(id 가 같은 기록의 사진은 백업본으로 바뀌어 있을 수 있음)
  try {

  const keep = new Set(next.logs.map(l => l.id));
  for (const l of state.logs) if (!keep.has(l.id)) idb.del('photo:' + l.id).catch(() => {});

}

function cleanItems(r) {                      // AI 가 읽은 화장품도 믿지 않고 정해진 값만 (개봉·사용중은 사용자가 고른다)

const analyzeSkin = async (photo, key) => cleanAnalysis(await askGemini(photo, key, SKIN_PROMPT, SKIN_SCHEMA, '이 사진의 피부 상태를 기록해 주세요.'));
const readProducts = async (photo, key) => cleanItems(await askGemini(photo, key, PRODUCT_PROMPT, PRODUCT_SCHEMA, '이 사진 속 화장품을 읽어 주세요.'));
async function askGemini(photo, apiKey, prompt, schema, ask) {
  let res, body;
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 60e3);      // 60초 넘게 답이 없으면 끊는다 (옛 Safari 에도 있는 방법으로)
  try {
    res = await fetch(GEMINI, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': apiKey },      // 키는 URL 이 아닌 헤더로 — 기록·리퍼러에 남지 않게
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: prompt }] },
        contents: [{ role: 'user', parts: [
          { inlineData: { mimeType: 'image/jpeg', data: photo.slice(photo.indexOf(',') + 1) } },
          { text: ask },
        ] }],
        generationConfig: {
          responseMimeType: 'application/json', responseJsonSchema: schema,
          maxOutputTokens: 8192, thinkingConfig: { thinkingLevel: 'LOW' },      // 답은 JSON 하나 — 생각은 짧게 해서 무료 한도를 아끼게
        },
      }),
      signal: ac.signal,
    });
    body = await res.json().catch(e => { if (e?.name === 'AbortError') throw e; return {}; });
  } catch (e) {
    throw new Error(e?.name === 'AbortError' ? '응답이 늦어요. 잠시 뒤 다시 해 주세요.' : '연결하지 못했어요. 인터넷이나 광고 차단 확장 프로그램을 확인해 주세요.');
  } finally { clearTimeout(timer); }

    throw new Error(res.status === 404 || /limit: 0\b/.test(msg) ? '이 AI 모델을 무료로 쓸 수 없게 됐어요. 앱의 모델 설정을 바꿔야 해요.'      // 모델이 내려갔거나 무료에서 빠짐
      : res.status === 429 ? '무료 사용 한도에 걸렸어요. 잠시 뒤나 내일 다시 해 주세요.'
      : /REFERRER_BLOCKED|SERVICE_BLOCKED/.test(why) ? 'API 키의 웹사이트·API 제한 설정이 이 앱을 막고 있어요. Google Cloud 콘솔에서 확인해 주세요.'
      : res.status === 401 || res.status === 403 || /API_KEY/.test(why) ? 'API 키가 맞지 않아요. ⋯ 메뉴에서 확인해 주세요.'
      : res.status >= 500 ? 'Google 쪽에 잠깐 문제가 있어요. 잠시 뒤 다시 해 주세요.'
      : `분석 요청이 실패했어요 (${res.status}): ${msg.slice(0, 160)}`);
  }
  return readGemini(body);
}
// generateContent 응답에서 JSON 답을 꺼낸다. 차단·잘림·깨진 답은 알아듣는 말로
function readGemini(r) {
  const c = r?.candidates?.[0];
  if (r?.promptFeedback?.blockReason || /SAFETY|PROHIBITED|BLOCKLIST|SPII/.test(c?.finishReason ?? '')) throw new Error('AI가 이 사진은 분석하지 않았어요.');
  const text = (c?.content?.parts ?? []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  // 답 없이 OTHER·RECITATION 등으로 끝나면 사실상 거절 — 다시 해도 같아서 무료 한도만 쓴다
  if (c && !text && !/^(STOP|MAX_TOKENS)$/.test(c.finishReason ?? '')) throw new Error('AI가 이 사진은 분석하지 않았어요.');
  try { return JSON.parse(text); } catch { throw new Error('분석 결과를 읽지 못했어요. 다시 해 주세요.'); }
}
// 결과는 AI가 체크했던 상태만 바꾸고(내가 고른 건 그대로) 메모의 'AI:' 줄을 바꾼다 — 저장 전에 고칠 수 있다
async function runAnalysis(form) {
  const out = form.querySelector('.ai'), btn = form.querySelector('[data-act=analyze]'), save = form.querySelector('.primary');
  const seq = form._aiSeq = (form._aiSeq || 0) + 1;      // 사진을 바꾸거나 다시 누르면 앞선 분석 결과는 버린다
  const live = () => seq === form._aiSeq && form.isConnected && dlg.open;      // 창을 닫았거나 바뀌었으면 결과도 버린다
  btn.disabled = save.disabled = true;                    // 끝나기 전에 저장하면 결과는 버려지고 무료 한도만 쓴다
  out.hidden = false;
  try {
    const photo = form._draft?.photo ?? form.querySelector('.preview').getAttribute('src');
    const key = await getKey();
    if (!live()) return;
    if (key === null) return void (out.textContent = '저장소를 읽지 못했어요. 다시 해 주세요.');
    if (!key) return void (out.textContent = '⋯ 메뉴에서 Gemini API 키(무료)를 등록하면 AI가 사진을 보고 상태를 채워 줘요.');
    if (!isPhoto(photo)) return void (out.textContent = '사진을 먼저 골라 주세요.');
    out.textContent = 'AI가 사진을 보는 중이에요… (보통 몇 초)';
    const r = await analyzeSkin(photo, key);
    if (!live()) return;
    if (r.ok) {
      for (const c of form.elements.tags) if (form._aiTags?.includes(c.value) || r.tags.includes(c.value)) c.checked = r.tags.includes(c.value);
      form._aiTags = r.tags;
      const memo = form.elements.memo, base = memo.value.split('\n').filter(s => !s.startsWith('AI: ')).join('\n').trimEnd();
      const room = 500 - (base ? base.length + 1 : 0);      // 메모는 500자까지라 AI 줄을 남은 자리에 맞춘다
      if (r.summary && room > 10) memo.value = (base ? base + '\n' : '') + ('AI: ' + r.summary).slice(0, room);
    }
    out.textContent = r.ok ? `AI: ${r.summary} 체크한 상태는 저장 전에 고칠 수 있어요.` : `AI: ${r.summary || '피부가 잘 보이는 사진으로 다시 골라 주세요.'}`;
  } catch (e) { if (live()) out.textContent = e.message; }
  finally { if (seq === form._aiSeq) btn.disabled = save.disabled = false; }
}
// 화장품 사진 → 첫 제품으로 이 창을 채우고(이미 고른 개봉·사용중·메모는 그대로), 나머지는 저장할 때마다 하나씩 새 창으로. 사진은 저장하지 않는다

  } catch (e) { if (live()) out.textContent = e.message; }

  },
  move(d) {
    const a = state.routine.days[dayIdx][d.t], i = +d.i, j = i + +d.by;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]];
    focusId = `${d.by < 0 ? 'u' : 'w'}-${d.t}-${j}`; manual();
  },
  drop(d) { state.routine.days[dayIdx][d.t].splice(+d.i, 1); manual(); },
  filter(d) { filter = d.f; render(); },
  add() { queue = []; productForm(); },
  skip() { queue.length ? productForm(queue.shift(), true) : dlg.close(); },
  editProduct(d) { productForm(product(d.id)); },
  use(d) {
    const p = product(d.id); if (!p) return;
    if (!p.inUse && !p.opened) {              // 개봉일이 실수로 찍히지 않게 한 번 묻는다
      if (!confirm(`‘${p.name}’은(는) 미개봉이에요.\n오늘 개봉한 것으로 기록하고 사용중으로 바꿀까요?`)) return;
      p.opened = true; p.openedAt = today();
    }
    p.inUse = !p.inUse; commit();
  },
  delProduct(d) {
    const p = product(d.id); if (!p || !confirm(`‘${p.name}’을(를) 삭제할까요?`)) return;
    state.products = state.products.filter(x => x !== p);
    for (const day of state.routine.days) for (const t in SLOTS) day[t] = day[t].filter(id => id !== p.id);
    dlg.close(); commit();
  },
  addLog() { logForm(); },
  editLog(d) { logForm(state.logs.find(l => l.id === d.id)); },
  delLog(d) {
    if (!confirm('이 피부 기록을 삭제할까요?')) return;
    state.logs = state.logs.filter(l => l.id !== d.id);
    dlg.close();
    commit().then(ok => ok && idb.del('photo:' + d.id)).catch(() => {});      // 기록 삭제가 저장된 뒤에 사진을 지운다
  },
  backup() { backupForm(); },
  export() { exportAll().catch(() => toast('백업 파일을 만들지 못했어요', true)); },
  close() { dlg.close(); },
  analyze() { runAnalysis(dlg.querySelector('form')); },
  async saveKey() {
    const v = dlg.querySelector('[name=apiKey]').value.trim();
    if (/^sk-ant-/.test(v) || !/^[\w.-]{20,}$/.test(v)) return toast('Gemini API 키 형식이 아니에요. AI Studio에서 복사한 키를 그대로 넣어 주세요.', true);
    try { await idb.set('geminiKey', v); } catch (e) { return fail(e); }
    toast('API 키를 저장했어요'); backupForm();
  },
  async delKey() {
    if (!confirm('이 기기에 저장된 API 키를 지울까요?')) return;
    try { await idb.del('geminiKey'); } catch { return toast('키를 지우지 못했어요. 새로고침 뒤 다시 해 주세요.', true); }
    backupForm();
  },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (state && b && Object.hasOwn(ACT, b.dataset.act)) ACT[b.dataset.act](b.dataset); });
view.addEventListener('change', e => {        // 루틴에 제품 추가 · 화장품 사진으로 등록
  const file = e.target.files?.[0];
  if (file && e.target.dataset.pick === 'product') { ACT.add(); fillFromPhoto(dlg.querySelector('form'), file); e.target.value = ''; return; }
  const t = e.target.dataset.add;
  if (t && product(e.target.value)) { state.routine.days[dayIdx][t].push(e.target.value); manual(); }
});

dlg.addEventListener('input', e => {          // 화장품 폼: 이름으로 종류 추측, 개봉·사용중 맞물림
  const t = e.target, f = t.form;
  if (f?.dataset.form !== 'product') return;
  const el = f.elements;
  if (t.name === 'name' && f.dataset.auto) { const g = guess(t.value); el.cat.value = g.cat; for (const c of el.actives) c.checked = g.actives.includes(c.value); }
  if (t.name === 'cat' || t.name === 'actives') delete f.dataset.auto;        // 직접 고른 뒤에는 추측하지 않는다
  if (t.name === 'inUse' && t.checked) el.opened.checked = true;
  if (t.name === 'opened' && !t.checked) el.inUse.checked = false;
  if ((t.name === 'opened' || t.name === 'inUse') && el.opened.checked && !el.openedAt.value) el.openedAt.value = today();
});
dlg.addEventListener('change', async e => {   // 사진·백업 파일 고르기
  const t = e.target, file = t.files?.[0];
  if (!file) return;
  if (t.dataset.pick === 'backup') importFile(file);
  if (t.dataset.pick === 'product') fillFromPhoto(t.form, file);
  if (t.dataset.pick === 'photo') {
    const form = t.form, ok = form.querySelector('.primary'), img = form.querySelector('.preview');
    ok.disabled = true;                       // 줄이는 동안 저장되면 사진이 빠진다
    // 고른 사진은 그 입력 창(form)에 붙인다 — 줄이는 사이 창을 닫고 다른 기록을 열어도 그쪽에 섞이지 않게
    let picked = false;
    try { form._draft = { photo: await shrink(file, 1280, .82), thumb: await shrink(file, 320, .6) }; img.src = form._draft.photo; img.hidden = false; picked = true; }
    catch { toast('사진을 읽을 수 없어요', true); }
    ok.disabled = false;
    if (picked && form.isConnected && dlg.open) { form.querySelector('[data-act=analyze]').hidden = false; runAnalysis(form); }   // 사진을 고르면 바로 분석
  }
  t.value = '';
});
dlg.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = new FormData(f);
  if (f.dataset.form === 'product') {
    const p = readProduct(f);
    if (!p.name) return;
    const i = state.products.findIndex(x => x.id === p.id);
    i < 0 ? state.products.push(p) : (state.products[i] = p);
    if (!f.dataset.id && queue.length) { productForm(queue.shift(), true); toast(`‘${p.name}’ 저장했어요`); return void commit(); }      // 사진에서 읽은 다음 제품
  } else if (f.dataset.form === 'log') {
    if (f.inert) return;                      // 사진을 저장하는 사이 한 번 더 눌러도 기록이 둘 생기지 않게
    const old = state.logs.find(l => l.id === f.dataset.id);
    const l = cleanLog({ id: f.dataset.id, date: d.get('date'), tags: d.getAll('tags'), memo: d.get('memo'), thumb: f._draft?.thumb ?? old?.thumb });
    if (!l.thumb && !l.tags.length && !l.memo) return toast('사진·상태·메모 중 하나는 남겨 주세요', true);
    f.inert = true;
    try { if (f._draft) await idb.set('photo:' + l.id, f._draft.photo); } catch (err) { f.inert = false; return fail(err); }
    old ? Object.assign(old, l) : state.logs.push(l);
  } else if (e.submitter?.name === 'saveKey') return ACT.saveKey();      // 「키 저장」 또는 키 칸에서 Enter
  else return dlg.close();
  if (f.isConnected) dlg.close();            // 저장을 기다리는 사이 다른 창을 열었으면 그 창은 두고
  commit();
});

// 폰은 다음 날 탭을 다시 열어도 페이지를 새로 불러오지 않고 되살리기만 한다 → 날이 바뀌었으면 오늘 기준으로 다시 짠다
function refresh() {
  if (document.hidden || !state || shownDay === today()) return;
  shownDay = today(); dayIdx = todayIdx(); commit();
}
document.addEventListener('visibilitychange', refresh);
addEventListener('pageshow', refresh);

/* ───────── 자체 점검: index.html?test ───────── */
function selfTest() {
  const out = [], ok = (c, m) => out.push([!!c, m]), eq = (a, b, m) => ok(JSON.stringify(a) === JSON.stringify(b), `${m} → ${JSON.stringify(a)}`);
  eq(addMonths('2026-01-31', 1), '2026-02-28', '1/31 + 1개월은 2월 말일');
  eq(addMonths('2024-01-31', 1), '2024-02-29', '윤년 2월');
  eq(addMonths('2026-11-30', 3), '2027-02-28', '해를 넘기는 달 더하기');
  const P = o => cleanProduct({ name: 'x', inUse: true, ...o });
  eq(expiryOf(P({ expiry: '2027-06-01', openedAt: '2026-01-10', pao: 12 })), '2027-01-10', '개봉 기한이 더 빠르면 그쪽');
  eq(expiryOf(P({ expiry: '2026-06-01', openedAt: '2026-01-10', pao: 12 })), '2026-06-01', '적힌 기한이 더 빠르면 그쪽');
  eq(expiryOf(cleanProduct({ name: 'x', expiry: '2027-06-01', openedAt: '2026-01-10', pao: 12 })), '2027-06-01', '미개봉이면 개봉 기한 무시');
  eq([left(P({ expiry: '2026-11-20' }), '2026-11-16'), left(P({}), '2026-11-16')], [4, null], '남은 날');
  eq([expired(P({ expiry: '2026-11-16' }), '2026-11-16'), expired(P({ expiry: '2026-11-15' }), '2026-11-16')], [false, true], '기한 당일은 아직 사용 가능');
  for (const [name, cat, act] of [
    ['라운드랩 독도 토너', 'toner', []], ['이니스프리 레티놀 시카 앰플', 'serum', ['retinol']], ['코스알엑스 AHA/BHA 토너', 'toner', ['acid']],
    ['구달 청귤 비타민C 세럼', 'serum', ['vitc']], ['바이오더마 클렌징 워터', 'oil', []], ['닥터지 선크림 SPF50+', 'sun', []],
    ['일리윤 바디로션', 'body', []], ['라네즈 워터 슬리핑 마스크', 'sleep', []], ['Alpha 수분 크림', 'cream', []], ['모르는 것', 'etc', []],
    ['아이오페 임팩트 세럼', 'serum', []], ['레티놀 0.3', 'serum', ['retinol']], ['클리오 킬커버 팩트', 'makeup', []], ['메디힐 모델링 팩', 'mask', []],
  ]) eq(guess(name), { cat, actives: act }, `이름 추측: ${name}`);
  eq([date('2026-02-30'), date('2024-02-29'), date('2026-13-01'), date('26-11-16'), date(20261116)], ['', '2024-02-29', '', '', ''], '없는 날짜는 버림');

  const ps = [P({ id: 'cl', cat: 'cleanser' }), P({ id: 'to', cat: 'toner' }), P({ id: 's', cat: 'serum' }), P({ id: 'sr', cat: 'serum', actives: ['retinol'] }),
    P({ id: 'sc', cat: 'serum', actives: ['vitc'] }), P({ id: 'c1', cat: 'cream' }), P({ id: 'c2', cat: 'cream' }), P({ id: 'su', cat: 'sun' }), P({ id: 'ex', cat: 'exfol' }),
    P({ id: 'mk', cat: 'mask' }), P({ id: 'old', cat: 'eye', expiry: '2026-01-01' }), { ...P({ id: 'off', cat: 'lotion' }), inUse: false }, P({ id: 'lip', cat: 'makeup' })];
  const w = generate(ps, false, '2026-11-16'), all = w.flatMap(d => [...d.am, ...d.pm]);
  eq(w[0], { am: ['cl', 'to', 'sc', 'c1', 'su'], pm: ['cl', 'to', 'sr', 'c1'] }, '월요일 순서');
  eq(w.map(d => (d.am.includes('c1') ? 1 : 2) + (d.pm.includes('c1') ? 1 : 2) * 10), [11, 22, 11, 22, 11, 22, 11], '크림 2개는 날마다 번갈아');
  const wash = generate([P({ id: 'vc', cat: 'cleanser', actives: ['vitc', 'acid', 'retinol'] })], false, '2026-11-16');
  ok(wash.every(d => d.am[0] === 'vc' && d.pm[0] === 'vc'), '성분 든 클렌저도 매일 아침·저녁');
  ok(w.every(d => d.am.at(-1) === 'su'), '아침은 선크림으로 끝');
  ok(w.every(d => !['sr', 'ex', 'mk'].some(i => d.am.includes(i))), '레티놀·각질케어·팩은 아침에 없음');
  ok(w.every(d => !d.pm.includes('sc') && !d.pm.includes('su')), '비타민C·선크림은 저녁에 없음');
  eq(w.map(d => +d.pm.includes('sr')), [1, 0, 1, 0, 1, 0, 0], '레티놀은 월·수·금 저녁');
  eq(w.map(d => +d.pm.includes('ex')), [0, 1, 0, 0, 0, 1, 0], '각질케어는 화·토 저녁');
  eq(w.map(d => +d.pm.includes('mk')), [0, 0, 0, 1, 0, 0, 1], '팩은 목·일 저녁');
  ok(!['old', 'off', 'lip'].some(i => all.includes(i)), '만료·미사용·메이크업은 제외');
  ok(all.includes('c1') && all.includes('c2') && w.every(d => [d.am, d.pm].every(s => s.filter(i => i[0] === 'c' && i[1] !== 'l').length === 1)), '같은 종류는 한 칸에 하나씩 돌려 씀');
  const calm = generate(ps, true, '2026-11-16').flatMap(d => d.pm);
  ok(!calm.includes('sr') && !calm.includes('ex') && calm.includes('mk'), '예민하면 레티놀·각질케어만 쉼');
  eq([isCalm([{ date: '2026-11-14', tags: ['예민'] }], '2026-11-16'), isCalm([{ date: '2026-11-01', tags: ['예민'] }], '2026-11-16'),
    isCalm([{ date: '2026-11-14', tags: ['예민'] }, { date: '2026-11-15', tags: ['좋음'] }], '2026-11-16'), isCalm([], '2026-11-16'),
    isCalm([{ date: '2026-11-14', tags: ['예민'] }, { date: '2027-11-15', tags: ['좋음'] }], '2026-11-16'), isCalm([{ date: '2027-01-01', tags: ['예민'] }], '2026-11-16')],
    [true, false, false, false, true, false], '예민 판정은 최근 7일·가장 최근 기록·앞날짜 무시');
  eq(cleanProduct({ name: 'B', cat: ['serum'] }).cat, 'etc', '종류 값이 배열이면 버림');
  eq([cleanAnalysis({ ok: true, tags: ['좋음', '건조', '<b>', '건조'], summary: '  볼이 건조해요 ' }), cleanAnalysis({ ok: false, tags: ['트러블'], summary: '너무 어두워요' }), cleanAnalysis(null)],
    [{ ok: true, tags: ['건조'], summary: '볼이 건조해요' }, { ok: false, tags: [], summary: '너무 어두워요' }, { ok: false, tags: [], summary: '' }], 'AI 결과 정리');
  eq(cleanAnalysis({ ok: true, tags: [], summary: '볼이 붉어요.\n\n피부과 상담을 권해요.' }).summary, '볼이 붉어요. 피부과 상담을 권해요.', 'AI 요약은 한 줄로');
  eq([...cleanItems({ items: [{ name: ' 라운드랩\n독도  토너 ', cat: 'toner', actives: ['acid', 'x'], expiry: '2027-06-31', pao: 12, opened: true, inUse: true },
    { name: '', cat: 'serum' }, { name: 'B', cat: 'nope', pao: 5, expiry: '2027-06-30' }, 'junk'] }).map(({ id, ...p }) => p), cleanItems(null)],
    [{ name: '라운드랩 독도 토너', cat: 'toner', actives: ['acid'], expiry: '', opened: false, openedAt: '', pao: 12, inUse: false, memo: '' },
      { name: 'B', cat: 'etc', actives: [], expiry: '2027-06-30', opened: false, openedAt: '', pao: 0, inUse: false, memo: '' }, []], 'AI가 읽은 화장품 정리');
  const G = (parts, finishReason = 'STOP') => ({ candidates: [{ content: { parts }, finishReason }] });
  eq(readGemini(G([{ text: '생각 중', thought: true }, { text: '{"ok":true,' }, { text: '"tags":["건조"],"summary":"s"}' }])), { ok: true, tags: ['건조'], summary: 's' }, 'Gemini 답: 생각 부분은 빼고 이어 붙여 읽기');
  const why = r => { try { readGemini(r); return 'ok'; } catch (e) { return /분석하지 않았/.test(e.message) ? 'blocked' : 'broken'; } };
  eq([why({ promptFeedback: { blockReason: 'IMAGE_SAFETY' } }), why(G([], 'PROHIBITED_CONTENT')), why(G([], 'OTHER')), why(G([{ text: '{"ok":' }], 'MAX_TOKENS')), why(G([], 'MAX_TOKENS')), why(undefined)],
    ['blocked', 'blocked', 'blocked', 'broken', 'broken', 'broken'], 'Gemini 답: 차단·사실상 거절·잘림·빈 응답');

  const cs = cleanState({ products: [{ id: 'a', name: ' A ', cat: 'constructor', pao: 5, actives: ['x', 'vitc'], inUse: 1 }, { id: 'a', name: '중복' }, { name: '  ' }, 7],
    routine: { manual: 1, days: [{ am: ['a', 'a', 'ghost'], pm: 'x' }] }, logs: [{ id: 'l', date: 'nope', thumb: 'javascript:alert(1)', tags: ['예민', '<b>'] }] });
  eq(cs.products, [{ id: 'a', name: 'A', cat: 'etc', actives: ['vitc'], expiry: '', opened: true, openedAt: '', pao: 0, inUse: true, memo: '' }], '가져온 화장품 정리');
  eq([cs.routine.manual, cs.routine.days.length, cs.routine.days[0], cs.logs[0].thumb, cs.logs[0].tags, cs.logs[0].date === today()], [true, 7, { am: ['a'], pm: [] }, '', ['예민'], true], '가져온 루틴·기록 정리');
  eq(cleanState(cleanState(undefined)), { products: [], logs: [], routine: { manual: false, days: DAYS.map(() => ({ am: [], pm: [] })) } }, '빈 상태');

  const bad = out.filter(([c]) => !c);
  document.title = bad.length ? `TEST FAIL ${bad.length}/${out.length}` : `TEST OK ${out.length}`;
  view.innerHTML = `<div class="card"><h2>${esc(document.title)}</h2><ol>${out.map(([c, m]) => `<li>${c ? '✅' : '❌'} ${esc(m)}</li>`).join('')}</ol></div>`;
}

/* ───────── 시작 ───────── */
(async () => {
  if (location.search === '?test') return selfTest();
  let loaded = false;
  try {
    const saved = await idb.get('state').catch(() => idb.get('state'));      // 연결이 끊겼으면 idb 가 다시 열어 한 번 더
    state = cleanState(saved); loaded = saved != null;
  } catch {
    state = cleanState(); noSave = true;
    toast('저장된 내용을 읽지 못했어요. 새로고침해 보세요. 지금 고친 내용은 저장되지 않아요.', true);
  }
  if (!state.routine.manual) state.routine.days = generate(state.products, isCalm(state.logs, today()), today());
  render();
  navigator.storage?.persist?.().catch(() => {});      // 브라우저가 임의로 비우지 않게 요청 (거절돼도 동작)
  idb.del('apiKey').catch(() => {});                   // ponytail: Claude 를 쓰던 때의 키 자리 — 남은 키가 있으면 지운다. 몇 달 뒤 이 줄은 지워도 된다
  // 사진 정리는 저장된 상태를 제대로 읽었을 때만(못 읽었는데 지우면 사진을 다 잃는다), 그리고 앱이 이 창 하나에서만 열려 있을 때만 —
  // 처음 연 창이 잠금을 닫힐 때까지 쥐고 있어서, 다른 창이 사진을 쓰는 도중에 지우지 않는다. 잠금을 못 쓰는 브라우저면 정리하지 않는다
  if (loaded) navigator.locks?.request('vanity-sweep', { ifAvailable: true }, lock => lock && sweepPhotos().then(() => new Promise(() => {}))).catch(() => {});
})();
// 기록이 가리키지 않는 사진(저장·가져오기가 중간에 실패한 흔적)을 치운다. 키 목록 읽기와 지우기를 한 트랜잭션으로
function sweepPhotos() {
  const keep = new Set(state.logs.map(l => 'photo:' + l.id));
  return idb.run('readwrite', s => {
    const q = s.getAllKeys();
    q.onsuccess = () => { for (const k of q.result) if (typeof k === 'string' && k.startsWith('photo:') && !keep.has(k)) s.delete(k); };
    return q;
  });
}
