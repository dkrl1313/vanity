<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1716">
<title>화장대</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="화장대">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧴%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f5; --card: #fff; --ink: #2b2523; --muted: #756a65; --line: #ebe3de;
  --accent: #a94f43; --on-accent: #fff; --soft: #f6e9e5;
  --warn: #8a5300; --warn-bg: #fdf0d5; --bad: #b3261e; --bad-bg: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1716; --card: #262120; --ink: #f2eae7; --muted: #a99d98; --line: #3a322f;
    --accent: #e8a094; --on-accent: #2a1410; --soft: #3a2824;
    --warn: #ffd08a; --warn-bg: #3e2f12; --bad: #ffb4ab; --bad-bg: #4b1f1b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto; max-width: 560px; min-height: 100dvh; background: var(--bg); color: var(--ink);
  padding: 0 16px calc(80px + env(safe-area-inset-bottom));
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 0; }
small, .muted { color: var(--muted); font-size: 13px; font-weight: 400; }
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }        /* display 를 준 카드(.prod 등)도 hidden 이면 숨긴다 */
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .35; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.danger { color: var(--bad); border-color: transparent; background: none; }
.wide { width: 100%; min-height: 48px; margin-bottom: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; }
header select { width: auto; min-width: 0; max-width: 50%; min-height: 40px; margin-right: auto; padding: 4px 12px; font-size: 14px; font-weight: 600; border-radius: 999px; background: var(--card); text-overflow: ellipsis; }      /* 장소 고르기: 제목 바로 옆, ⋯ 는 오른쪽 끝 */
header button { border: 0; background: none; font-size: 22px; min-width: 44px; min-height: 44px; padding: 0; }
nav {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav button { border: 0; border-radius: 0; background: none; min-height: 56px; color: var(--muted); font-size: 14px; }
nav button[aria-current] { color: var(--accent); font-weight: 700; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: #b3261e; color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.on { background: var(--soft); color: var(--accent); border-color: transparent; }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.secret { -webkit-text-security: disc; }     /* 비밀번호 칸으로 두면 비밀번호 관리자가 키를 저장하려 든다 */
.ai { margin: 0; background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
.note button { display: block; margin-top: 8px; }
.note summary { cursor: pointer; }
.note details span { display: block; margin-top: 6px; }
.empty { text-align: center; padding: 40px 12px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 17px; }
.chip { min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.filters .chip[aria-pressed=true], .skinrow .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.skinrow { display: flex; align-items: center; gap: 5px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }      /* 루틴 화면의 「오늘 피부」 한 줄 — 좁으면 옆으로 민다 */
.skinrow > * { flex: none; }
.skinrow .chip { padding: 4px 6px; }           /* 여섯 개가 좁은 폰(360px) 한 줄에 들어가게 */
.skinrow .lbl { border: 0; background: none; padding: 4px 0; min-height: 34px; border-radius: 6px; font-size: 13px; color: var(--muted); }      /* 「오늘 피부 ✏️」 — 눌러서 오늘 기록 창(메모) */
.kinds { margin: 0 0 10px; line-height: 1.7; }
.kinds span { white-space: nowrap; }
.kinds b { color: var(--ink); }
.search { margin-bottom: 10px; }
.sortbar { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.sortbar label { display: flex; align-items: center; gap: 8px; }
.sortbar select { width: auto; min-height: 36px; padding: 4px 10px; font-size: 14px; }

/* 루틴 */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.day { padding: 4px 0; min-height: 54px; display: grid; justify-items: center; align-content: center; border-radius: 12px; }
.day b { font-size: 15px; }
.day small { font-size: 10.5px; line-height: 15px; min-height: 15px; }
.day[aria-current] { border-color: var(--accent); }
.day[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed=true] small { color: inherit; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.bar small { flex: 1; min-width: 150px; }
.bar [aria-pressed=true] { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.what { flex: 1; min-width: 0; display: grid; }
button.what { border: 0; background: none; padding: 2px 0; min-height: 0; border-radius: 6px; text-align: left; }      /* 루틴에서 눌러 상세 열기 */
.what .memo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }      /* 바르는 법 메모는 한 줄로 (전체는 상세에서) */
.what b { font-weight: 600; }
.ctl { display: flex; gap: 4px; flex: none; }
.ctl button { min-width: 36px; min-height: 36px; padding: 0; }
.card select { margin-top: 8px; }
.tick { flex: none; width: 40px; min-height: 40px; padding: 0; border-radius: 50%; color: var(--line); font-weight: 700; }      /* 발랐어요 체크 */
.tick[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps li:has(.tick[aria-pressed=true]) .what { opacity: .5; }
.week { margin: 0 0 10px; }

/* 화장품 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prod { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.prod .name { border: 0; background: none; padding: 4px 0; min-height: 0; text-align: left; font-weight: 600; }
.prod .acts { grid-column: 1 / -1; }
.alts { list-style: none; margin: 0; padding: 0; }
.alts li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.check li { align-items: flex-start; }      /* 점검 항목은 여러 줄이라 위로 맞춘다 */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.what .for { margin-top: 6px; color: var(--ink); font-weight: 700; }
.acts button { min-height: 32px; padding: 4px 10px; font-size: 13px; }

/* 피부 기록 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.log { padding: 0 0 10px; border-radius: 16px; overflow: hidden; display: grid; gap: 4px; text-align: left; align-content: start; }
.log img, .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.log b, .log small, .log .tags { padding: 0 10px; }
.log .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.log small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 입력 창 */
dialog { border: 0; border-radius: 18px; padding: 20px; width: min(100vw - 24px, 480px); max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
form { display: grid; gap: 14px; }
form > label, .two label, .more label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.more summary { padding: 11px 0; font-size: 14px; color: var(--muted); cursor: pointer; }
.more > div { display: grid; gap: 14px; padding-top: 4px; }
.field { display: grid; gap: 5px; }
.help summary { padding: 2px 0; font-size: 13px; color: var(--muted); cursor: pointer; list-style: none; }
.help summary::-webkit-details-marker { display: none; }
.help summary::after { content: ' ⓘ'; }
.help small { display: block; margin-top: 4px; }
.restnote { color: var(--ink); }
.restnote:empty { display: none; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-size: 13px; color: var(--muted); }
input:not([type=checkbox], [type=radio]), select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
textarea { resize: vertical; }
input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
form > label.pill, label.pill { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--ink); cursor: pointer; }
label.pill:has(:checked) { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 10px; }
form:has([name=opened]:not(:checked)) .if-opened { display: none; }
.ago { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: -4px; }
.ago small { color: var(--muted); margin-right: 2px; }
.actions { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
form > label.btn, .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.btn:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }      /* 창이 열릴 때 자동 초점엔 안 뜨고 키보드로 옮겼을 때만 */
.btn:has(:disabled) { opacity: .35; pointer-events: none; }
.preview { width: 100%; max-height: 46dvh; object-fit: contain; border-radius: 12px; background: var(--bg); }
.sr, input.sr { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); }

#toast { inset: auto auto calc(72px + env(safe-area-inset-bottom)) 50%; translate: -50% 0; margin: 0; border: 0; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; max-width: calc(100vw - 32px); }
#toast.bad { background: #b3261e; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>화장대</h1>
  <select id="place" aria-label="장소" title="장소" hidden></select>
  <button data-act="backup" aria-label="설정·백업" title="설정·백업">⋯</button>
</header>
<p id="twin" class="note" hidden>⚠ 화장대가 다른 탭·창에도 열려 있어요. 저장이 막힐 수 있으니 하나만 남기고 닫아 주세요.</p>
<p id="old" class="note" role="alert" hidden>⚠ 화장대가 새 판으로 바뀌었어요. 이 화면은 옛 판이라 저장되지 않아요 — 새로고침해 주세요.</p>
<p id="stuck" class="note" role="alert" hidden>⚠ 저장이 끝나지 않고 있어요. 다른 탭·창에 열린 화장대를 모두 닫아 주세요. 지금 새로고침하면 방금 고친 내용이 사라져요.</p>
<main id="view"></main>
<nav aria-label="화면">
  <button data-act="tab" data-tab="routine">루틴</button>
  <button data-act="tab" data-tab="products">화장품<span id="soon" class="count" hidden></span></button>
  <button data-act="tab" data-tab="skin">피부 기록</button>
</nav>
<dialog id="dlg"></dialog>
<p id="toast" role="status" popover="manual"></p>

<script>
'use strict';

/* ───────── 기준값 ───────── */
// 종류: 적힌 순서 = 바르는 순서. [이름, 자동 루틴에 넣는 때] ('' = 루틴에 넣지 않음)
const CATS = {
  oil: ['클렌징오일·밤', 'pm'], cleanser: ['폼클렌저', 'both'], exfol: ['각질케어', 'pm'], toner: ['토너·스킨', 'both'],
  essence: ['에센스', 'both'], mask: ['마스크팩', 'pm'], serum: ['세럼·앰플', 'both'], eye: ['아이크림', 'both'],      // 마스크팩은 에센스 다음 (11-17)
  lotion: ['로션·에멀전', 'both'], cream: ['크림', 'both'], faceoil: ['페이스오일', 'pm'], sleep: ['슬리핑팩', 'pm'],
  sun: ['선크림', 'am'], makeup: ['메이크업', ''], body: ['바디·헤어', ''], etc: ['기타', ''],
};
const ORDER = Object.keys(CATS);
const ACTIVES = { retinol: '레티놀', acid: 'AHA·BHA·효소', vitc: '비타민C' };      // acid = 각질을 녹이는 것 (산·효소 세안제)
const PAOS = [3, 6, 12, 18, 24, 36];          // 개봉 후 사용기간(개월) 선택지
// 개봉일 빠르게 고르기: [이름, 며칠 전, 몇 달 전] — 정확한 날을 몰라도 추정 기한이 대략 맞게
const AGO = [['오늘', 0, 0], ['1주 전', 7, 0], ['1달 전', 0, 1], ['3달 전', 0, 3], ['6달 전', 0, 6], ['1년 전', 0, 12]];
const agoDate = (now, d, m) => addMonths(addDays(now, -d), -m);
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SLOTS = { am: '아침', pm: '저녁' };
const TAGS = ['좋음', '건조', '유분', '트러블', '홍조', '예민'];
// 레티놀·각질케어는 저녁에만, 서로 다른 날에. 목·일은 쉬는 날이라 팩을 둔다
const NIGHTS = { retinol: [0, 2, 4], acid: [1, 5], pack: [3, 6] };
// 자동 루틴을 조금씩 바꾸는 규칙: 계절(날짜로 자동)·피부 타입(⋯ 메뉴)·건조 기록(DRY). 예민한 주가 우선(레티놀·각질을 다 쉼), 직접 고친 루틴은 그대로
// nights = 그 성분을 쓰는 저녁을 줄인다(여러 규칙이면 겹치는 날만 = 덜 쓰는 쪽), amLight = 아침엔 로션까지만(크림·페이스오일은 저녁)
const SEASONS = {
  change: { name: '환절기', nights: { retinol: [0, 4] }, note: '환절기: 레티놀은 주 2회(월·금)' },      // 피부가 쉽게 예민해지는 때
  summer: { name: '여름', nights: {}, amLight: true, note: '여름: 아침은 로션까지, 크림·페이스오일은 저녁에' },
  winter: { name: '겨울', nights: { acid: [5] }, note: '겨울: 각질케어는 주 1회(토)' },                 // 건조한 때
};
const SKINS = {
  dry: { name: '건성', nights: { acid: [5] }, note: '건성: 각질케어는 주 1회(토)' },
  normal: { name: '중성', nights: {} },
  oily: { name: '지성', nights: {}, amLight: true, note: '지성: 아침은 로션까지, 크림·페이스오일은 저녁에' },
  combo: { name: '복합성', nights: {} },
  dehyd: { name: '수부지', nights: {}, amLight: true, note: '수부지: 아침은 로션까지, 크림·페이스오일은 저녁에' },
};
const SENSITIVE = { name: '민감성', nights: { retinol: [0, 4] }, note: '민감성: 레티놀은 주 2회(월·금)' };
// 건조한 주: 최근 7일 안의 피부 기록에 '건조'가 있으면 「아침엔 로션까지만」(amLight)을 쉰다 — 여름·지성·수부지여도 아침에 크림·페이스오일 (amFull)
// 예민한 주(가장 최근 기록 하나만 봄)와 달리 7일 안의 기록을 모두 본다 — AI 사진 기록은 번들거림(유분)을 주로 적고 건조는 드물게 붙여서, 가장 최근 것만 보면 날마다 켜졌다 꺼졌다 한다 (11-25)
const DRY = { name: '건조', nights: {}, amFull: true, note: '건조 기록: 아침에도 크림·페이스오일' };
const isDry = (logs, now) => !!logs?.some(l => l.date <= now && daysBetween(l.date, now) <= 7 && l.tags.includes('건조'));
// 쉬는 저녁(제품별로 고름): 그 성분을 쓰는 저녁엔 이 제품을 뺀다 — 예: 각질 마스크 위에 꾸덕한 밤을 덮지 않게. [이름, 해당 묶음]

// 피부 기록 날짜(day) 앞 FRESH_DAYS 일 안에 새로 뜯은 제품 이름(최근에 뜯은 것부터) — 피부가 뒤집혔을 때 새로 쓴 것을 짚어 보게. 보여 주기만 하고 루틴은 건드리지 않는다
// 모든 장소의 제품과 다 쓴 제품(안 맞아 금방 정리했을 수도)을 본다
// ponytail: 같은 날 BULK 개 이상 개봉으로 적힌 날은 앱에 한꺼번에 등록한 날로 보고 뺀다 — 등록하면 개봉일이 그날로 들어가 실제로 뜯은 날이 아니다(11-18 실제 데이터: 38개가 등록한 이틀에 몰림). 세트를 한날 뜯은 경우까지 가리려면 「등록한 날」을 따로 저장해야 한다
const FRESH_DAYS = 14, BULK = 4;
const everOpened = s => ['products', 'done'].flatMap(k => shelves(s, k).flatMap(([, list]) => list)).filter(p => p.openedAt);      // 개봉일이 적힌 것 전부 (모든 장소 + 다 쓴 제품)
const firstDay = p => p.openedWas || p.openedAt;      // 처음 적혀 있던 개봉일 (바로잡아 옮긴 제품은 옮기기 전 날)
// 처음 적힌 개봉일 → 그날 것으로 적힌 개수. 옮기기 전 날로 세어야 바로잡는 중에 그날 묶음이 BULK 아래로 줄어 남은 제품이 대상에서 빠지지 않는다
// ponytail: 다 쓴 제품 기록엔 openedWas 가 없어, 바로잡은 제품을 다 쓰면 그날 개수가 하나 준다 — 문제가 되면 cleanDone 에도 남긴다
const openedDays = s => everOpened(s).reduce((n, p) => (n[firstDay(p)] = (n[firstDay(p)] ?? 0) + 1, n), {});
function freshAt(s, day) {
  const all = everOpened(s), n = openedDays(s);      // 옮긴 개봉일(firstDay 와 다름)은 뺀다 — 바로잡기의 어림은 2주를 가리기엔 거칠다. ponytail: 제품 창에서 정확히 고친 날도 같이 빠진다(어림과 구분하려면 칸이 하나 더 필요)
  return [...new Set(all.filter(p => p.openedAt <= day && p.openedAt >= addDays(day, -FRESH_DAYS) && n[firstDay(p)] < BULK && firstDay(p) === p.openedAt).sort((a, b) => b.openedAt.localeCompare(a.openedAt)).map(p => p.name))];
}
// 개봉일 바로잡기: 개봉 상태로 등록하면 개봉일이 등록한 날로 들어가, 개봉일로 셈하는 기한(개봉 후 사용기간·종류별 추정)이 실제보다 늦게 잡힌다
// 대상(이 장소, 이름순) = 개봉일이 한꺼번에 등록한 날(같은 날 BULK 개 이상)이고, 아직 확인하지 않았고(openedWas 가 빔), 개봉일이 당겨지면 기한이 달라지는 제품 — 적힌 기한만으로 정해지는 제품은 묻지 않는다
function openedDoubt(s) {
  const n = openedDays(s);
  return s.products.filter(p => p.opened && p.openedAt && !p.openedWas && n[p.openedAt] >= BULK && expiryOf(p) !== expiryOf({ ...p, openedAt: agoDate(p.openedAt, 0, 12) }))      // 1년 당겨 보아 기한이 달라지나
    .sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(p => p.id);
}
// 고른 날(at, 제품 창의 「언제쯤 뜯었나요」와 같은 선택지 — AGO)로 개봉일을 당긴다. at = '' 이면 적힌 날 그대로. 적혀 있던 날(등록한 날)보다 늦어지지는 않는다(등록할 때 이미 뜯은 것이니). 어느 쪽이든 적혀 있던 날을 openedWas 에 남겨 확인한 것으로 표시 (이미 남아 있으면 그대로 — 처음 적힌 날을 잃지 않게)
const openedSet = (p, at) => ({ ...p, openedAt: at && at < p.openedAt ? at : p.openedAt, openedWas: p.openedWas || p.openedAt });
const countAll = s => s.products.length + Object.values(s.away).reduce((n, a) => n + a.products.length, 0);      // 모든 장소의 화장품 수

/* ───────── 같이 쓰기 — 계산 (화장품·다 쓴 제품 목록만 Firebase 주소 한 곳에 두고 여러 기기가 맞춘다. 피부 타입·피부 기록·체크·루틴은 기기마다 따로) ───────── */
// 서버의 방: { v: 1, products: { <id>: 화장품 }, done: { <id>: 다 쓴 기록 } }. 표시(v)가 없으면 빈 방(처음이거나 지워진 것)
// base = 지난번 맞춘 뒤 서버에 있던 내용(Map: id → 글). 이것과 견줘 「누가 바꿨나」를 가린다 — 시계도 삭제 표시도 없이
const SYNCED = [['products', cleanProduct], ['done', cleanDone]];
const SYNC_ID = /^[\w-]{1,40}$/;              // Firebase 키로 못 쓰는 글자(. $ # [ ] /)가 든 id 는 올리지 않고 이 기기에만 둔다 (앱이 만든 id 는 모두 통과)
// 받는 주소: Firebase 주소만(다른 곳으로 목록을 보내지 않게). 방 번호가 없으면 새 방을 만드는 것 → [전체, 서버 주소, 방 번호]
const SYNC_IN = /^(https:\/\/[a-z0-9-]+\.(?:firebaseio\.com|[a-z0-9-]+\.firebasedatabase\.app))(?:\/rooms\/([A-Za-z0-9]{20,64}))?\/?$/;

const snapOf = list => new Map(list.filter(x => SYNC_ID.test(x.id)).map(x => [x.id, JSON.stringify(x)]));
// 서버 목록 받기: 서버가 그대로인 것은 이 기기 것을 두고(이 기기만 고쳤거나 새로 넣은 것 포함), 서버가 바뀐 것은 서버 것으로(지워졌으면 뺀다)
// 양쪽이 다 고쳤으면 서버 것이 이긴다 — 옛 백업을 가져온 기기가 같이 쓰는 목록을 덮지 않게
// ponytail: 읽고 올리는 그 짧은 사이(1초 안팎)에 상대도 같은 화장품을 올리면 나중에 올린 쪽이 남는다. 두 사람이 동시에 같은 제품을 고치는 일이 잦아지면 제품마다 조건부 쓰기(if-match)로
function pullList(base, mine, theirs) {
  const snap = snapOf(theirs), byId = new Map(theirs.map(y => [y.id, y])), has = new Set(mine.map(x => x.id)), out = [];
  for (const x of mine) {
    const r = snap.get(x.id) ?? '';
    if (!SYNC_ID.test(x.id) || r === (base.get(x.id) ?? '') || r === JSON.stringify(x)) out.push(x);
    else if (r) out.push(byId.get(x.id));
  }
  return [...out, ...theirs.filter(y => !has.has(y.id) && snap.get(y.id) !== base.get(y.id))];      // 서버에 새로 생긴 것 (base 와 같으면 이 기기에서 지운 것이라 안 받는다)
}
// 서버에 보낼 것: 이 기기 목록이 서버 내용(snap)과 다른 것만. 서버에만 있는 것은 이 기기에서 지운 것이니 지운다(null)
function diffList(mine, snap) {
  const now = snapOf(mine), out = new Map();
  for (const x of mine) if (now.has(x.id) && now.get(x.id) !== snap.get(x.id)) out.set(x.id, x);
  for (const id of snap.keys()) if (!now.has(id)) out.set(id, null);
  return out;
}
// 한 번 맞추기: 서버의 방 내용(room)으로 이 기기 상태를 고치고(s) → 서버에 보낼 것(patch: 한 번에 여러 자리를 고치는 Firebase PATCH 글)과 서버의 지금 내용(snap)을 낸다
function syncStep(base, s, room) {
  const live = !!room && typeof room === 'object' && room.v === 1;      // 표시가 없는 방은 base 를 믿지 않는다 — 이 기기 목록을 지우지 않고 다시 올린다 (서버가 비워져도 목록을 잃지 않게)
  const theirs = {}, next = {}, snap = {}, patch = live ? {} : { v: 1 };
  for (const [k, clean] of SYNCED) {            // 서버 내용도 믿지 않는다: id 는 키로, 값은 정리해서. 이름 없는 것·모르는 키는 없는 것으로
    theirs[k] = Object.entries(live && room[k] && typeof room[k] === 'object' ? room[k] : {})
      .filter(([id, v]) => SYNC_ID.test(id) && v && typeof v === 'object').map(([id, v]) => clean({ ...v, id })).filter(x => x.name);
    next[k] = pullList(live ? base[k] : new Map(), s[k], theirs[k]);
  }
  const changed = SYNCED.some(([k]) => JSON.stringify(next[k]) !== JSON.stringify(s[k]));
  if (changed) s = cleanState({ ...s, ...next });      // 지워진 제품을 가리키던 「먼저 바를 제품」·루틴 자리·체크도 여기서 정리된다 (그래서 보낼 것은 정리한 뒤에 센다)
  for (const [k] of SYNCED) { snap[k] = snapOf(theirs[k]); for (const [id, x] of diffList(s[k], snap[k])) patch[`${k}/${id}`] = x; }

}
// 보낸 것(patch)이 들어간 뒤의 서버 내용 — 다음 맞추기의 base
function settle(snap, patch) {
  const out = Object.fromEntries(SYNCED.map(([k]) => [k, new Map(snap[k])]));
  for (const [key, x] of Object.entries(patch)) { const i = key.indexOf('/'); if (i > 0) x ? out[key.slice(0, i)].set(key.slice(i + 1), JSON.stringify(x)) : out[key.slice(0, i)].delete(key.slice(i + 1)); }
  return out;
}

/* ───────── 저장소 (이 브라우저의 IndexedDB. 키: state, photo:<기록 id>, geminiKey, sync, check = 마지막 AI 점검 답) ───────── */
// DB_V = 저장 내용의 판(IndexedDB 버전). 옛 판이 모르는 칸을 더하거나 정리 한도(글자 수 등)를 바꿀 때 올린다 — 그러면 옛 판이 떠 있는 탭은 저장소를 열지 못해(VersionError) 읽지도 쓰지도 못한다

// ★아직 1 이다(11-23): 57b10c4 까지의 판은 버전이 오를 때 연결을 스스로 닫지 않아서(onversionchange 없음), 그런 탭이 연결을 쥐고 있으면 새 판이 저장소를 열지 못한다(빈 화면 + 「읽지 못했어요」).
//   이 판부터는 닫는다(아래 onversionchange). 다음에 칸을 더할 때 2 로 올린다 — 그때쯤이면 닫지 않는 옛 탭은 남아 있지 않다. 올릴 때 막힌 경우의 안내(onblocked: 「다른 탭의 화장대를 닫아 주세요」)도 같이 넣을 것
// 제품·다 쓴 기록(같이 쓰는 목록)에 칸을 더하면 같이 쓰기 방의 판(v — syncStep·syncOnce·연결할 때의 1)도 같이 올린다: 옛 판 기기가 그 제품을 고쳐 올리면 새 칸 없이 통째로 올라가 상대 것까지 지워진다. 옛 판은 모르는 판의 방을 건드리지 않는다('new' — 새로고침할 때까지 맞추기만 멈춘다)
//   ★올릴 때 `room.v === 1` 을 2 로만 바꾸면 안 된다 — v1 방을 빈 방으로 보고(live = false) 이 기기 목록 전체로 덮어서, 상대가 고친 것이 옛 사본으로 덮이고 지운 것이 되살아난다.
//   새 판은 v1 방도 그대로 읽고(live, base 도 그대로 쓴다 — 새 칸은 정리 함수가 기본값으로 채운다) 올릴 때 v: 2 를 같이 적으며, 받는 판 확인은 1·2 를 모두 받아야 한다 (11-23 검토)
// 자체 점검의 「저장 칸」 줄이 칸 목록과 이 수를 같이 지킨다
const DB_V = 1;
const idb = (() => {
  let open;                                   // 연결이 끊기면(iOS 가 백그라운드 탭에서 끊기도 함) 다음 요청 때 다시 연다
  const conn = () => open ??= new Promise((ok, no) => {
    const r = indexedDB.open('vanity', DB_V);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };      // 버전만 올릴 때는 칸이 이미 있다 (내용은 그대로 둔다)
    r.onsuccess = () => { const db = r.result; db.onclose = () => (open = null); db.onversionchange = () => db.close(); ok(db); };      // 새 판이 버전을 올릴 때 이 탭이 막지 않게 스스로 닫는다 (닫힌 연결은 다음 요청 때 run 이 새로 연다 → 그때 VersionError)
    r.onerror = () => no(r.error);
  });
  // 다른 탭·창에 열린 이 앱이 저장소 작업을 끝내지 못한 채 멈춰 있으면(폰이 숨은 탭을 작업 도중에 얼린 경우), 이 탭의 쓰기는 오류도 없이 끝나지 않고 그 뒤 읽기까지 줄줄이 멈춘다
  // (11-18 실제 유실: 등록한 화장품이 목록엔 보이는데 저장이 안 끝나 새로고침 뒤 사라지고, ⋯ 메뉴도 안 열림)
  // → 쓰기가 SLOW 넘게 안 끝나면 화면에 알리고(stuck — 끝나면 지운다), 읽기는 WAIT 까지만 기다리고 그만둔다. 쓰기는 그만두지 않는다(막은 쪽이 풀리면 그때 들어간다)
  const SLOW = 4000, WAIT = 6000;
  let late = 0;
  const run = (mode, fn, again = true) => {
    let slow = false;
    const timer = mode === 'readwrite' && setTimeout(() => { slow = true; if (!late++) stuck(true); }, SLOW);
    return conn().then(db => new Promise((ok, no) => {
      const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
      t.oncomplete = () => ok(q.result);
      t.onerror = t.onabort = () => no(t.error);
    })).catch(e => {
      open = null;
      if (e?.name === 'VersionError') outdated();      // 저장소가 이 판보다 새 판 것이다 — 이 화면은 옛 판 (DB_V)
      if (again && e?.name === 'InvalidStateError') return run(mode, fn, false);      // 닫히는 중인 연결을 잡았으면(숨을 때 닫는다 — rest) 새 연결로 한 번 더
      throw e;
    }).finally(() => { clearTimeout(timer); if (slow && !--late) stuck(false); });
  };
  const quick = p => new Promise((ok, no) => { const t = setTimeout(no, WAIT, Object.assign(new Error('저장소가 응답하지 않아요'), { name: 'TimeoutError' })); p.then(ok, no).finally(() => clearTimeout(t)); });
  // 화면이 숨으면 연결을 놓는다 — 하던 작업은 마저 끝나고, 다음에 쓸 때 다시 연다. 숨은 탭이 다른 탭의 저장을 막는 쪽이 되지 않게
  const rest = () => { const p = open; open = null; p?.then(db => db.close()).catch(() => {}); };
  return { get: k => quick(run('readonly', s => s.get(k))), set: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)),
    run, rest };
})();

    guessGone ? `그중 ${guessGone}개는 종류별 보통 사용기간으로 잡은 추정 기한이에요 — 아직 괜찮으면 제품에 실제 기한을 적어 주세요.` : '',
    '<button data-act="tab" data-tab="products" data-f="soon" aria-label="기한 지난 제품 보러 가기">보러 가기</button>'));      // 화장품 탭의 「임박·만료」로 — 거기서 눌러 다 썼어요·기한 고치기
  // 루틴에 안 넣은 제품의 기한이 곧 끝나면 알린다 (offSoon). 하나면 바로 그 제품 창으로, 여럿이면 「임박·만료」로
  const offs = offSoon(state, now), until = p => `${knownExpiry(p) ? '기한' : '추정 기한'}이 ${left(p, now) ? `${left(p, now)}일 남았어요` : '오늘까지예요'}`;
  if (offs.length) notes.push(note(offs.length === 1 ? `루틴에 안 넣은 ‘${esc(offs[0].name)}’ ${until(offs[0])}` : `루틴에 안 넣은 제품 ${offs.length}개의 기한이 ${SOON}일 안에 끝나요`,
    `${offs.length > 1 ? offs.map(p => `· ${esc(p.name)} — ${until(p)}`).join('<br>') + '<br>' : ''}쓰는 때를 「루틴에 안 넣음」으로 둔 제품은 앱이 루틴에 다시 넣지 않아요. 루틴에 넣으려면 제품을 열어 쓰는 때를 바꿔 주세요.`,
    offs.length === 1 ? `<button data-act="editProduct" data-id="${esc(offs[0].id)}" aria-label="${esc(offs[0].name)} 열어 보기">열어 보기</button>`
      : '<button data-act="tab" data-tab="products" data-f="soon" aria-label="루틴에 안 넣은 임박 제품 보러 가기">보러 가기</button>'));
  // 이번 주에 빠진 제품은 펼치면 언제 다시 들어오는지도 — 직접 넣을지 기다릴지 정하기 쉽게 (자동 루틴만: 직접 고친 루틴은 돌아가지 않는다)
  const back = ps => { const t = nextTurns(state, ps.map(p => p.id), now); return `다시 들어오는 때 (지금 제품·설정 그대로면)<br>${ps.map(p => `· ${esc(p.name)} — ${turnName(t.get(p.id))}`).join('<br>')}<br>`; };
  const restPs = missing(state, now, true), rest = restPs.map(p => esc(p.name)).join(', ');      // 자동 루틴일 때만 나온다
  if (rest) notes.push(note(`기한 임박 제품을 먼저 써서 쉬는 제품: ${rest}`, `${back(restPs)}기한이 ${SOON}일 안 남은 제품을 같은 자리에 매일 먼저 써요. 그 제품의 기한이 지나면 다시 돌아가며 쓰고, 먼저 다 쓰면 더 일찍 들어와요.`));
  const outPs = missing(state, now), out = outPs.map(p => esc(p.name) + (restOf(p) ? ' (쉬는 저녁을 골라 둔 제품)' : '')).join(', ');
  if (out) notes.push(R.manual ? note(`개봉했는데 루틴에 없는 제품: ${out}`)
    : note(`이번 주 자리 없는 제품: ${out}`, `${back(outPs)}같은 종류는 한 칸에 하나씩, 레티놀·각질 성분은 한 저녁에 하나씩 돌려 써서 자리가 모자라요. 차례는 주마다 돌아가요. 이번 주에 꼭 쓰고 싶으면 직접 고치기로 넣고 「이번 주만」을 눌러 두세요 — 다음 주엔 자동 루틴으로 돌아와요.`));
  notes.push(...gaps(state.products, now).map(g => note(...g)));
  if (backupDue(state, now)) notes.push(note(state.backupAt ? `마지막 백업이 ${daysBetween(state.backupAt, now)}일 전이에요` : '아직 백업 파일을 만든 적이 없어요',
    `기록은 이 기기 브라우저에만 있어서 지워지면 되살릴 수 없어요.${standalone() ? '' : ' 홈 화면에 앱으로 설치해 두면 더 안전해요(⋯ 메뉴).'}`, '<button data-act="export">백업 파일 내보내기</button>'));

  // 발랐어요 체크: 이번 주 오늘까지만 (지난 요일은 깜빡한 체크를 채울 수 있게). 고치는 중엔 숨긴다
  const day = addDays(now, dayIdx - todayIdx()), canTick = !editing && dayIdx <= todayIdx(), got = state.ticks[day];
  const wk = weekDone(state, now), monday = addDays(now, -todayIdx());
  const week = Object.keys(state.ticks).some(k => k >= monday && k <= now)
    ? `<p class="muted week">이번 주 빠짐없이 바른 때 (월~오늘) · 아침 ${wk.am[0]}/${wk.am[1]} · 저녁 ${wk.pm[0]}/${wk.pm[1]}</p>` : '';
  const slot = t => {
    const ids = R.days[dayIdx][t];
    const tick = (p, i) => {
      const on = !!got?.[t].includes(p.id);
      return `<button id="k-${t}-${i}" class="tick" data-act="tick" data-day="${day}" data-t="${t}" data-id="${esc(p.id)}" aria-pressed="${on}" aria-label="${esc(p.name)} 발랐어요">✓</button>`;
    };
    const real = ids.filter(id => byId.has(id)), n = real.filter(id => got?.[t].includes(id)).length;
    const rows = ids.map((id, i) => {
      const p = byId.get(id); if (!p) return '';
      const pairTag = ids.some(x => byId.get(x)?.pair === p.id) ? '<span class="tag">함께</span>' : '';      // 다음 제품과 함께 바르려고 붙은 것
      const hot = pairTag + (group(p) === 'retinol' ? '<span class="tag on">레티놀</span>' : group(p) === 'acid' ? '<span class="tag on">각질</span>' : '');      // 포장이 비슷한 일반 제품과 헷갈리지 않게
      const warn = expired(p, now) ? '<span class="tag bad">기한 지남</span>' : !p.opened ? '<span class="tag warn">미개봉</span>'
        : !R.manual && clash(p, t) && (p.cat === 'cleanser' || p.cat === 'oil') ? `<span class="tag">${calmNow ? '예민한 주' : (g => g.includes('retinol') ? '레티놀 날' : g.includes('acid') ? '각질 날' : '팩 날')(R.days[dayIdx].pm.map(id => byId.get(id)).filter(Boolean).map(group))} 순한 세안</span>` : '';      // 자동 루틴에서 쓰는 때와 다른 자리 = 순한 클렌저 교체
      const ctl = editing ? `<span class="ctl">
        <button id="u-${t}-${i}" data-act="move" data-t="${t}" data-i="${i}" data-by="-1" aria-label="${esc(p.name)} 위로" ${i ? '' : 'disabled'}>↑</button>
        <button id="w-${t}-${i}" data-act="move" data-t="${t}" data-i="${i}" data-by="1" aria-label="${esc(p.name)} 아래로" ${i < ids.length - 1 ? '' : 'disabled'}>↓</button>
        <button id="x-${t}-${i}" data-act="drop" data-t="${t}" data-i="${i}" aria-label="${esc(p.name)} 빼기">✕</button></span>` : '';
      return `<li><button class="what" data-act="editProduct" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><small>${sub(p)}</small>${p.memo ? `<small class="memo">📝 ${esc(p.memo)}</small>` : ''}</button>${hot}${warn}${ctl}${canTick ? tick(p, i) : ''}</li>`;
    }).join('');
    const rest = editing ? state.products.filter(p => !ids.includes(p.id)).sort((a, b) => ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat)) : [];
    const add = rest.length ? `<select data-add="${t}" aria-label="${SLOTS[t]} 루틴에 제품 추가"><option value="">＋ 제품 추가</option>${rest.map(p =>
      `<option value="${esc(p.id)}">${esc(p.name)} (${CATS[p.cat][0]}${p.opened ? '' : ' · 미개봉'})</option>`).join('')}</select>` : '';
    return `<section class="card"><h2>${t === 'am' ? '☀️' : '🌙'} ${SLOTS[t]}${canTick && real.length ? ` <small>${n === real.length ? '다 발랐어요' : `${n}/${real.length} 발랐어요`}</small>` : ''}</h2>${rows ? `<ol class="steps">${rows}</ol>` : '<p class="muted">비어 있어요</p>'}${add}</section>`;
  };

  // 오늘 피부 상태를 한 번 눌러 기록 (오늘 화면에서만) — 예민·홍조(예민한 주)·건조(건조한 주)면 루틴이 바로 바뀐다. 피부 기록 탭에 오늘 기록으로 남는다
  // 줄 머리 「오늘 피부 ✏️」를 누르면 그 오늘 기록 창이 열려 메모를 바로 적는다(없으면 새 기록) — 하루 중 느낀 점을 덧붙이기 쉽게, 메모는 AI 점검에 같이 간다. 메모가 있으면 📝
  // 버튼을 따로 달지 않고 글자를 버튼으로: 좁은 폰(360px)에선 칩 여섯 개로 줄이 이미 찬다
  const todayLog = state.logs[lastAt(state.logs, now)], mine = todayLog?.tags ?? [];
  const skinRow = dayIdx === todayIdx() && !editing ? `<div class="skinrow" role="group" aria-label="오늘 피부 상태"><button id="skMemo" class="lbl" data-act="skinMemo" aria-label="오늘 피부 기록 열어 메모 적기${todayLog?.memo ? ' (메모 있음)' : ''}">오늘 피부 ${todayLog?.memo ? '📝' : '✏️'}</button>${TAGS.map((t, i) =>
    `<button id="sk${i}" class="chip" data-act="skinTag" data-tag="${t}" aria-pressed="${mine.includes(t)}">${t}</button>`).join('')}</div>` : '';
  return `<div class="days" role="group" aria-label="요일">${days}</div>
    <div class="bar"><small>${!R.manual ? '자동 루틴 · 화장품이 바뀌면 알아서 다시 짜요' : R.until ? '직접 고친 루틴 · 이번 주만, 다음 주 월요일부터 자동' : '직접 고친 루틴 · 자동 갱신은 멈췄어요'}</small>
      ${R.manual ? `<button id="weekOnly" data-act="weekOnly" aria-pressed="${!!R.until}">이번 주만</button><button id="regen" data-act="regen">자동으로 다시 짜기</button>` : ''}
      <button id="edit" data-act="edit">${editing ? '고치기 끝' : '직접 고치기'}</button></div>
    ${notes.join('')}${week}${skinRow}${slot('am')}${slot('pm')}
    <button id="check" class="wide" data-act="check">✨ AI 루틴 점검</button>
    <button id="copy" class="wide" data-act="copyRoutine">📋 이번 주 루틴 글로 복사</button>
    <button id="paste" class="wide" data-act="pasteAdvice">📥 다른 AI 답 붙여 넣기</button>`;
}

function badge(l, est) {                     // est = 추정 기한
  if (l === null) return '<span class="tag">기한 없음</span>';
  const pre = est ? '추정 ' : '';
  if (l < 0) return `<span class="tag bad">${pre}만료 ${-l}일 지남</span>`;
  return `<span class="tag ${l <= SOON ? 'warn' : ''}">${pre}${l ? 'D-' + l : '오늘까지'}</span>`;
}
// 기한 한 줄: 「…까지 (개봉 후 12개월)」, 추정이면 어떻게 잡았는지
const expiryNote = p => { const e = expiryOf(p); return !e ? '' : `${e}까지${e === openLimit(p) ? ` (개봉 후 ${p.pao}개월)` : !knownExpiry(p) ? ` (추정 · 이 종류는 보통 개봉 후 ${guessPao(p)}개월)` : ''}`; };
// 화장품 목록 정렬. rows = [{ p, i: 등록한 순서, e: 기한 }] — 기한 없는 것은 기한순에서 맨 뒤
const SORTS = { expiry: '기한 빠른 순', cat: '종류별 (바르는 순서)', name: '이름순', new: '최근 등록순' };
if (!Object.hasOwn(SORTS, sortBy)) sortBy = 'expiry';      // 기억해 둔 값이 지금 없는 정렬이면 기본으로
function sortRows(rows, by) {
  const exp = (a, b) => (a.e || '9').localeCompare(b.e || '9'), nm = (a, b) => a.p.name.localeCompare(b.p.name, 'ko');
  return [...rows].sort({ expiry: (a, b) => exp(a, b) || nm(a, b), cat: (a, b) => ORDER.indexOf(a.p.cat) - ORDER.indexOf(b.p.cat) || exp(a, b) || nm(a, b),
    name: nm, new: (a, b) => b.i - a.i }[by]);
}
function viewProducts() {
  if (filter === 'done' && !state.done.length) filter = 'all';
  const buy = buyList(state);                 // 모든 장소의 살 것 — 종류 걸러 보기는 적용하지 않는다(다른 장소에만 있는 종류는 고를 수 없어 빈 화면이 된다. 몇 개 안 되는 목록이라 다 보여 준다)
  if (filter === 'buy' && !buy.length) filter = 'all';
  const now = today(), inWeek = new Set(state.routine.days.flatMap(d => [...d.am, ...d.pm]));
  // 루틴 상태: sealed 미개봉 · skip 루틴에 안 넣는 종류 · in 이번 주 루틴에 있음 · out 개봉했는데 없음(만료·자리 부족·예민한 주·직접 고친 루틴)
  const rows = state.products.map((p, i) => ({ p, i, l: left(p, now), e: expiryOf(p), k: knownExpiry(p), r: !p.opened ? 'sealed' : inWeek.has(p.id) ? 'in' : !CATS[p.cat][1] || p.when === 'off' ? 'skip' : 'out' }));      // 직접 고친 루틴에 손으로 넣은 것은 종류·쓰는 때와 상관없이 「루틴 포함」
  // 종류 걸러 보기: 위 상태 칩과 함께 쓴다 (칩 숫자도 그 종류 안에서). 고른 종류가 다 지워졌으면 푼다
  if (kindF && !state.products.some(p => p.cat === kindF) && !state.done.some(x => x.cat === kindF)) kindF = '';
  const shown = kindF ? rows.filter(r => r.p.cat === kindF) : rows, done = state.done.filter(x => !kindF || x.cat === kindF);
  const F = { all: ['전체', () => true], out: ['루틴에 없음', r => r.r === 'out'], sealed: ['미개봉', r => r.r === 'sealed'], soon: ['임박·만료', r => r.l !== null && r.l <= SOON], none: ['기한 모름', r => !r.k] };      // 추정 기한만 있는 것도 실제 기한은 모름
  const chips = Object.entries(F).map(([k, [name, fn]]) =>
    `<button id="f-${k}" class="chip" data-act="filter" data-f="${k}" aria-pressed="${k === filter}">${name} ${shown.filter(fn).length}</button>`).join('')
    + (buy.length ? `<button id="f-buy" class="chip" data-act="filter" data-f="buy" aria-pressed="${filter === 'buy'}">살 것 ${buy.length}</button>` : '')
    + (state.done.length ? `<button id="f-done" class="chip" data-act="filter" data-f="done" aria-pressed="${filter === 'done'}">다 쓴 제품 ${done.length}</button>` : '');
  const kindOpts = ORDER.map(c => [c, state.products.filter(p => p.cat === c).length + (filter === 'done' ? state.done.filter(x => x.cat === c).length : 0)])
    .filter(([c, n]) => n || c === kindF).map(([c, n]) => `<option value="${c}" ${c === kindF ? 'selected' : ''}>${CATS[c][0]}</option>`).join('');
  // 종류별 개수 (바르는 순서대로, 다 쓴 제품 제외). 미개봉이 섞여 있으면 따로 센다
  const kinds = ORDER.map(c => [c, state.products.filter(p => p.cat === c)]).filter(([, l]) => l.length).map(([c, l]) => {
    const s = l.filter(p => !p.opened).length;
    return `<span>${CATS[c][0]} <b>${l.length}</b>${s ? ` (미개봉 ${s})` : ''}</span>`;
  }).join(' · ');
  // 다 쓴 제품: 또 살래요 먼저, 최근에 다 쓴 것부터. 쓴 기간 = 개봉일부터 다 쓴 날까지
  const doneCards = () => [...done].sort((a, b) => b.again - a.again || b.doneAt.localeCompare(a.doneAt)).map(x => `<article class="card prod" data-q="${esc(norm(x.name + CATS[x.cat][0] + x.actives.map(a => ACTIVES[a]).join('')))}">
      <span class="name">${esc(x.name)}</span>${x.again ? '<span class="tag on">또 살래요</span>' : '<span></span>'}
      <small>${CATS[x.cat][0]} · ${x.openedAt ? `${x.openedAt} 개봉 → ` : ''}${x.doneAt} 다 씀${x.openedAt ? ` (${daysBetween(x.openedAt, x.doneAt) + 1}일)` : ''}</small><span></span>
      <span class="acts"><button data-act="again" data-id="${esc(x.id)}" aria-pressed="${x.again}">${x.again ? '또 살래요 해제' : '또 살래요'}</button>
        <button data-act="rebuy" data-id="${esc(x.id)}">다시 샀어요 · 등록</button><button class="danger" data-act="forget" data-id="${esc(x.id)}">기록 지우기</button></span></article>`).join('');
  // 살 것: 모든 장소의 「또 살래요」를 한 화면에 — 다른 장소 것은 장소 이름을 달고, 그 장소로 가서 등록하게 한다 (등록은 지금 고른 장소에 들어가니까)
  const stock = x => (st => st.length ? `<br><span class="tag warn">미개봉 있음</span> ${esc(st[0].q.name)}${st[0].pid === state.place ? '' : ` (${esc(st[0].place)})`}${st.length > 1 ? ` 외 ${st.length - 1}개` : ''}` : '')(stocked(state, x, now));
  const buyCards = () => buy.map(({ x, pid, place }) => `<article class="card prod" data-q="${esc(norm(x.name + CATS[x.cat][0] + x.actives.map(a => ACTIVES[a]).join('') + place))}">
      <span class="name">${esc(x.name)}</span>${pid === state.place ? '<span></span>' : `<span class="tag">${esc(place)}</span>`}
      <small>${CATS[x.cat][0]} · ${x.doneAt} 다 씀${stock(x)}</small><span></span>
      <span class="acts">${pid === state.place ? `<button data-act="again" data-id="${esc(x.id)}" aria-pressed="true">또 살래요 해제</button><button data-act="rebuy" data-id="${esc(x.id)}">다시 샀어요 · 등록</button>`
        : `<button data-act="buyAt" data-id="${esc(pid)}" aria-label="${esc(x.name)} — ${esc(place)}(으)로 가서 등록">${esc(place)}(으)로 가서 등록</button>`}</span></article>`).join('');
  const cards = filter === 'buy' ? buyCards() : filter === 'done' ? doneCards() : sortRows(shown.filter(F[filter][1]), sortBy)
    .map(({ p, l, e, k, r }) => `<article class="card prod" data-q="${esc(norm(p.name + sub(p)))}">
      <button id="p-${esc(p.id)}" class="name" data-act="editProduct" data-id="${esc(p.id)}">${esc(p.name)}</button>${badge(l, e && !k)}

function fillGo(step) {                       // 기한 채우기: 다음 제품 창을 연다 (그사이 지운 제품은 건너뛴다)
  fill.i += step;
  while (fill.i < fill.ids.length && !product(fill.ids[fill.i])) fill.i++;
  if (fill.i < fill.ids.length) return productForm(product(fill.ids[fill.i]));
  const done = fill.done; fill = null; shut();
  toast(done ? `기한 채우기를 마쳤어요. ${done}개에 기한이 생겼어요` : '기한 채우기를 마쳤어요');
}
function fixGo(step, said) {                  // 개봉일 바로잡기: 다음 제품을 묻는다 (그사이 지운 제품은 건너뛴다). said = 방금 고친 제품 알림 — 끝날 때 「마쳤어요」에 덮이지 않게 이어 붙인다
  fix.i += step;
  const todo = p => p && p.opened && !p.openedWas;      // 그사이 지웠거나, 다른 창·기기에서 이미 확인했거나, 미개봉으로 바뀐 제품은 건너뛴다
  while (fix.i < fix.ids.length && !todo(product(fix.ids[fix.i]))) fix.i++;
  const p = product(fix.ids[fix.i]), e = p && expiryOf(p);
  if (!p) { fix = null; shut(); return toast(`${said ? said + ' · ' : ''}개봉일 바로잡기를 마쳤어요`); }
  fix.at = Date.now();                        // 이 제품을 보여 준 때 — 바로 뒤의 연타는 받지 않는다 (fixPick)
  modal(`<form method="dialog"><h2>개봉일 바로잡기 <small>· ${fix.i + 1}/${fix.ids.length}</small></h2>
    <p><b>${esc(p.name)}</b><br><small class="muted">${CATS[p.cat][0]} · 지금 개봉일 ${p.openedAt}${e ? ` · 기한 ${e}${knownExpiry(p) ? '' : '(추정)'}` : ''}</small></p>
    <p>언제쯤 뜯었나요? <small class="muted">등록한 날이 개봉일로 들어가 있어요</small></p>
    <div class="checks"><button type="button" data-act="fixPick">최근 (그대로)</button>${AGO.filter(a => a[2]).map(([name, d, m]) => `<button type="button" data-act="fixPick" data-d="${d}" data-m="${m}">${name}</button>`).join('')}</div>
    <div class="actions"><button type="button" data-act="fixPick">모르겠어요</button><span class="grow"></span><button type="button" data-act="fixStop">그만</button></div></form>`);
}
// ready = 받아 둔 답(「열어 고치기」로 제품 창에 갔다 돌아올 때) — AI 에 다시 묻지 않고 지금 설정에 맞춰 버튼만 다시 그린다
// advice = 다른 AI 에게 받은 답(붙여 넣은 글) — 있으면 점검 대신 그 답에서 반영할 것만 뽑아 같은 창에 버튼으로 보여 준다
async function checkForm(ready, advice) {     // AI 루틴 점검 결과 창 (「다시 점검」도 여기로)
  const adv = !!(advice || ready?.advice);
  modal(`<form method="dialog">
    <h2>${adv ? '📥 다른 AI 답 반영' : '✨ AI 루틴 점검'}</h2>
    <small class="asof" hidden></small><p class="ai" role="status">준비 중이에요…</p><div class="check"></div>
    ${help(adv ? 'AI가 받은 답에서 뽑은 것이라 다를 수 있어요 — 누르기 전에 확인해 주세요' : 'AI 의견이라 틀릴 수 있어요 · 보낸 내용 보기',
      `보내는 것: ${adv ? '붙여 넣은 글과 ' : ''}제품 이름·종류·성분·쓰는 때·메모, 이번 주 루틴, 가장 최근 피부 상태 태그, 최근 ${MEMO_DAYS}일 피부 기록 메모 (사진은 안 보내요)`)}
    <div class="actions"><span class="grow"></span>${adv ? '<button type="button" data-act="pasteAdvice" data-again="1">다시 붙여 넣기</button>' : '<button type="button" data-act="check" data-fresh="1">다시 점검</button>'}<button class="primary">닫기</button></div></form>`);
  const form = dlg.querySelector('form'), out = form.querySelector('.ai'), again = form.querySelector('.actions [type=button]');
  const live = () => form.isConnected && dlg.open;      // 창을 닫았거나 다시 점검을 눌렀으면 이 결과는 버린다
  again.disabled = true;
  try {
    let r = ready;
    if (!r) {
      const key = await getKey();
      if (!live()) return;
      if (key === null) return void (out.textContent = '저장소를 읽지 못했어요. 다시 해 주세요.');
      if (!key) return void (out.textContent = `⋯ 메뉴에서 Gemini API 키(무료)를 등록하면 ${adv ? '받은 답을 버튼으로 바꿔 줘요' : 'AI가 루틴을 점검해 줘요'}.`);
      if (!state.products.some(p => p.opened)) return void (out.textContent = `개봉한 제품이 없어서 ${adv ? '반영할' : '점검할'} 루틴이 없어요.`);
      out.textContent = adv ? 'AI가 받은 답을 읽는 중이에요… (보통 10초 안팎)' : 'AI가 루틴을 보는 중이에요… (보통 10초 안팎)';
      r = await checkRoutineAI(key, advice);
      if (!live()) return;
      lastCheck = r;                          // 화면에 그리는 답만 받아 둔다 (닫았다 다시 점검해 겹친 옛 요청이 덮어쓰지 않게)
      if (!r.advice && !document.hidden) idb.set('check', { place: state.place, r }).catch(() => {});      // 다시 볼 수 있게 (savedCheck). 숨은 채로는 저장소를 쓰지 않는다 — 이 창을 닫기 전까지는 lastCheck 로 본다
    } else if (r.at) {                        // 받아 둔 답 — 언제 받은 것인지, 그 뒤 보낼 내용이 바뀌었는지 알린다 (새 메모를 적고 눌렀는데 옛 답이라 반영 안 된 줄 모르지 않게)
      const asof = form.querySelector('.asof');

    }
    out.textContent = r.summary || (adv ? (r.points.length ? '받은 답에서 반영할 것을 뽑았어요.' : '받은 답에서 앱에 바로 반영할 것을 찾지 못했어요.') : '점검을 마쳤어요.');

    // 항목마다 [그림, 이미 다 반영됨]. 제안한 것(메모·쓰는 때·쉬는 저녁·예민한 주엔 쉼)이 하나 이상 있고 모두 이미 되어 있으면 맨 아래 접힌 칸으로 —
    // 받아 둔 답을 다시 볼 때나 AI 가 이미 해 둔 것을 또 권할 때, 할 일이 남은 것처럼 보이지 않게 (11-18 사용자: 「이미 그렇게 돼 있는 걸 왜 계속 추천해?」)

      // (11-17: 조정인데 맞는 버튼이 없다는 말이 세 번째). 제품 창을 닫으면 이 점검 창으로 돌아온다 (checkBack)
      if (q && p.kind === '조정') acts += `<button type="button" data-act="editProduct" data-id="${esc(q.id)}">✏️ 열어 고치기</button>`;
      // 버튼이 어느 제품에 적용되는지 이름을 적어 둔다 — AI 가 번호를 잘못 고르거나(붙여 넣은 답은 그사이 목록이 바뀌었을 수도) 엉뚱한 제품에 누르지 않게
      return [`<li><span class="tag ${CHECK_KINDS[p.kind]}">${p.kind}</span><span class="what"><b>${esc(p.title)}</b><small>${esc(p.detail)}</small>${acts ? `<small class="for">→ ${esc(q.name)}</small>${p.memo ? `<small>📝 ${esc(p.memo)}</small>` : ''}<span class="acts">${acts}</span>` : ''}</span></li>`,      // 메모 버튼이 넣을 글도 그대로 보여 준다 (설명과 다른 글이 들어가지 않게 눈으로 확인)

function shrink(file, max, q) {               // 긴 변 max px JPEG data URL 로 줄인다
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const out = c.toDataURL('image/jpeg', q); c.width = c.height = 0; ok(out);     // iOS 캔버스 메모리 반납
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('사진을 읽을 수 없어요.')); };
    img.src = url;
  });
}
async function exportAll() {
  if (noSave) return toast('저장된 내용을 읽지 못한 상태라 백업을 만들 수 없어요. 새로고침해 주세요.', true);      // 빈 상태를 백업으로 내보내지 않게
  const photos = Object.create(null);
  let miss = 0;                                // 못 읽은 원본 사진 수 — 저장소가 멈춰 있으면 사진 없이라도 내보낸다(저장 안 된 내용을 건지는 길). 하나 못 읽으면 나머지는 기다리지 않는다
  for (const l of state.logs) if (l.thumb) { try { if (miss) throw 0; photos[l.id] = await idb.get('photo:' + l.id); } catch { miss++; } }
  // ponytail: 사진까지 JSON 한 파일로 내보낸다. 사진이 수백 장이라 파일이 무거워지면 zip·분할로
  const at = today(), name = `화장대-백업-${at}.json`;
  const blob = new Blob([JSON.stringify({ app: 'vanity', v: 1, at, state: { ...state, backupAt: at }, photos, use: readUse() })], { type: 'application/json' });      // use = 사용 기록(동작 이름·횟수뿐). 가져올 때는 읽지 않는다
  // 파일 공유를 받아 주는 브라우저(아이폰 등)는 공유 창으로, 아니면 내려받기로 — 안드로이드 크롬은 json 파일 공유를 막아 두어 「다운로드」 폴더로 간다
  const file = new File([blob], name, { type: 'application/json' });
  let shared = false;
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); shared = true; }
    catch (e) { if (e?.name === 'AbortError') return; }      // 공유 창을 닫았으면 백업 안 한 것. 그 밖(누른 지 오래돼 막힘 등)은 내려받기로
  }

  }

  if (!miss) { state.backupAt = at; save(); }      // 사진이 빠진 백업은 「마지막 백업」으로 치지 않는다
  render();

  const old = state.logs;
  const swap = async () => {

    const recs = [];

    for (const l of next.logs) {

    }
    // 같이 쓰는 장소는 base 를 비운다 — 옛 백업에 없는 화장품을 「이 기기에서 지운 것」으로 보고 서버에서 지우지 않게 (syncStep: 합치기만 한다)

    for (const [id, rec] of recs) {

      + (found.length ? `${found.join(' · ')}을(를) 읽어 채웠어요. ` : '사진에서 기한·성분은 찾지 못했어요. ')
      + (editing ? '저장을 눌러야 반영돼요.' : '틀린 곳은 고쳐서 저장하세요.')
      + ' 뒷면(전성분·기한)을 이 창에서 한 번 더 찍으면 빈 칸을 더 채워요.';
  } catch (e) { if (live()) out.textContent = e.message; }
  finally { for (const el of lock) el.disabled = false; }
}

/* ───────── 동작 ───────── */
// 점검 창의 적용 버튼을 「적용됨」으로 바꾼다 (같은 제품을 가리킨 버튼 모두)
// d = 누른 버튼의 값. 제품뿐 아니라 메모 글·쓰는 때까지 같은 버튼만 — 한 제품에 다른 메모 제안이 둘이면 누르지 않은 쪽은 그대로 둔다
const applied = (d, label) => { for (const b of dlg.querySelectorAll(`[data-act="${d.act}"]`)) if (['id', 'memo', 'when', 'rest'].every(k => b.dataset[k] === d[k])) { b.disabled = true; b.textContent = label; } };
const ACT = {
  tab(d) {

    // 종류를 푼 것은 기억에도 적는다(keepView) — 메모리만 비우면 다음에 정렬을 바꿀 때 말없이 같이 지워져서, 언제 풀렸는지 알 수 없게 된다 (11-18 검토)
    if (Object.hasOwn(d, 'f')) { filter = d.f; kindF = query = ''; keepView(); focusId = 'f-' + d.f; }

  day(d) { dayIdx = +d.i; render(); },
  edit() { editing = !editing; render(); },

  weekOnly() {                                // 직접 고친 루틴을 이번 주 일요일까지만 ↔ 계속
    const R = state.routine;
    R.until = R.until ? '' : addDays(monday(today()), 6); commit();
    toast(R.until ? '이번 주만 유지해요 · 다음 주 월요일부터 자동 루틴' : '직접 고친 루틴을 계속 유지해요');
  },
  async copyRoutine() {                       // 다른 AI·메모에 붙여 넣을 글로

    catch {                                   // 복사 권한이 없거나 막힌 브라우저 — 글을 보여 주고 직접 복사하게
      modal(`<form method="dialog"><h2>이번 주 루틴 (글)</h2><p class="muted">자동 복사가 막혀 있어요. 아래 글을 길게 눌러 전체 선택한 뒤 복사해 주세요.</p>

  add() { queue = []; fill = null; rebuyFor = null; productForm(); },

  rebuy(d) {                                  // 다시 샀어요 → 그 제품 정보로 채운 새 등록 창 (미개봉으로)

  forget(d) {

  skip() { rebuyFor = null; queue.length ? productForm(queue.shift(), true) : shut(); },
  editProduct(d) {
    const p = product(d.id); if (!p) return;      // 그사이 지워진 제품(다른 창에서 삭제)이면 빈 등록 창을 띄우지 않는다
    checkBack = dlg.open && dlg.querySelector('.check') ? lastCheck : null; fill = null; productForm(p);
  },
  fillNext() { fill = { ids: fillOrder(state.products), i: 0, done: 0 }; fillGo(0); },
  fillSkip() { if (fill) fillGo(1); },
  fillStop() { fill = null; shut(); },
  fixNext() { fix = { ids: openedDoubt(state), i: 0 }; fixGo(0); },
  async fixPick(d) {                          // 고른 때로 개봉일을 당기고(최근·모르겠어요 = 그대로) 확인한 것으로 표시 → 저장되면 다음 제품
    const run = fix; if (!run || run.busy || Date.now() - run.at < 400) return;      // 저장 중이거나 방금 넘어온 직후의 연타는 받지 않는다 — 보지 못한 다음 제품에 답이 들어가지 않게
    const p = product(run.ids[run.i]);
    if (!p || !p.opened || p.openedWas) return fixGo(0);      // 창을 띄워 둔 사이 지워졌거나 다른 창·기기에서 이미 확인했으면 다음으로
    const was = p.openedAt; Object.assign(p, openedSet(p, AGO.some(a => a[2] && a[1] === +d.d && a[2] === +d.m) ? agoDate(today(), +d.d, +d.m) : ''));
    let saved; run.busy = true;
    try { saved = await commit(); } finally { run.busy = false; }      // 저장·다시 그리기에서 오류가 나도 창이 먹통이 되지 않게
    if (fix !== run) return;                  // 저장을 기다리는 사이 그만뒀거나 장소가 바뀌었다
    if (!dlg.open || !dlg.querySelector('[data-act=fixStop]')) return void (fix = null);      // 그 사이 창을 닫았다(Esc·뒤로 가기) — 다시 띄우지 않는다
    // 저장이 안 됐으면(알림은 save 가 띄운다) 바꿨다고 하지 않는다. 다른 창 내용으로 바뀌어 그 제품이 다시 「확인 전」이면 그 기준으로 다시 묻고,
    // 아니면(저장 실패) 여기서 멈춘다 — 메모리의 제품은 이미 확인한 것으로 바뀌어 있어, 이어 가면 건너뛰고 끝에 「마쳤어요」가 실패 알림을 덮는다
    if (!saved) { const now = product(run.ids[run.i]); if (now?.opened && !now.openedWas) return fixGo(0); fix = null; return shut(); }
    const e = expiryOf(p);
    const said = `‘${p.name}’ ${p.openedAt !== was ? `개봉일을 ${p.openedAt}쯤으로 바꿨어요` : '개봉일은 그대로 뒀어요'}${e ? ` · 기한 ${e}${knownExpiry(p) ? '' : '(추정)'}${expired(p, today()) ? ' — 지났어요' : ''}` : ''}`;
    toast(said); fixGo(1, said);
  },
  fixStop() { fix = null; shut(); },
  open(d) {                                   // 미개봉 → 오늘 개봉 (개봉하면 루틴에 들어간다). 개봉일이 실수로 찍히지 않게 한 번 묻는다
    const p = product(d.id); if (!p || p.opened) return;
    if (!confirm(`‘${p.name}’을(를) 오늘 개봉한 것으로 기록할까요?\n개봉하면 루틴에 들어가요.`)) return;
    p.opened = true; p.openedAt = today(); commit();
  },
  delProduct(d) {
    const p = product(d.id); if (!p || !confirm(`‘${p.name}’을(를) 삭제할까요?`)) return;

  },
  finish(d) { const p = product(d.id); if (p) finishForm(p); },
  async check(d) {                            // 루틴 화면의 버튼: 받아 둔 답이 있으면 그것부터 보여 준다(AI 를 다시 부르지 않음) · 창 안의 「다시 점검」(fresh)은 새로 받는다
    refresh();

    const pid = state.place, kept = await savedCheck();

    if (state.place !== pid || dlg.open || document.hidden) return;

  pasteAdvice(d) { refresh(); adviceForm(d.again); },      // again = 결과 창의 「다시 붙여 넣기」
  applyMemo(d) {                              // AI 점검 제안 → 제품 메모에 덧붙인다 (루틴에 📝로 보인다)
    const p = product(d.id); if (!p || !d.memo) return;
    const memo = p.memo ? `${p.memo} / ${d.memo}` : d.memo;
    // 다 들어가지 않으면 넣지 않는다 — 잘려 들어가면 「이미 있어요」로 안 바뀌어 누를 때마다 또 덧붙는다
    if (memo.length > 300) return toast('메모가 가득 차서(300자) 넣지 못했어요. 제품을 열어 메모를 정리해 주세요.', true);

  },
  applyWhen(d) {                              // AI 점검 제안 → 쓰는 때 바꾸기
    const p = product(d.id); if (!p || !Object.hasOwn(CHECK_WHEN, d.when)) return;
    const [when, name] = CHECK_WHEN[d.when];

  applyRest(d) {                              // AI 점검 제안 → 쉬는 저녁 고르기
    const p = product(d.id); if (!p || !Object.hasOwn(REST, d.rest)) return;
    p.rest = d.rest; if (state.routine.manual) dropRest(state.routine.days, state.products, p); commit();
    const note = restNote(state, p, today());
    applied(d, `✓ ${REST[d.rest][0]}엔 쉬게 했어요`); toast(note ? `‘${p.name}’ 쉬는 저녁을 골랐어요 · ${note}` : `‘${p.name}’을(를) ${REST[d.rest][0]}엔 쉬게 했어요`);
  },
  applyHarsh(d) {                             // AI 점검 제안 → 예민한 주엔 쉼 켜기
    const p = product(d.id); if (!p) return;
    p.harsh = true; commit();
    // 지금이 예민한 주라 바로 루틴에서 빠지면 그렇다고, 직접 고친 루틴이라 안 빠지면 그대로라고 알린다 (harshOut = 예민한 주라 자동 루틴에서 쉬는 제품)
    const now = harshOut(state, today()).some(x => x.id === p.id) ? ' · 이번 주가 예민한 주라 지금부터 쉬어요'
      : state.routine.manual && isCalm(state.logs, today()) ? ' · 직접 고친 루틴은 그대로예요' : '';
    applied(d, '✓ 예민한 주엔 쉬게 했어요'); toast(`‘${p.name}’을(를) 예민한 주엔 쉬게 했어요${now}`);
  },
  swap(d) {                                   // 다 쓴 제품을 목록·루틴에서 빼고, 고른 제품이 있으면 오늘 개봉 (직접 고친 루틴은 같은 자리에 바꿔 넣는다)
    const p = product(d.id); if (!p) return;
    let q = d.to && !d.from ? product(d.to) : null;
    if (d.from) {                             // 다른 장소의 미개봉을 가져온다: 그 장소 목록에서 빼고 이 장소에 넣는다 (같이 쓰는 장소면 다음에 맞출 때 그쪽 목록에서도 빠진다 — 물건이 옮겨 왔으니)
      const shelf = state.away[d.from], src = shelf?.products.find(x => x.id === d.to);
      if (!src || src.opened || expired(src, today())) return toast('그 제품을 찾지 못했어요. 창을 닫고 다시 해 주세요.', true);      // 창을 연 사이 다른 창에서 지웠거나 개봉했다
      state.away[d.from] = cleanShelf({ ...shelf, products: shelf.products.filter(x => x !== src) });      // 그 장소의 루틴·체크·먼저 바를 제품에서도 뺀다
      state.products.push(q = cleanProduct({ ...src, id: uid(), pair: '' }));      // id 는 새로 — 두 장소에 같은 id 가 있으면(백업을 합친 경우) 한쪽이 버려진다
    }
    const again = !!dlg.querySelector('[name=again]')?.checked;      // 다 쓴 제품 기록에 남긴다 (화장품 목록 「다 쓴 제품」)
    state.done.push(cleanDone({ name: p.name, cat: p.cat, actives: p.actives, when: p.when, rest: p.rest, harsh: p.harsh, openedAt: p.openedAt, doneAt: today(), again }));
    state.products = state.products.filter(x => x !== p);
    let placed = !state.routine.manual;       // 자동 루틴은 다시 짜면서 들어간다. 직접 고친 루틴은 다 쓴 제품이 있던 자리에만 넣는다
    for (const day of state.routine.days) for (const t in SLOTS) {
      const a = day[t], i = a.indexOf(p.id);
      if (i < 0) continue;
      const fit = !!q && !clash(q, t);        // 쓰는 때가 어긋나는 자리(아침만 제품을 저녁 자리)엔 넣지 않고 비운다
      fit && !a.includes(q.id) ? a.splice(i, 1, q.id) : a.splice(i, 1);
      placed ||= fit;
    }
    const fresh = !!q && !q.opened;           // 이미 개봉한 것을 직접 고친 루틴 자리에 넣는 경우는 개봉일을 건드리지 않는다
    if (fresh) { q.opened = true; q.openedAt = today(); }
    shut(); commit();
    // 자동 루틴은 다시 짠 결과를 보고 말한다 — 쓰는 때가 「루틴에 안 넣음」이거나, 예민한 주에 쉬거나, 돌려 쓰는 차례가 아니면 이번 주엔 안 들어간다
    const auto = !state.routine.manual;
    if (auto) placed = !!q && state.routine.days.some(day => day.am.includes(q.id) || day.pm.includes(q.id));
    const why = auto ? '이번 주 루틴엔 들어가지 않았어요' : '직접 고친 루틴엔 맞는 자리가 없어 넣지 않았어요';
    toast(q ? `‘${q.name}’${placed ? `을(를) ${d.from ? '가져와 ' : ''}${fresh ? '개봉해서 ' : ''}루틴에 넣었어요` : fresh ? `을(를) ${d.from ? '가져와 ' : ''}개봉했어요 · ${why}` : ` — ${why}`}${again ? ' · 다 쓴 것은 재구매 목록에' : ''}`
      : `‘${p.name}’을(를) 다 쓴 제품에 남겼어요${again ? ' · 또 살래요' : ''}`);
  },
  addLog() { logForm(); },
  async skinMemo() {                          // 루틴 화면 「오늘 피부 ✏️」: 오늘 기록(여럿이면 칩이 고치는 그 마지막 것)을 열어 메모 칸으로 — 없으면 새 기록 창
    if (noSave) return toast('저장된 내용을 읽지 못한 상태예요. 새로고침해 주세요.', true);      // 적어도 저장되지 않는다 (skinTag 와 같은 막기)

function sweepPhotos() {
  const keep = new Set(state.logs.map(l => 'photo:' + l.id));
  return idb.run('readwrite', s => {
    const q = s.getAllKeys();
    q.onsuccess = () => { for (const k of q.result) if (typeof k === 'string' && k.startsWith('photo:') && !keep.has(k)) s.delete(k); };
