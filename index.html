<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1716">
<title>화장대</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="화장대">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧴%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f5; --card: #fff; --ink: #2b2523; --muted: #756a65; --line: #ebe3de;
  --accent: #a94f43; --on-accent: #fff; --soft: #f6e9e5;
  --warn: #8a5300; --warn-bg: #fdf0d5; --bad: #b3261e; --bad-bg: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1716; --card: #262120; --ink: #f2eae7; --muted: #a99d98; --line: #3a322f;
    --accent: #e8a094; --on-accent: #2a1410; --soft: #3a2824;
    --warn: #ffd08a; --warn-bg: #3e2f12; --bad: #ffb4ab; --bad-bg: #4b1f1b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto; max-width: 560px; min-height: 100dvh; background: var(--bg); color: var(--ink);
  padding: 0 16px calc(80px + env(safe-area-inset-bottom));
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 0; }
small, .muted { color: var(--muted); font-size: 13px; font-weight: 400; }
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }        /* display 를 준 카드(.prod 등)도 hidden 이면 숨긴다 */
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .35; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.danger { color: var(--bad); border-color: transparent; background: none; }
.wide { width: 100%; min-height: 48px; margin-bottom: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
header button { border: 0; background: none; font-size: 22px; min-width: 44px; min-height: 44px; padding: 0; }
nav {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav button { border: 0; border-radius: 0; background: none; min-height: 56px; color: var(--muted); font-size: 14px; }
nav button[aria-current] { color: var(--accent); font-weight: 700; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: #b3261e; color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.on { background: var(--soft); color: var(--accent); border-color: transparent; }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.secret { -webkit-text-security: disc; }     /* 비밀번호 칸으로 두면 비밀번호 관리자가 키를 저장하려 든다 */
.ai { margin: 0; background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
.note button { display: block; margin-top: 8px; }
.note summary { cursor: pointer; }
.note details span { display: block; margin-top: 6px; }
.empty { text-align: center; padding: 40px 12px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 17px; }
.chip { min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.filters .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.kinds { margin: 0 0 10px; line-height: 1.7; }
.kinds span { white-space: nowrap; }
.kinds b { color: var(--ink); }
.search { margin-bottom: 10px; }
.sortbar { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.sortbar label { display: flex; align-items: center; gap: 8px; }
.sortbar select { width: auto; min-height: 36px; padding: 4px 10px; font-size: 14px; }

/* 루틴 */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.day { padding: 4px 0; min-height: 54px; display: grid; justify-items: center; align-content: center; border-radius: 12px; }
.day b { font-size: 15px; }
.day small { font-size: 10.5px; line-height: 15px; min-height: 15px; }
.day[aria-current] { border-color: var(--accent); }
.day[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed=true] small { color: inherit; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.bar small { flex: 1; min-width: 150px; }
.bar [aria-pressed=true] { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.what { flex: 1; min-width: 0; display: grid; }
button.what { border: 0; background: none; padding: 2px 0; min-height: 0; border-radius: 6px; text-align: left; }      /* 루틴에서 눌러 상세 열기 */
.what .memo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }      /* 바르는 법 메모는 한 줄로 (전체는 상세에서) */
.what b { font-weight: 600; }
.ctl { display: flex; gap: 4px; flex: none; }
.ctl button { min-width: 36px; min-height: 36px; padding: 0; }
.card select { margin-top: 8px; }
.tick { flex: none; width: 40px; min-height: 40px; padding: 0; border-radius: 50%; color: var(--line); font-weight: 700; }      /* 발랐어요 체크 */
.tick[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps li:has(.tick[aria-pressed=true]) .what { opacity: .5; }
.week { margin: 0 0 10px; }

/* 화장품 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prod { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.prod .name { border: 0; background: none; padding: 4px 0; min-height: 0; text-align: left; font-weight: 600; }
.prod .acts { grid-column: 1 / -1; }
.alts { list-style: none; margin: 0; padding: 0; }
.alts li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.check li { align-items: flex-start; }      /* 점검 항목은 여러 줄이라 위로 맞춘다 */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.what .for { margin-top: 6px; color: var(--ink); font-weight: 700; }
.acts button { min-height: 32px; padding: 4px 10px; font-size: 13px; }

/* 피부 기록 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.log { padding: 0 0 10px; border-radius: 16px; overflow: hidden; display: grid; gap: 4px; text-align: left; align-content: start; }
.log img, .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.log b, .log small, .log .tags { padding: 0 10px; }
.log .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.log small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 입력 창 */
dialog { border: 0; border-radius: 18px; padding: 20px; width: min(100vw - 24px, 480px); max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
form { display: grid; gap: 14px; }
form > label, .two label, .more label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.more summary { padding: 11px 0; font-size: 14px; color: var(--muted); cursor: pointer; }
.more > div { display: grid; gap: 14px; padding-top: 4px; }
.field { display: grid; gap: 5px; }
.help summary { padding: 2px 0; font-size: 13px; color: var(--muted); cursor: pointer; list-style: none; }
.help summary::-webkit-details-marker { display: none; }
.help summary::after { content: ' ⓘ'; }
.help small { display: block; margin-top: 4px; }
.restnote { color: var(--ink); }
.restnote:empty { display: none; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-size: 13px; color: var(--muted); }
input:not([type=checkbox], [type=radio]), select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
textarea { resize: vertical; }
input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
form > label.pill, label.pill { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--ink); cursor: pointer; }
label.pill:has(:checked) { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 10px; }
form:has([name=opened]:not(:checked)) .if-opened { display: none; }
.ago { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: -4px; }
.ago small { color: var(--muted); margin-right: 2px; }
.actions { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
form > label.btn, .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.btn:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }      /* 창이 열릴 때 자동 초점엔 안 뜨고 키보드로 옮겼을 때만 */
.btn:has(:disabled) { opacity: .35; pointer-events: none; }
.adds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.adds > * { min-height: 48px; }
.preview { width: 100%; max-height: 46dvh; object-fit: contain; border-radius: 12px; background: var(--bg); }
.sr, input.sr { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); }

#toast { inset: auto auto calc(72px + env(safe-area-inset-bottom)) 50%; translate: -50% 0; margin: 0; border: 0; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; max-width: calc(100vw - 32px); }
#toast.bad { background: #b3261e; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>화장대</h1>
  <button data-act="backup" aria-label="설정·백업" title="설정·백업">⋯</button>
</header>
<main id="view"></main>
<nav aria-label="화면">
  <button data-act="tab" data-tab="routine">루틴</button>
  <button data-act="tab" data-tab="products">화장품<span id="soon" class="count" hidden></span></button>
  <button data-act="tab" data-tab="skin">피부 기록</button>
</nav>
<dialog id="dlg"></dialog>
<p id="toast" role="status" popover="manual"></p>

<script>
'use strict';

/* ───────── 기준값 ───────── */
// 종류: 적힌 순서 = 바르는 순서. [이름, 자동 루틴에 넣는 때] ('' = 루틴에 넣지 않음)
const CATS = {
  oil: ['클렌징오일·밤', 'pm'], cleanser: ['폼클렌저', 'both'], exfol: ['각질케어', 'pm'], toner: ['토너·스킨', 'both'],
  essence: ['에센스', 'both'], mask: ['마스크팩', 'pm'], serum: ['세럼·앰플', 'both'], eye: ['아이크림', 'both'],      // 마스크팩은 에센스 다음 (11-17)
  lotion: ['로션·에멀전', 'both'], cream: ['크림', 'both'], faceoil: ['페이스오일', 'pm'], sleep: ['슬리핑팩', 'pm'],
  sun: ['선크림', 'am'], makeup: ['메이크업', ''], body: ['바디·헤어', ''], etc: ['기타', ''],
};
const ORDER = Object.keys(CATS);
const ACTIVES = { retinol: '레티놀', acid: 'AHA·BHA·효소', vitc: '비타민C' };      // acid = 각질을 녹이는 것 (산·효소 세안제)
const PAOS = [3, 6, 12, 18, 24, 36];          // 개봉 후 사용기간(개월) 선택지
// 개봉일 빠르게 고르기: [이름, 며칠 전, 몇 달 전] — 정확한 날을 몰라도 추정 기한이 대략 맞게
const AGO = [['오늘', 0, 0], ['1주 전', 7, 0], ['1달 전', 0, 1], ['3달 전', 0, 3], ['6달 전', 0, 6], ['1년 전', 0, 12]];
const agoDate = (now, d, m) => addMonths(addDays(now, -d), -m);
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SLOTS = { am: '아침', pm: '저녁' };
const TAGS = ['좋음', '건조', '유분', '트러블', '홍조', '예민'];
// 레티놀·각질케어는 저녁에만, 서로 다른 날에. 목·일은 쉬는 날이라 팩을 둔다
const NIGHTS = { retinol: [0, 2, 4], acid: [1, 5], pack: [3, 6] };
// 자동 루틴을 조금씩 바꾸는 규칙: 계절(날짜로 자동)·피부 타입(⋯ 메뉴). 예민한 주가 우선(레티놀·각질을 다 쉼), 직접 고친 루틴은 그대로
// nights = 그 성분을 쓰는 저녁을 줄인다(여러 규칙이면 겹치는 날만 = 덜 쓰는 쪽), amLight = 아침엔 로션까지만(크림·페이스오일은 저녁)
const SEASONS = {
  change: { name: '환절기', nights: { retinol: [0, 4] }, note: '환절기: 레티놀은 주 2회(월·금)' },      // 피부가 쉽게 예민해지는 때
  summer: { name: '여름', nights: {}, amLight: true, note: '여름: 아침은 로션까지, 크림·페이스오일은 저녁에' },
  winter: { name: '겨울', nights: { acid: [5] }, note: '겨울: 각질케어는 주 1회(토)' },                 // 건조한 때
};
const SKINS = {
  dry: { name: '건성', nights: { acid: [5] }, note: '건성: 각질케어는 주 1회(토)' },
  normal: { name: '중성', nights: {} },
  oily: { name: '지성', nights: {}, amLight: true, note: '지성: 아침은 로션까지, 크림·페이스오일은 저녁에' },
  combo: { name: '복합성', nights: {} },
  dehyd: { name: '수부지', nights: {}, amLight: true, note: '수부지: 아침은 로션까지, 크림·페이스오일은 저녁에' },
};
const SENSITIVE = { name: '민감성', nights: { retinol: [0, 4] }, note: '민감성: 레티놀은 주 2회(월·금)' };
// 쉬는 저녁(제품별로 고름): 그 성분을 쓰는 저녁엔 이 제품을 뺀다 — 예: 각질 마스크 위에 꾸덕한 밤을 덮지 않게. [이름, 해당 묶음]
const REST = { acid: ['각질 성분 쓰는 저녁', ['acid']], retinol: ['레티놀 쓰는 저녁', ['retinol']], active: ['레티놀·각질 쓰는 저녁', ['retinol', 'acid']] };
const SOON = 30;                              // 기한이 이 날수 안이면 '임박'
const WEEK0 = '2026-11-16';                   // 돌려 쓰기 기준 주(월요일) — 이 주는 기한 빠른 것부터, 다음 주부터 한 칸씩 밀린다
const BACKUP_EVERY = 14;                      // 마지막 백업이 이 날수만큼 지나면 루틴 화면에서 알린다

/* ───────── 계산 (화면과 무관 — 점검: index.html?test) ───────── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const todayIdx = () => (new Date().getDay() + 6) % 7;      // 월=0 … 일=6
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const local = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = local(s); d.setDate(d.getDate() + n); return ymd(d); };
const dow = s => (local(s).getDay() + 6) % 7;                // 월=0 … 일=6
function addMonths(s, n) {                    // 1/31 + 1개월 = 2월 말일 (다음 달로 넘치지 않게)
  const [y, m, d] = s.split('-').map(Number);
  return ymd(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate())));
}

const openLimit = p => (p.opened && p.openedAt && p.pao ? addMonths(p.openedAt, p.pao) : '');
const knownExpiry = p => [p.expiry, openLimit(p)].filter(Boolean).sort()[0] || '';   // 적힌 기한과 개봉 기한 중 빠른 쪽
// 기한·사용기간을 모르는 개봉 제품은 개봉일 + 종류별 보통 사용기간으로 대략 잡는다 (화면엔 「추정」, 적으면 그쪽을 쓴다)
// ponytail: 종류·성분만 본다. 비타민C·레티놀은 빨리 변해서 6개월. 루틴에 안 넣는 종류(메이크업·바디·기타)는 제품마다 너무 달라 잡지 않음
const guessPao = p => !CATS[p.cat][1] ? 0 : p.actives.some(a => a === 'retinol' || a === 'vitc') ? 6 : { eye: 6, faceoil: 6 }[p.cat] ?? 12;
const guessed = p => (!knownExpiry(p) && p.opened && p.openedAt && guessPao(p) ? addMonths(p.openedAt, guessPao(p)) : '');
const expiryOf = p => knownExpiry(p) || guessed(p);

  const gs = group(p) === 'daily' && REST[p.rest]?.[1], byId = new Map(products.map(q => [q.id, q]));
  if (gs) for (const day of days) if (day.pm.some(id => byId.has(id) && gs.includes(group(byId.get(id))))) day.pm = day.pm.filter(id => id !== p.id);
}
// 쉬는 저녁을 고른 제품이 이번 주 어느 저녁에 빠지고, 그 저녁 같은 종류 자리에 무엇이 들어가는지 한 줄로 — 대신 들어가는 제품도 쉬게 해야 하는지 바로 보이게
// (11-17: 블루 드롭을 각질 저녁에 쉬게 하니 같은 EGF 세럼이 대신 들어갔다). p = 폼에 적힌 그대로(저장 전). 자동 루틴은 그 설정으로 다시 짜 보고, 직접 고친 루틴은 빠지기만 한다
function restNote(s, p, now) {
  const gs = group(p) === 'daily' && REST[p.rest]?.[1];
  if (!gs || !p.opened || p.when === 'off' || !CATS[p.cat][1] || expired(p, now)) return '';
  const products = s.products.some(q => q.id === p.id) ? s.products.map(q => (q.id === p.id ? p : q)) : [...s.products, p];      // 순서를 지켜야 저장한 뒤와 같은 루틴이 나온다
  const byId = new Map(products.map(q => [q.id, q])), M = s.routine.manual;
  const days = M ? s.routine.days : generate(products, isCalm(s.logs, now), now, rulesOf(s, now));
  const hit = days.map((d, i) => [DAYS[i], d.pm.map(id => byId.get(id)).filter(Boolean)]).filter(([, ps]) => ps.some(q => gs.includes(group(q))));
  if (!hit.length) return '이번 주엔 그 성분을 쓰는 저녁이 없어서 쉬는 날이 없어요';
  const when = hit.map(([d]) => d).join('·');
  if (M) return `직접 고친 루틴이라 ${when} 저녁에서 이 제품만 빠져요 (대신 넣지는 않아요)`;
  const subs = hit.map(([d, ps]) => [d, ps.filter(q => q.cat === p.cat && q.id !== p.id).map(q => q.name).join(' + ') || '없음(비어요)']);
  return `이번 주엔 ${when} 저녁에 쉬어요 · 그 자리엔 ${subs.every(([, n]) => n === subs[0][1]) ? subs[0][1] : subs.map(([d, n]) => `${d} ${n}`).join(', ')}`;
}
function isCalm(logs, now) {                  // 가장 최근 피부 기록이 7일 안이고 '예민'이면 (앞날짜로 잘못 적은 기록은 무시)
  const last = logs.filter(l => l.date <= now).reduce((m, l) => (!m || l.date >= m.date ? l : m), null);
  return !!last && daysBetween(last.date, now) <= 7 && last.tags.includes('예민');
}

// ponytail: 이름 키워드로 종류·성분을 어림짐작한다(위에서부터 먼저 맞는 것). 틀리면 폼에서 고치면 됨. 더 정확히 하려면 제품 DB·AI 조회로 교체
const CAT_HINTS = [
  ['oil', /클렌징\s*(오일|밤|워터|밀크|티슈)|리무버/i],
  ['makeup', /쿠션|파운데이션|(^|[^임])팩트|립\s*(스틱|밤|글로스|틴트|라이너|오일|마스크|케어)|틴트|섀도|마스카라|블러셔|컨실러|프라이머|파우더|아이라이너|브로우/i],
  ['sun', /선\s*(크림|스틱|젤|로션|밀크|세럼|에센스|스프레이)|썬|자외선|spf/i],
  ['body', /바디|샴푸|린스|트리트먼트|핸드|헤어|풋/i],
  ['sleep', /슬리핑|수면\s*팩|나이트\s*(팩|마스크)/i],
  ['mask', /마스크|팩(?!트)/i],
  ['exfol', /필링|각질|스크럽|peel/i],
  ['cleanser', /클렌저|클렌징|폼|세안|워시/i],
  ['eye', /아이\s*(크림|세럼|밤|젤)/i],
  ['toner', /토너|스킨|패드|toner/i],
  ['essence', /에센스|essence/i],
  ['serum', /세럼|앰플|serum|ampoule/i],
  ['lotion', /로션|에멀[전젼]|lotion/i],
  ['faceoil', /오일|oil/i],
  ['cream', /크림|밤|젤|포마드|연고|바세린|바셀린|버터|cream|balm|pomade|ointment/i],
];
// 꾸덕하게 덮는 제형(밤·포마드·연고…)의 크림은 각질 성분을 쓰는 저녁엔 쉬도록 미리 골라 둔다 — 틀리면 폼에서 「없음」으로
// 크림 종류일 때만(클렌징 밤·립밤·아이 밤은 다른 종류로 잡힌다). 「밤」은 낱말일 때만 — 밤부(대나무)·굿밤 크림은 아님
const HEAVY = /포마드|연고|바세린|바셀린|버터|(^|\s)밤(\s|$)|\S밤$|\bbalm\b|pomade|ointment/i;
const heavyRest = (name, cat) => (cat === 'cream' && HEAVY.test(name.trim()) ? 'acid' : '');
const ACTIVE_HINTS = {
  retinol: /레티놀|레티날|레티닐|retin/i,
  acid: /\b(aha|bha|pha|lha)\b|살리실|글리콜|필링|각질|효소|엔자임|enzyme|파우더\s*워시/i,
  vitc: /비타(민)?\s*c\b|vitamin\s*c\b|vita\s*c\b|아스코르|아스코빅/i,
};
function guess(name) {                        // 종류를 못 찾았어도 성분이 보이면 세럼으로
  const actives = Object.keys(ACTIVE_HINTS).filter(a => ACTIVE_HINTS[a].test(name));
  const cat = CAT_HINTS.find(([, re]) => re.test(name))?.[0] ?? (actives.length ? 'serum' : 'etc');
  return { cat, actives, rest: heavyRest(name, cat) };
}

/* ───────── 데이터 정리 (폼 저장·백업 가져오기 공통 — 모르는 값은 버린다) ───────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const text = (v, max) => (typeof v === 'string' ? v : '').trim().slice(0, max);
const date = v => {                           // 2/30 같은 없는 날짜는 버린다 (Date.parse 는 브라우저마다 달라 직접 되짚는다)
  const m = typeof v === 'string' && /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  return m && ymd(new Date(m[1], m[2] - 1, m[3])) === v ? v : '';
};
const isPhoto = v => typeof v === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(v);
function cleanProduct(p) {
  p = p && typeof p === 'object' ? p : {};
  const opened = !!p.opened || !!p.inUse;     // 예전 백업의 「사용중」 표시도 개봉한 것으로
  return {
    id: text(p.id, 40) || uid(), name: text(p.name, 80), cat: typeof p.cat === 'string' && Object.hasOwn(CATS, p.cat) ? p.cat : 'etc',
    actives: Object.keys(ACTIVES).filter(a => Array.isArray(p.actives) && p.actives.includes(a)),
    expiry: date(p.expiry), opened, openedAt: opened ? date(p.openedAt) : '', pao: PAOS.includes(+p.pao) ? +p.pao : 0,
    memo: text(p.memo, 300),
    when: ['am', 'pm', 'off'].includes(p.when) ? p.when : '',      // 쓰는 때: '' = 자동(종류·성분에 맞게), am = 아침만, pm = 저녁만, off = 루틴에 안 넣음(덧바름용·잠시 쉼)
    pair: text(p.pair, 40),                   // 함께 바르기: 이 제품 바로 앞에 바를 제품 id (없는 제품·자기 자신은 cleanState 가 지운다)
    rest: Object.hasOwn(REST, p.rest) ? p.rest : '',      // 쉬는 저녁: '' = 없음, acid·retinol·active(둘 다) = 그 성분을 쓰는 저녁엔 뺀다
  };
}
function cleanDone(x) {                      // 다 쓴 제품 기록: 이름·종류·성분·쓰는 때(다시 등록할 때 채움), 개봉일·다 쓴 날, 또 살래요
  x = x && typeof x === 'object' ? x : {};
  return { id: text(x.id, 40) || uid(), name: text(x.name, 80), cat: typeof x.cat === 'string' && Object.hasOwn(CATS, x.cat) ? x.cat : 'etc',
    actives: Object.keys(ACTIVES).filter(a => Array.isArray(x.actives) && x.actives.includes(a)), when: ['am', 'pm', 'off'].includes(x.when) ? x.when : '',
    rest: Object.hasOwn(REST, x.rest) ? x.rest : '', openedAt: date(x.openedAt), doneAt: date(x.doneAt) || today(), again: !!x.again };
}
function cleanLog(l) {
  l = l && typeof l === 'object' ? l : {};
  return {
    id: text(l.id, 40) || uid(), date: date(l.date) || today(), tags: TAGS.filter(t => Array.isArray(l.tags) && l.tags.includes(t)),
    memo: text(l.memo, 500), thumb: isPhoto(l.thumb) ? l.thumb : '',      // thumb 가 있으면 원본 사진은 저장소의 photo:<id>
  };
}
function cleanAnalysis(r) {                   // AI 답도 믿지 않고 정해진 값만 남긴다. '좋음'은 다른 상태와 같이 두지 않는다
  const tags = r?.ok === true ? TAGS.filter(t => Array.isArray(r.tags) && r.tags.includes(t)) : [];
  return { ok: r?.ok === true, tags: tags.length > 1 ? tags.filter(t => t !== '좋음') : tags,
    summary: text(typeof r?.summary === 'string' ? r.summary.replace(/\s+/g, ' ') : '', 300) };      // 한 줄로 — 메모의 'AI:' 줄 하나에 들어가게
}
function cleanState(s) {
  s = s && typeof s === 'object' ? s : {};
  const uniq = (arr, clean) => { const seen = new Set(); return (Array.isArray(arr) ? arr : []).map(clean).filter(x => !seen.has(x.id) && seen.add(x.id)); };
  const products = uniq(s.products, cleanProduct).filter(p => p.name);
  const ids = new Set(products.map(p => p.id));
  for (const p of products) if (p.pair === p.id || !ids.has(p.pair)) p.pair = '';
  const slot = v => [...new Set(Array.isArray(v) ? v : [])].filter(id => ids.has(id));
  return {
    products, logs: uniq(s.logs, cleanLog),
    // until = 직접 고친 루틴을 이 날(그 주 일요일)까지만 유지 ('' = 계속). 지나면 자동 루틴으로 돌아간다 (arrange)
    routine: { manual: !!s.routine?.manual, until: s.routine?.manual ? date(s.routine.until) : '', days: DAYS.map((_, d) => ({ am: slot(s.routine?.days?.[d]?.am), pm: slot(s.routine?.days?.[d]?.pm) })) },
    backupAt: date(s.backupAt),               // 마지막으로 백업 파일을 만든 날
    done: (Array.isArray(s.done) ? s.done : []).map(cleanDone).filter(x => x.name).slice(-300),      // ponytail: 다 쓴 제품은 최근 300개까지만
    // 발랐어요 체크: { 'YYYY-MM-DD': { am: [id…], pm: [id…] } } — 없는 제품·빈 날은 버린다 (한 달 지난 날은 체크할 때 지움)
    ticks: Object.fromEntries(Object.entries(s.ticks && typeof s.ticks === 'object' ? s.ticks : {}).filter(([k]) => date(k))
      .map(([k, v]) => [k, { am: slot(v?.am), pm: slot(v?.pm) }]).filter(([, v]) => v.am.length || v.pm.length)),
    skin: { type: Object.hasOwn(SKINS, s.skin?.type) ? s.skin.type : '', sensitive: !!s.skin?.sensitive },      // 내 피부 타입 ('' = 고르지 않음)
  };
}

/* ───────── 저장소 (이 브라우저의 IndexedDB. 키: state, photo:<기록 id>) ───────── */
const idb = (() => {
  let open;                                   // 연결이 끊기면(iOS 가 백그라운드 탭에서 끊기도 함) 다음 요청 때 다시 연다
  const conn = () => open ??= new Promise((ok, no) => {
    const r = indexedDB.open('vanity', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { r.result.onclose = () => (open = null); ok(r.result); };
    r.onerror = () => no(r.error);
  });
  const run = (mode, fn) => conn().then(db => new Promise((ok, no) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => ok(q.result);
    t.onerror = t.onabort = () => no(t.error);
  })).catch(e => { open = null; throw e; });
  return { get: k => run('readonly', s => s.get(k)), set: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)),
    run };
})();

/* ───────── 화면 ───────── */
const $ = s => document.querySelector(s);
const view = $('#view'), dlg = $('#dlg');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
// 화장품 탭에서 고른 정렬·종류는 이 기기(브라우저)에 기억한다 — 앱을 다시 열어도 그대로. 기록(state)이 아니라 화면 편의라 백업·다른 창 동기화에는 넣지 않는다
// 못 읽거나 못 써도(사생활 보호 모드·저장 막힘) 기본값으로 그냥 돈다
const VIEW_KEY = 'vanity.view';
const viewPref = (() => { try { return JSON.parse(localStorage.getItem(VIEW_KEY)) || {}; } catch { return {}; } })();
const keepView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify({ sortBy, kindF })); } catch {} };
let state, tab = 'routine', dayIdx = todayIdx(), shownDay = today(), editing = false, filter = 'all', kindF = Object.hasOwn(CATS, viewPref.kindF) ? viewPref.kindF : '',
  sortBy = typeof viewPref.sortBy === 'string' ? viewPref.sortBy : 'expiry', query = '', focusId = '', toastTimer, noSave = false;      // sortBy 는 SORTS 를 정한 뒤 한 번 더 거른다
let queue = [];                               // 사진 한 장에서 읽은 화장품 중 아직 등록 창을 안 띄운 것
// lastCheck = 마지막 AI 점검 답. checkBack = 점검 창의 「열어 고치기」로 제품 창을 열었을 때 그 답 — 제품 창이 닫히면 이것으로 점검 창에 돌아온다 (AI 에 다시 묻지 않음)
let lastCheck = null, checkBack = null, lastAdvice = '';      // lastAdvice = 방금 붙여 넣은 다른 AI 답 (저장하지 않음 — adviceForm)
let rebuyFor = null;                          // 「다시 샀어요」로 연 등록 창이면 그 다 쓴 기록 id — 저장하면 「또 살래요」를 끈다
let fill = null;                              // 기한 하나씩 채우기: { ids: 채울 제품 순서, i: 지금 몇 번째, done: 기한이 생긴 수 }
const BACKUP_MAX = 300 * 2 ** 20;             // ponytail: 폰 메모리로 한 번에 읽을 수 있는 백업 크기. 사진이 아주 많이 쌓이면 백업을 나눠야 한다

const product = id => state.products.find(p => p.id === id);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;      // 홈 화면 앱으로 열었나
const WHEN = { am: '아침만', pm: '저녁만', off: '루틴에 안 넣음' };
const restOf = p => (p.rest && group(p) === 'daily' ? REST[p.rest][0] : '');      // 쉬는 저녁 이름 (레티놀·각질·팩 제품엔 안 먹히니 빈 값)
const sub = p => [CATS[p.cat][0], ...p.actives.map(a => ACTIVES[a]), ...(p.when ? [WHEN[p.when]] : []), ...(restOf(p) ? [`${restOf(p)}엔 쉼`] : [])].join(' · ');
const fail = e => toast(`저장하지 못했어요. 저장 공간이나 브라우저 설정을 확인해 주세요. (${e?.name ?? '오류'})`, true);
// ponytail: 바뀔 때마다 state 를 통째로 다시 쓴다(썸네일 포함). 피부 기록이 수백 건을 넘어 느려지면 기록을 키별로 쪼갤 것
// noSave: 시작할 때 저장된 내용을 못 읽었으면 쓰지 않는다 — 빈 상태로 기존 기록을 덮어쓰지 않게
// 다른 창(홈 화면 앱·브라우저 탭·화면 분할)이 저장하면 알린다 — 오래된 창이 새 기록을 덮어쓰지 않게 (받는 쪽은 reload)
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('vanity') : null;
let seen;                                     // 이 창이 마지막으로 저장소와 맞춘 내용 — 저장소가 그대로면 reload 는 다시 그리지 않는다
// ponytail: 저장할 때마다 state 를 통째로 글로 한 번 더 만든다(썸네일 포함). 피부 기록이 수백 건이라 느려지면 저장소에 번호(rev) 칸을 따로 두고 그것만 비교할 것
const save = () => {
  if (noSave) return Promise.resolve(false);
  const s = JSON.stringify(state);
  return idb.set('state', state).then(() => (seen = s, bc?.postMessage('saved'), true), e => (fail(e), false));
};
// 자동 루틴이면 다시 짠다. 직접 고친 루틴은 그대로 둔다 — 자동 때 순한 세안·먼저 바를 제품으로 들어간 자리도 사용자 것이 된다
const lapsed = (R, now) => R.manual && !!R.until && now > R.until;      // 「이번 주만」 고친 루틴의 그 주가 지났나
function arrange() {
  const now = today(), R = state.routine;
  if (lapsed(R, now)) { R.manual = false; R.until = ''; }
  if (!R.manual) R.days = generate(state.products, isCalm(state.logs, now), now, rulesOf(state, now));
}
// 직접 고친 루틴에서 쓰는 때를 아침만·저녁만으로 바꾸면, 그 제품만 반대 시간 자리에서 뺀다
const dropClash = p => { if (state.routine.manual) for (const day of state.routine.days) for (const t in SLOTS) if (clash(p, t)) day[t] = day[t].filter(id => id !== p.id); };
function commit() {                           // 모든 변경의 끝: 자동 루틴 갱신 → 저장 → 다시 그리기. 저장 성공 여부를 돌려준다
  arrange();
  const saved = save(); render(); return saved;
}
const manual = () => { state.routine.manual = true; commit(); };
function toast(msg, bad) {
  const t = $('#toast');

        .map(([k, n]) => `<option value="${k}" ${k === sortBy ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : '') + '</div>' : '')

function viewSkin() {

  const logs = [...state.logs].reverse().sort((a, b) => b.date.localeCompare(a.date));      // 최근 날짜·나중에 쓴 것부터

    <div class="field">${help('쓰는 때', '레티놀·각질 성분·팩은 아침만·저녁만과 상관없이 정해진 저녁에만 들어가요.')}<select name="when" aria-label="쓰는 때">${[['', '자동 (종류·성분에 맞게)'], ['am', '아침만'], ['pm', '저녁만'], ['off', '루틴에 안 넣음 (덧바름용·잠시 쉼)']].map(([v, n]) =>

    <fieldset aria-label="성분">${help('성분', '들어 있으면 체크해요. 루틴의 요일·시간을 나눠요. 효소 세안제·파우더 워시도 AHA·BHA·효소예요.')}<div class="checks">${Object.entries(ACTIVES).map(([k, v]) =>
      `<label class="pill"><input type="checkbox" name="actives" value="${k}" ${p.actives.includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</div></fieldset>

    </div>

      <button type="button" data-act="${filling ? 'fillStop' : 'close'}">${filling ? '그만' : '취소'}</button><button class="primary">저장</button></div></form>`);

function fillGo(step) {                       // 기한 채우기: 다음 제품 창을 연다 (그사이 지운 제품은 건너뛴다)
  fill.i += step;
  while (fill.i < fill.ids.length && !product(fill.ids[fill.i])) fill.i++;
  if (fill.i < fill.ids.length) return productForm(product(fill.ids[fill.i]));
  const done = fill.done; fill = null; shut();
  toast(done ? `기한 채우기를 마쳤어요. ${done}개에 기한이 생겼어요` : '기한 채우기를 마쳤어요');
}
// ready = 받아 둔 답(「열어 고치기」로 제품 창에 갔다 돌아올 때) — AI 에 다시 묻지 않고 지금 설정에 맞춰 버튼만 다시 그린다
// advice = 다른 AI 에게 받은 답(붙여 넣은 글) — 있으면 점검 대신 그 답에서 반영할 것만 뽑아 같은 창에 버튼으로 보여 준다
async function checkForm(ready, advice) {     // AI 루틴 점검 결과 창 (「다시 점검」도 여기로)
  const adv = !!(advice || ready?.advice);
  modal(`<form method="dialog">
    <h2>${adv ? '📥 다른 AI 답 반영' : '✨ AI 루틴 점검'}</h2>
    <p class="ai" role="status">준비 중이에요…</p><div class="check"></div>
    ${help(adv ? 'AI가 받은 답에서 뽑은 것이라 다를 수 있어요 — 누르기 전에 확인해 주세요' : 'AI 의견이라 틀릴 수 있어요',
      `보내는 것: ${adv ? '붙여 넣은 글과 ' : ''}제품 이름·종류·성분·쓰는 때·메모, 이번 주 루틴, 가장 최근 피부 상태 태그 (사진·피부 메모는 안 보내요)`)}
    <div class="actions"><span class="grow"></span>${adv ? '<button type="button" data-act="pasteAdvice">다시 붙여 넣기</button>' : '<button type="button" data-act="check">다시 점검</button>'}<button class="primary">닫기</button></div></form>`);
  const form = dlg.querySelector('form'), out = form.querySelector('.ai'), again = form.querySelector('.actions [type=button]');
  const live = () => form.isConnected && dlg.open;      // 창을 닫았거나 다시 점검을 눌렀으면 이 결과는 버린다
  again.disabled = true;
  try {
    let r = ready;
    if (!r) {
      const key = await getKey();
      if (!live()) return;
      if (key === null) return void (out.textContent = '저장소를 읽지 못했어요. 다시 해 주세요.');
      if (!key) return void (out.textContent = `⋯ 메뉴에서 Gemini API 키(무료)를 등록하면 ${adv ? '받은 답을 버튼으로 바꿔 줘요' : 'AI가 루틴을 점검해 줘요'}.`);
      if (!state.products.some(p => p.opened)) return void (out.textContent = `개봉한 제품이 없어서 ${adv ? '반영할' : '점검할'} 루틴이 없어요.`);
      out.textContent = adv ? 'AI가 받은 답을 읽는 중이에요… (보통 10초 안팎)' : 'AI가 루틴을 보는 중이에요… (보통 10초 안팎)';
      r = await checkRoutineAI(key, advice);
      if (!live()) return;
      lastCheck = r;                          // 화면에 그리는 답만 받아 둔다 (닫았다 다시 점검해 겹친 옛 요청이 덮어쓰지 않게)
    }
    out.textContent = r.summary || (adv ? (r.points.length ? '받은 답에서 반영할 것을 뽑았어요.' : '받은 답에서 앱에 바로 반영할 것을 찾지 못했어요.') : '점검을 마쳤어요.');
    // 제안이 한 제품에 관한 것이면 바로 적용 버튼 (제품은 보낸 목록의 번호로 찾는다 — checkRoutineAI)
    form.querySelector('.check').innerHTML = r.points.length ? `<ul class="alts">${r.points.map(p => {
      const q = p.id ? product(p.id) : null;
      let acts = !q ? '' : [
        !p.memo ? '' : !q.memo.includes(p.memo) ? `<button type="button" data-act="applyMemo" data-id="${esc(q.id)}" data-memo="${esc(p.memo)}">📝 메모에 넣기</button>`
          : '<small>✓ 이미 메모에 있어요</small>',
        !p.when || (group(q) !== 'daily' && p.when !== 'off') ? ''      // 아침만·저녁만·자동은 매일 쓰는 종류에만, 루틴에 안 넣음은 어느 제품에나
          : q.when !== CHECK_WHEN[p.when][0] ? `<button type="button" data-act="applyWhen" data-id="${esc(q.id)}" data-when="${p.when}">${CHECK_WHEN[p.when][1]}</button>`
          : `<small>✓ 이미 ${CHECK_WHEN[p.when][1]} 되어 있어요</small>`,      // 이미 된 것을 다시 권하면 버튼 대신 알려 준다
        !p.rest || group(q) !== 'daily' ? ''
          : q.rest !== p.rest ? `<button type="button" data-act="applyRest" data-id="${esc(q.id)}" data-rest="${p.rest}">${REST[p.rest][0]}엔 쉬기</button>`
          : `<small>✓ 이미 ${REST[p.rest][0]}엔 쉬게 되어 있어요</small>`,
      ].join('');
      // 조정이면 그 제품을 열어 직접 고치는 버튼을 늘 붙인다 — AI 가 버튼으로 못 만드는 설정(성분 체크·먼저 바를 제품 등)을 권하거나 칸을 비워 보내도 막히지 않게
      // (11-17: 조정인데 맞는 버튼이 없다는 말이 세 번째). 제품 창을 닫으면 이 점검 창으로 돌아온다 (checkBack)
      if (q && p.kind === '조정') acts += `<button type="button" data-act="editProduct" data-id="${esc(q.id)}">✏️ 열어 고치기</button>`;
      // 버튼이 어느 제품에 적용되는지 이름을 적어 둔다 — AI 가 번호를 잘못 고르거나(붙여 넣은 답은 그사이 목록이 바뀌었을 수도) 엉뚱한 제품에 누르지 않게
      return `<li><span class="tag ${CHECK_KINDS[p.kind]}">${p.kind}</span><span class="what"><b>${esc(p.title)}</b><small>${esc(p.detail)}</small>${acts ? `<small class="for">→ ${esc(q.name)}</small>${p.memo ? `<small>📝 ${esc(p.memo)}</small>` : ''}<span class="acts">${acts}</span>` : ''}</span></li>`;      // 메모 버튼이 넣을 글도 그대로 보여 준다 (설명과 다른 글이 들어가지 않게 눈으로 확인)
    }).join('')}</ul>` : '';
  } catch (e) { if (live()) out.textContent = e.message; }
  finally { if (form.isConnected) again.disabled = false; }
}
// 다른 AI 답 붙여 넣기 — 「루틴 글로 복사」를 다른 AI 에 보내 받은 답을, 제품별 바로 적용 버튼으로 바꾼다 (결과는 checkForm 창)
// 붙여 넣은 글은 저장하지 않는다. 오류가 나거나 다시 하고 싶을 때 또 붙여 넣지 않게 앱을 다시 열 때까지만 기억한다 (lastAdvice)

function shrink(file, max, q) {               // 긴 변 max px JPEG data URL 로 줄인다
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const out = c.toDataURL('image/jpeg', q); c.width = c.height = 0; ok(out);     // iOS 캔버스 메모리 반납
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('사진을 읽을 수 없어요.')); };
    img.src = url;
  });
}
async function exportAll() {

  const photos = Object.create(null);

  // ponytail: 사진까지 JSON 한 파일로 내보낸다. 사진이 수백 장이라 파일이 무거워지면 zip·분할로
  const at = today(), name = `화장대-백업-${at}.json`;
  const blob = new Blob([JSON.stringify({ app: 'vanity', v: 1, at, state: { ...state, backupAt: at }, photos })], { type: 'application/json' });
  // 파일 공유를 받아 주는 브라우저(아이폰 등)는 공유 창으로, 아니면 내려받기로 — 안드로이드 크롬은 json 파일 공유를 막아 두어 「다운로드」 폴더로 간다
  const file = new File([blob], name, { type: 'application/json' });
  let shared = false;
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); shared = true; }
    catch (e) { if (e?.name === 'AbortError') return; }      // 공유 창을 닫았으면 백업 안 한 것. 그 밖(누른 지 오래돼 막힘 등)은 내려받기로
  }
  if (!shared) {
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: name }).click();
    setTimeout(() => URL.revokeObjectURL(url), 6e4);
  }
  if (blob.size > BACKUP_MAX) return toast('백업이 300MB를 넘어 이 앱으로는 다시 가져올 수 없어요. 오래된 피부 기록을 지우고 다시 내보내 주세요.', true);

async function importFile(file) {
  if (file.size > BACKUP_MAX) return toast('백업 파일이 너무 커요 (300MB까지)', true);
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('백업 파일을 읽을 수 없어요', true); }
  if (data?.app !== 'vanity') return toast('이 앱의 백업 파일이 아니에요', true);
  const next = cleanState(data.state);
  next.backupAt ||= date(data.at);            // 날짜 칸이 없던 옛 백업 파일은 파일을 만든 날로
  if (!confirm(`지금 내용을 지우고 백업 내용(화장품 ${next.products.length}개 · 피부 기록 ${next.logs.length}건)으로 바꿀까요?`)) return;
  // 새 사진 → 새 state → 옛 사진 삭제 순서. 중간에 실패해도 지금 기록은 남는다(id 가 같은 기록의 사진은 백업본으로 바뀌어 있을 수 있음)
  try {
    for (const l of next.logs) {
      const ph = data.photos?.[l.id];
      if (l.thumb && isPhoto(ph)) await idb.set('photo:' + l.id, ph);
    }
    await idb.set('state', next);
    noSave = false;                           // 가져온 내용이 저장됐으니 이제부터 고친 것도 저장한다
  } catch (e) { return fail(e); }             // 그때 먼저 써 둔 사진은 다음 시작 때 sweepPhotos 가 치운다
  const keep = new Set(next.logs.map(l => l.id));
  for (const l of state.logs) if (!keep.has(l.id)) idb.del('photo:' + l.id).catch(() => {});
  state = next; shut(); commit(); toast('백업을 가져왔어요');
}

    const dup = i < 0 ? sameName(state.products, p) : null;      // 새로 등록할 때만 묻는다 — 여분을 따로 등록하는 것일 수도 있으니 막지는 않는다

    const prev = state.products[i];
    i < 0 ? state.products.push(p) : (state.products[i] = p);
    if (p.when !== (prev?.when ?? '')) dropClash(p);

    if (rebuyFor && !f.dataset.id) { const x = state.done.find(x => x.id === rebuyFor); if (x) x.again = false; rebuyFor = null; }      // 다시 산 것을 등록했으면 재구매 목록에서 내린다
    if (!f.dataset.id && queue.length) { productForm(queue.shift(), true); toast(`‘${p.name}’ 저장했어요`); return void commit(); }      // 사진에서 읽은 다음 제품
    if (fill && f.dataset.id && f.dataset.id === fill.ids[fill.i]) {      // 기한 채우기 중이면 저장하고 다음 제품으로

    const old = state.logs.find(l => l.id === f.dataset.id);

function refresh() {

  shownDay = today(); dayIdx = todayIdx(); commit();
}

async function reload() {
  if (noSave || !state) return;
  try {
    const saved = await idb.get('state'), s = JSON.stringify(saved);
    // 바뀐 게 없으면 다시 그리지 않는다 — 폰은 사진 찍기·고르기에서 돌아오면 이게 사진보다 먼저 돌아서, 다시 그리면 사진이 사라진 입력 칸으로 간다
    if (saved == null || s === seen) return;
    seen = s; state = cleanState(saved); arrange(); render();
  } catch {}
}

(async () => {
  if (location.search === '?test') return selfTest();
  let loaded = false;
  try {
    const saved = await idb.get('state').catch(() => idb.get('state'));      // 연결이 끊겼으면 idb 가 다시 열어 한 번 더
    state = cleanState(saved); seen = JSON.stringify(saved); loaded = saved != null;
  } catch {
    state = cleanState(); noSave = true;
    toast('저장된 내용을 읽지 못했어요. 새로고침해 보세요. 지금 고친 내용은 저장되지 않아요.', true);
  }
  arrange();
  render();
  navigator.storage?.persist?.().catch(() => {});      // 브라우저가 임의로 비우지 않게 요청 (거절돼도 동작)
  navigator.serviceWorker?.register('sw.js').catch(() => {});   // 인터넷 없이도 열리게 (sw.js)
  idb.del('apiKey').catch(() => {});                   // ponytail: Claude 를 쓰던 때의 키 자리 — 남은 키가 있으면 지운다. 몇 달 뒤 이 줄은 지워도 된다
  // 사진 정리는 저장된 상태를 제대로 읽었을 때만(못 읽었는데 지우면 사진을 다 잃는다), 그리고 앱이 이 창 하나에서만 열려 있을 때만 —
  // 처음 연 창이 잠금을 닫힐 때까지 쥐고 있어서, 다른 창이 사진을 쓰는 도중에 지우지 않는다. 잠금을 못 쓰는 브라우저면 정리하지 않는다
  if (loaded) navigator.locks?.request('vanity-sweep', { ifAvailable: true }, lock => lock && sweepPhotos().then(() => new Promise(() => {}))).catch(() => {});
})();
// 기록이 가리키지 않는 사진(저장·가져오기가 중간에 실패한 흔적)을 치운다. 키 목록 읽기와 지우기를 한 트랜잭션으로
function sweepPhotos() {
  const keep = new Set(state.logs.map(l => 'photo:' + l.id));
  return idb.run('readwrite', s => {
    const q = s.getAllKeys();
    q.onsuccess = () => { for (const k of q.result) if (typeof k === 'string' && k.startsWith('photo:') && !keep.has(k)) s.delete(k); };
    return q;
  });
}
