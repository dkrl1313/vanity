<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1716">
<title>화장대</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="화장대">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧴%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f5; --card: #fff; --ink: #2b2523; --muted: #756a65; --line: #ebe3de;
  --accent: #a94f43; --on-accent: #fff; --soft: #f6e9e5;
  --warn: #8a5300; --warn-bg: #fdf0d5; --bad: #b3261e; --bad-bg: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1716; --card: #262120; --ink: #f2eae7; --muted: #a99d98; --line: #3a322f;
    --accent: #e8a094; --on-accent: #2a1410; --soft: #3a2824;
    --warn: #ffd08a; --warn-bg: #3e2f12; --bad: #ffb4ab; --bad-bg: #4b1f1b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto; max-width: 560px; min-height: 100dvh; background: var(--bg); color: var(--ink);
  padding: 0 16px calc(80px + env(safe-area-inset-bottom));
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 0; }
small, .muted { color: var(--muted); font-size: 13px; font-weight: 400; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .35; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.danger { color: var(--bad); border-color: transparent; background: none; }
.wide { width: 100%; min-height: 48px; margin-bottom: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
header button { border: 0; background: none; font-size: 22px; min-width: 44px; min-height: 44px; padding: 0; }
nav {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav button { border: 0; border-radius: 0; background: none; min-height: 56px; color: var(--muted); font-size: 14px; }
nav button[aria-current] { color: var(--accent); font-weight: 700; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: #b3261e; color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.on { background: var(--soft); color: var(--accent); border-color: transparent; }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.secret { -webkit-text-security: disc; }     /* 비밀번호 칸으로 두면 비밀번호 관리자가 키를 저장하려 든다 */
.ai { margin: 0; background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
.note button { display: block; margin-top: 8px; }
.empty { text-align: center; padding: 40px 12px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 17px; }
.chip { min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.filters .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }

/* 루틴 */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.day { padding: 4px 0; min-height: 54px; display: grid; justify-items: center; align-content: center; border-radius: 12px; }
.day b { font-size: 15px; }
.day small { font-size: 10.5px; line-height: 15px; min-height: 15px; }
.day[aria-current] { border-color: var(--accent); }
.day[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed=true] small { color: inherit; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.bar small { flex: 1; min-width: 150px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.what { flex: 1; min-width: 0; display: grid; }
button.what { border: 0; background: none; padding: 2px 0; min-height: 0; border-radius: 6px; text-align: left; }      /* 루틴에서 눌러 상세 열기 */
.what .memo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }      /* 바르는 법 메모는 한 줄로 (전체는 상세에서) */
.what b { font-weight: 600; }
.ctl { display: flex; gap: 4px; flex: none; }
.ctl button { min-width: 36px; min-height: 36px; padding: 0; }
.card select { margin-top: 8px; }

/* 화장품 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prod { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.prod .name { border: 0; background: none; padding: 4px 0; min-height: 0; text-align: left; font-weight: 600; }
.alts { list-style: none; margin: 0; padding: 0; }
.alts li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.check li { align-items: flex-start; }      /* 점검 항목은 여러 줄이라 위로 맞춘다 */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.acts button { min-height: 32px; padding: 4px 10px; font-size: 13px; }

/* 피부 기록 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.log { padding: 0 0 10px; border-radius: 16px; overflow: hidden; display: grid; gap: 4px; text-align: left; align-content: start; }
.log img, .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.log b, .log small, .log .tags { padding: 0 10px; }
.log .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.log small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 입력 창 */
dialog { border: 0; border-radius: 18px; padding: 20px; width: min(100vw - 24px, 480px); max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
form { display: grid; gap: 14px; }
form > label, .two label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-size: 13px; color: var(--muted); }
input:not([type=checkbox]), select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
textarea { resize: vertical; }
input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
form > label.pill, label.pill { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--ink); cursor: pointer; }
label.pill:has(:checked) { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 10px; }
form:has([name=opened]:not(:checked)) .if-opened { display: none; }
.actions { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
form > label.btn, .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.btn:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }      /* 창이 열릴 때 자동 초점엔 안 뜨고 키보드로 옮겼을 때만 */
.btn:has(:disabled) { opacity: .35; pointer-events: none; }
.adds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.adds > * { min-height: 48px; }
.preview { width: 100%; max-height: 46dvh; object-fit: contain; border-radius: 12px; background: var(--bg); }
.sr, input.sr { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); }

#toast { inset: auto auto calc(72px + env(safe-area-inset-bottom)) 50%; translate: -50% 0; margin: 0; border: 0; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; max-width: calc(100vw - 32px); }
#toast.bad { background: #b3261e; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>화장대</h1>
  <button data-act="backup" aria-label="설정·백업" title="설정·백업">⋯</button>
</header>
<main id="view"></main>
<nav aria-label="화면">
  <button data-act="tab" data-tab="routine">루틴</button>
  <button data-act="tab" data-tab="products">화장품<span id="soon" class="count" hidden></span></button>
  <button data-act="tab" data-tab="skin">피부 기록</button>
</nav>
<dialog id="dlg"></dialog>
<p id="toast" role="status" popover="manual"></p>

<script>
'use strict';

/* ───────── 기준값 ───────── */
// 종류: 적힌 순서 = 바르는 순서. [이름, 자동 루틴에 넣는 때] ('' = 루틴에 넣지 않음)
const CATS = {
  oil: ['클렌징오일·밤', 'pm'], cleanser: ['폼클렌저', 'both'], exfol: ['각질케어', 'pm'], toner: ['토너·스킨', 'both'],
  mask: ['마스크팩', 'pm'], essence: ['에센스', 'both'], serum: ['세럼·앰플', 'both'], eye: ['아이크림', 'both'],
  lotion: ['로션·에멀전', 'both'], cream: ['크림', 'both'], faceoil: ['페이스오일', 'pm'], sleep: ['슬리핑팩', 'pm'],
  sun: ['선크림', 'am'], makeup: ['메이크업', ''], body: ['바디·헤어', ''], etc: ['기타', ''],
};
const ORDER = Object.keys(CATS);
const ACTIVES = { retinol: '레티놀', acid: 'AHA·BHA·효소', vitc: '비타민C' };      // acid = 각질을 녹이는 것 (산·효소 세안제)
const PAOS = [3, 6, 12, 18, 24, 36];          // 개봉 후 사용기간(개월) 선택지
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SLOTS = { am: '아침', pm: '저녁' };
const TAGS = ['좋음', '건조', '유분', '트러블', '홍조', '예민'];
// 레티놀·각질케어는 저녁에만, 서로 다른 날에. 목·일은 쉬는 날이라 팩을 둔다
const NIGHTS = { retinol: [0, 2, 4], acid: [1, 5], pack: [3, 6] };
const SOON = 30;                              // 기한이 이 날수 안이면 '임박'
const BACKUP_EVERY = 14;                      // 마지막 백업이 이 날수만큼 지나면 루틴 화면에서 알린다

/* ───────── 계산 (화면과 무관 — 점검: index.html?test) ───────── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const todayIdx = () => (new Date().getDay() + 6) % 7;      // 월=0 … 일=6
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function addMonths(s, n) {                    // 1/31 + 1개월 = 2월 말일 (다음 달로 넘치지 않게)
  const [y, m, d] = s.split('-').map(Number);
  return ymd(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate())));
}

const openLimit = p => (p.opened && p.openedAt && p.pao ? addMonths(p.openedAt, p.pao) : '');
const expiryOf = p => [p.expiry, openLimit(p)].filter(Boolean).sort()[0] || '';   // 적힌 기한과 개봉 기한 중 빠른 쪽
const left = (p, now) => (expiryOf(p) ? daysBetween(now, expiryOf(p)) : null);    // 남은 날 (기한 없으면 null)
const expired = (p, now) => (left(p, now) ?? 0) < 0;                              // 기한 당일까지는 사용

function group(p) {                           // 주기 묶음. 씻어내는 클렌저는 성분과 상관없이 매일
  if (p.cat === 'oil' || p.cat === 'cleanser') return 'daily';
  if (p.actives.includes('retinol')) return 'retinol';
  if (p.cat === 'exfol' || p.actives.includes('acid')) return 'acid';
  if (p.cat === 'mask' || p.cat === 'sleep') return 'pack';
  return 'daily';
}
const clash = (p, t) => !!p?.when && group(p) === 'daily' && p.when !== t;      // 아침만·저녁만으로 고른 제품이 다른 시간 자리에 있나 (레티놀·각질·팩은 쓰는 때를 안 따름)
const vitcAm = p => !p.when && p.actives.includes('vitc') && p.cat !== 'cleanser' && CATS[p.cat][1] === 'both';      // 바르는 비타민C는 아침으로 (쓰는 때를 직접 고르면 그쪽)
function fits(p, d, t, calm) {                // 이 제품을 d요일 t(am/pm)에 써도 되는가
  const when = CATS[p.cat][1], g = group(p);
  if (!when) return false;
  // 레티놀·각질·팩은 쓰는 때 설정과 상관없이 정해진 저녁에만 (레티놀·각질 성분은 낮에 쓰면 자극·햇빛 민감)
  if (g !== 'daily') return t === 'pm' && NIGHTS[g].includes(d) && !(calm && g !== 'pack');
  if (p.when) return p.when === t;            // 내가 고른 때가 종류 기본값·비타민C 아침 규칙보다 우선
  if (vitcAm(p)) return t === 'am';
  return when === 'both' || when === t;
}
// 개봉했고 기한 안 지난 제품으로 일주일 루틴을 짠다 (개봉 = 루틴 대상) → [{am: [id…], pm: [id…]} × 7]
// calm = 피부가 예민한 주: 레티놀·각질케어를 뺀다
function generate(products, calm, now) {
  const usable = products.filter(p => p.opened && !expired(p, now))
    .sort((a, b) => (expiryOf(a) || '9').localeCompare(expiryOf(b) || '9'));      // 기한 임박한 것부터
  const turn = {}, next = (key, pool) => pool[(turn[key] = (turn[key] ?? -1) + 1) % pool.length], byId = new Map(usable.map(p => [p.id, p]));
  return DAYS.map((_, d) => {
    const day = {};
    // 레티놀·각질 제품을 쓰는 날 — 그날은 아침·저녁 모두 각질 성분(산·효소) 클렌저를 피한다
    // 예민한 주(calm)엔 레티놀·각질을 쉬는 대신 일주일 내내 그렇게 — 안 그러면 순한 세안 날이 사라져 각질 클렌저를 매일 쓰게 된다
    const activeDay = calm || usable.some(p => (group(p) === 'retinol' || group(p) === 'acid') && fits(p, d, 'pm', calm));
    for (const t in SLOTS) {
      day[t] = [];
      // 슬리핑팩을 쓰는 저녁엔 크림을 뺀다 — 앞 단계가 무거우면 팩이 안 마르고 밀린다. 로션까지 바르고 팩으로 마무리
      const sleeping = usable.some(p => p.cat === 'sleep' && fits(p, d, t, calm));
      // 레티놀·각질 성분은 한 저녁에 하나만 — 종류(토너·마스크 등)가 달라도 그 성분 제품끼리 저녁마다 돌려 쓴다
      const only = {};
      for (const g of ['retinol', 'acid']) {
        const c = usable.filter(p => group(p) === g && fits(p, d, t, calm));
        if (c.length) only[g] = next(g, c).id;
      }
      for (const cat of ORDER) {
        if (sleeping && cat === 'cream') continue;
        let fit = usable.filter(p => p.cat === cat && fits(p, d, t, calm) && !(only[group(p)] && only[group(p)] !== p.id));
        // 레티놀·각질 날엔 각질 성분 없는 클렌저로 — 자극이 겹치지 않게. 피부 보호 규칙이라 쓰는 때(아침만·저녁만)보다 우선, 순한 클렌저가 없으면 그대로
        let swap = '';
        if (cat === 'cleanser' && activeDay && fit.some(p => p.actives.includes('acid'))) {
          const calmFit = fit.filter(p => !p.actives.includes('acid'));      // 원래 그 시간에 쓰던 순한 클렌저가 있으면 그것부터
          const mild = calmFit.length ? calmFit : usable.filter(p => p.cat === cat && !p.actives.includes('acid'));
          if (mild.length) { fit = mild; swap = '~'; }      // 순번은 따로 센다 — 평소 저녁 클렌저 돌려 쓰기가 한쪽으로 쏠리지 않게
        }
        const due = fit.filter(p => group(p) !== 'daily' || vitcAm(p));           // 요일·시간이 정해진 성분이 그 자리를 먼저 차지
        const pool = due.length ? due : fit;
        if (!pool.length) continue;
        // ponytail: 같은 종류가 여러 개면 날마다 번갈아 쓴다(아침·저녁 따로 센다). 제형·궁합까지 보려면 규칙 추가
        day[t].push(next(cat + t + (due.length ? '*' : '') + swap, pool).id);
      }
    }
    // 함께 바르기: 이 제품이 들어간 자리엔 묶어 둔 제품을 바로 앞에 붙인다. 묶인 제품이 레티놀·각질·팩이면 그 시간에 써도 되고
    // 그 자리에 같은 성분 제품이 아직 없을 때만(한 저녁에 하나 규칙 유지), 나머지는 쓰는 때와 상관없이 붙인다 — 사용자가 묶었으니까
    for (const t in SLOTS) for (const id of [...day[t]]) {
      const q = byId.get(byId.get(id)?.pair);
      if (!q || day[t].includes(q.id) || !CATS[q.cat][1]) continue;
      if (group(q) !== 'daily' && (!fits(q, d, t, calm) || day[t].some(x => group(byId.get(x)) === group(q)))) continue;
      day[t].splice(day[t].indexOf(id), 0, q.id);

}
// 루틴에 흔히 필요한데 빠진 단계 (개봉했고 기한 안 지난 제품 기준)
function gaps(products, now) {
  const has = cat => products.some(p => p.opened && !expired(p, now) && p.cat === cat), out = [];
  if (!has('sun')) out.push('개봉한 선크림이 없어요. 낮에는 자외선 차단이 꼭 필요해서, 선크림을 등록하고 개봉으로 두면 아침 루틴 마지막에 넣어요.');
  if ((has('sun') || has('makeup')) && !has('oil')) out.push('선크림이나 메이크업을 한 날 저녁엔 클렌징오일·밤 같은 1차 세안제로 먼저 지우면 좋아요. 가지고 있다면 등록해 두세요.');
  return out;
}
const backupDue = (s, now) => !!(s.products.length || s.logs.length) && (!s.backupAt || daysBetween(s.backupAt, now) >= BACKUP_EVERY);
// 개봉했는데 이번 주 루틴에 한 번도 없는 제품. 루틴 제외 종류·기한 지남·예민한 주에 쉬는 성분은 원래 빠지거나 따로 안내하니 뺀다
// → 자동 루틴이면 같은 종류가 자리 수(매일 7·팩 2)보다, 또는 레티놀·각질 성분 제품이 저녁 자리(레티놀 3·각질 2)보다 많아 밀린 것, 직접 고친 루틴이면 넣지 않은 것
function missing(s, now) {
  const inWeek = new Set(s.routine.days.flatMap(d => [...d.am, ...d.pm])), calm = !s.routine.manual && isCalm(s.logs, now);
  return s.products.filter(p => p.opened && CATS[p.cat][1] && !expired(p, now) && !inWeek.has(p.id) && !(calm && ['retinol', 'acid'].includes(group(p))));
}
// 다 쓴 제품 p 대신 쓸 만한 것: 아직 안 뜯었고 기한 안 지난 것 중 같은 종류 → 비슷한 종류, 성분이 같은 것, 기한 빠른 것 순으로 3개 (개봉한 건 이미 루틴에서 돌아가고 있다)
// ponytail: 종류·성분만 본다. 제형·피부 타입까지 따지려면 규칙이나 AI 판단을 더한다. 루틴에 안 넣는 종류(메이크업·바디·기타)는 안의 물건이 제각각이라 추천하지 않음
const NEAR = { toner: ['essence'], essence: ['toner', 'serum'], serum: ['essence'], lotion: ['cream'], cream: ['lotion', 'sleep'], sleep: ['cream'] };
function alternatives(p, products, now) {
  if (!CATS[p.cat][1]) return [];
  const rank = q => (q.cat === p.cat ? 0 : NEAR[p.cat]?.includes(q.cat) ? 1 : -1);
  const diff = q => Object.keys(ACTIVES).filter(a => p.actives.includes(a) !== q.actives.includes(a)).length;
  return products.filter(q => q.id !== p.id && !q.opened && !expired(q, now) && rank(q) >= 0)
    .sort((a, b) => rank(a) - rank(b) || diff(a) - diff(b) || (expiryOf(a) || '9').localeCompare(expiryOf(b) || '9'))
    .slice(0, 3);
}
function isCalm(logs, now) {                  // 가장 최근 피부 기록이 7일 안이고 '예민'이면 (앞날짜로 잘못 적은 기록은 무시)
  const last = logs.filter(l => l.date <= now).reduce((m, l) => (!m || l.date >= m.date ? l : m), null);
  return !!last && daysBetween(last.date, now) <= 7 && last.tags.includes('예민');
}

// ponytail: 이름 키워드로 종류·성분을 어림짐작한다(위에서부터 먼저 맞는 것). 틀리면 폼에서 고치면 됨. 더 정확히 하려면 제품 DB·AI 조회로 교체
const CAT_HINTS = [
  ['oil', /클렌징\s*(오일|밤|워터|밀크|티슈)|리무버/i],

  ['sun', /선\s*(크림|스틱|젤|로션|밀크|세럼|에센스|스프레이)|썬|자외선|spf/i],
  ['body', /바디|샴푸|린스|트리트먼트|핸드|헤어|풋/i],
  ['sleep', /슬리핑|수면\s*팩|나이트\s*(팩|마스크)/i],
  ['mask', /마스크|팩(?!트)/i],
  ['exfol', /필링|각질|스크럽|peel/i],
  ['cleanser', /클렌저|클렌징|폼|세안|워시/i],
  ['eye', /아이\s*(크림|세럼|밤|젤)/i],
  ['toner', /토너|스킨|패드|toner/i],
  ['essence', /에센스|essence/i],
  ['serum', /세럼|앰플|serum|ampoule/i],
  ['lotion', /로션|에멀[전젼]|lotion/i],
  ['faceoil', /오일|oil/i],
  ['cream', /크림|밤|젤|cream/i],
];
const ACTIVE_HINTS = {
  retinol: /레티놀|레티날|레티닐|retin/i,
  acid: /\b(aha|bha|pha|lha)\b|살리실|글리콜|필링|각질|효소|엔자임|enzyme|파우더\s*워시/i,
  vitc: /비타(민)?\s*c\b|vitamin\s*c\b|vita\s*c\b|아스코르|아스코빅/i,
};
function guess(name) {                        // 종류를 못 찾았어도 성분이 보이면 세럼으로
  const actives = Object.keys(ACTIVE_HINTS).filter(a => ACTIVE_HINTS[a].test(name));
  return { cat: CAT_HINTS.find(([, re]) => re.test(name))?.[0] ?? (actives.length ? 'serum' : 'etc'), actives };
}

/* ───────── 데이터 정리 (폼 저장·백업 가져오기 공통 — 모르는 값은 버린다) ───────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const text = (v, max) => (typeof v === 'string' ? v : '').trim().slice(0, max);
const date = v => {                           // 2/30 같은 없는 날짜는 버린다 (Date.parse 는 브라우저마다 달라 직접 되짚는다)
  const m = typeof v === 'string' && /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  return m && ymd(new Date(m[1], m[2] - 1, m[3])) === v ? v : '';
};
const isPhoto = v => typeof v === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(v);
function cleanProduct(p) {
  p = p && typeof p === 'object' ? p : {};
  const opened = !!p.opened || !!p.inUse;     // 예전 백업의 「사용중」 표시도 개봉한 것으로
  return {
    id: text(p.id, 40) || uid(), name: text(p.name, 80), cat: typeof p.cat === 'string' && Object.hasOwn(CATS, p.cat) ? p.cat : 'etc',
    actives: Object.keys(ACTIVES).filter(a => Array.isArray(p.actives) && p.actives.includes(a)),
    expiry: date(p.expiry), opened, openedAt: opened ? date(p.openedAt) : '', pao: PAOS.includes(+p.pao) ? +p.pao : 0,
    memo: text(p.memo, 300),
    when: ['am', 'pm'].includes(p.when) ? p.when : '',      // 쓰는 때: '' = 자동(종류·성분에 맞게), am = 아침만, pm = 저녁만
    pair: text(p.pair, 40),                   // 함께 바르기: 이 제품 바로 앞에 바를 제품 id (없는 제품·자기 자신은 cleanState 가 지운다)
  };
}

  l = l && typeof l === 'object' ? l : {};

    id: text(l.id, 40) || uid(), date: date(l.date) || today(), tags: TAGS.filter(t => Array.isArray(l.tags) && l.tags.includes(t)),
    memo: text(l.memo, 500), thumb: isPhoto(l.thumb) ? l.thumb : '',      // thumb 가 있으면 원본 사진은 저장소의 photo:<id>

  const tags = r?.ok === true ? TAGS.filter(t => Array.isArray(r.tags) && r.tags.includes(t)) : [];

}
function cleanState(s) {

  const products = uniq(s.products, cleanProduct).filter(p => p.name);
  const ids = new Set(products.map(p => p.id));
  for (const p of products) if (p.pair === p.id || !ids.has(p.pair)) p.pair = '';
  const slot = v => [...new Set(Array.isArray(v) ? v : [])].filter(id => ids.has(id));
  return {
    products, logs: uniq(s.logs, cleanLog),
    routine: { manual: !!s.routine?.manual, days: DAYS.map((_, d) => ({ am: slot(s.routine?.days?.[d]?.am), pm: slot(s.routine?.days?.[d]?.pm) })) },
    backupAt: date(s.backupAt),               // 마지막으로 백업 파일을 만든 날
  };
}

/* ───────── 저장소 (이 브라우저의 IndexedDB. 키: state, photo:<기록 id>) ───────── */
const idb = (() => {
  let open;                                   // 연결이 끊기면(iOS 가 백그라운드 탭에서 끊기도 함) 다음 요청 때 다시 연다
  const conn = () => open ??= new Promise((ok, no) => {
    const r = indexedDB.open('vanity', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { r.result.onclose = () => (open = null); ok(r.result); };
    r.onerror = () => no(r.error);
  });
  const run = (mode, fn) => conn().then(db => new Promise((ok, no) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => ok(q.result);
    t.onerror = t.onabort = () => no(t.error);
  })).catch(e => { open = null; throw e; });
  return { get: k => run('readonly', s => s.get(k)), set: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)),
    run };
})();

/* ───────── 화면 ───────── */
const $ = s => document.querySelector(s);
const view = $('#view'), dlg = $('#dlg');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
let state, tab = 'routine', dayIdx = todayIdx(), shownDay = today(), editing = false, filter = 'all', focusId = '', toastTimer, noSave = false;
let queue = [];                               // 사진 한 장에서 읽은 화장품 중 아직 등록 창을 안 띄운 것
const BACKUP_MAX = 300 * 2 ** 20;             // ponytail: 폰 메모리로 한 번에 읽을 수 있는 백업 크기. 사진이 아주 많이 쌓이면 백업을 나눠야 한다

const product = id => state.products.find(p => p.id === id);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;      // 홈 화면 앱으로 열었나
const sub = p => [CATS[p.cat][0], ...p.actives.map(a => ACTIVES[a]), ...(p.when ? [p.when === 'am' ? '아침만' : '저녁만'] : [])].join(' · ');
const fail = e => toast(`저장하지 못했어요. 저장 공간이나 브라우저 설정을 확인해 주세요. (${e?.name ?? '오류'})`, true);
// ponytail: 바뀔 때마다 state 를 통째로 다시 쓴다(썸네일 포함). 피부 기록이 수백 건을 넘어 느려지면 기록을 키별로 쪼갤 것
// noSave: 시작할 때 저장된 내용을 못 읽었으면 쓰지 않는다 — 빈 상태로 기존 기록을 덮어쓰지 않게
const save = () => (noSave ? Promise.resolve(false) : idb.set('state', state).then(() => true, e => (fail(e), false)));
// 자동 루틴이면 다시 짜고, 직접 고친 루틴이면 「쓰는 때」와 다른 시간 자리에 있는 제품만 뺀다 (나머지 배치는 그대로)
function arrange() {
  if (!state.routine.manual) state.routine.days = generate(state.products, isCalm(state.logs, today()), today());
  else for (const day of state.routine.days) for (const t in SLOTS) day[t] = day[t].filter(id => !clash(product(id), t));
}
function commit() {                           // 모든 변경의 끝: 자동 루틴 갱신 → 저장 → 다시 그리기. 저장 성공 여부를 돌려준다
  arrange();
  const saved = save(); render(); return saved;
}
const manual = () => { state.routine.manual = true; commit(); };
function toast(msg, bad) {
  const t = $('#toast');
  if (!t.showPopover) return alert(msg);      // popover 가 없는 옛 브라우저 (iOS 16 이하)
  if (t.matches(':popover-open')) t.hidePopover();
  t.className = bad ? 'bad' : ''; t.showPopover(); t.textContent = msg;     // 다시 띄워야 열려 있는 입력 창 위로 올라온다
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.matches(':popover-open') && t.hidePopover(), 3500);
}
function modal(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }

function render() {
  const id = focusId || document.activeElement?.id; focusId = '';
  view.innerHTML = { routine: viewRoutine, products: viewProducts, skin: viewSkin }[tab]();
  for (const b of document.querySelectorAll('nav button')) b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  const n = state.products.filter(p => (left(p, today()) ?? Infinity) <= SOON).length;
  $('#soon').hidden = !n; $('#soon').innerHTML = n ? `${n}<span class="sr"> 개 기한 임박·만료</span>` : '';
  const el = id ? document.getElementById(id) : null;     // 다시 그려도 키보드 초점 유지
  (el?.disabled ? el.parentElement.querySelector('button:not(:disabled)') : el)?.focus();
}

function viewRoutine() {
  const now = today(), R = state.routine, byId = new Map(state.products.map(p => [p.id, p])), calmNow = !R.manual && isCalm(state.logs, now);
  if (!R.manual && !state.products.some(p => p.opened))
    return `<div class="empty"><p><b>아직 루틴이 비어 있어요</b></p><p>개봉한 화장품을 등록하면<br>월~일 아침·저녁 루틴이 자동으로 짜여요.</p>
      <button class="primary" data-act="tab" data-tab="products">화장품 등록하러 가기</button></div>`;

  const mark = i => { const g = R.days[i].pm.map(id => byId.get(id)).filter(Boolean).map(group);
    return g.includes('retinol') ? '레티놀' : g.includes('acid') ? '각질' : g.includes('pack') ? '팩' : i === todayIdx() ? '오늘' : ''; };
  const days = DAYS.map((n, i) => `<button id="d${i}" class="day" data-act="day" data-i="${i}" aria-pressed="${i === dayIdx}" ${i === todayIdx() ? 'aria-current="date"' : ''}><b>${n}</b><small>${mark(i)}</small></button>`).join('');

  const notes = [];
  if (!R.manual && isCalm(state.logs, now)) notes.push('최근 피부 기록이 ‘예민’이라 레티놀·각질케어는 쉬어 가요.');
  const gone = state.products.filter(p => p.opened && expired(p, now)).length;
  if (gone) notes.push(`기한이 지난 개봉 제품이 ${gone}개 있어요.${R.manual ? '' : ' 루틴에서는 뺐어요.'}`);

  if (out) notes.push(R.manual ? `개봉했는데 루틴에 없는 제품: ${out}`
    : `이번 주 루틴에 자리가 없는 개봉 제품: ${out}. 같은 종류는 한 칸에 하나씩, 레티놀·각질 성분은 한 저녁에 하나씩 돌려 써서 자리가 모자라요. 꼭 쓰고 싶으면 직접 고치기로 넣어 주세요.`);

    <button data-act="export">백업 파일 내보내기</button>`);

  const slot = t => {
    const ids = R.days[dayIdx][t];
    const rows = ids.map((id, i) => {
      const p = byId.get(id); if (!p) return '';
      const pairTag = ids.some(x => byId.get(x)?.pair === p.id) ? '<span class="tag">함께</span>' : '';      // 다음 제품과 함께 바르려고 붙은 것
      const hot = pairTag + (group(p) === 'retinol' ? '<span class="tag on">레티놀</span>' : group(p) === 'acid' ? '<span class="tag on">각질</span>' : '');      // 포장이 비슷한 일반 제품과 헷갈리지 않게
      const warn = expired(p, now) ? '<span class="tag bad">기한 지남</span>' : !p.opened ? '<span class="tag warn">미개봉</span>'
        : !R.manual && clash(p, t) ? `<span class="tag">${calmNow ? '예민한 주' : R.days[dayIdx].pm.some(id => byId.get(id) && group(byId.get(id)) === 'retinol') ? '레티놀 날' : '각질 날'} 순한 세안</span>` : '';      // 자동 루틴에서 쓰는 때와 다른 자리 = 순한 클렌저 교체
      const ctl = editing ? `<span class="ctl">
        <button id="u-${t}-${i}" data-act="move" data-t="${t}" data-i="${i}" data-by="-1" aria-label="${esc(p.name)} 위로" ${i ? '' : 'disabled'}>↑</button>
        <button id="w-${t}-${i}" data-act="move" data-t="${t}" data-i="${i}" data-by="1" aria-label="${esc(p.name)} 아래로" ${i < ids.length - 1 ? '' : 'disabled'}>↓</button>
        <button id="x-${t}-${i}" data-act="drop" data-t="${t}" data-i="${i}" aria-label="${esc(p.name)} 빼기">✕</button></span>` : '';
      return `<li><button class="what" data-act="editProduct" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><small>${sub(p)}</small>${p.memo ? `<small class="memo">📝 ${esc(p.memo)}</small>` : ''}</button>${hot}${warn}${ctl}</li>`;

function badge(l) {
  if (l === null) return '<span class="tag">기한 없음</span>';
  if (l < 0) return `<span class="tag bad">만료 ${-l}일 지남</span>`;
  return `<span class="tag ${l <= SOON ? 'warn' : ''}">${l ? 'D-' + l : '오늘까지'}</span>`;
}
function viewProducts() {
  const now = today(), inWeek = new Set(state.routine.days.flatMap(d => [...d.am, ...d.pm]));
  // 루틴 상태: sealed 미개봉 · skip 루틴에 안 넣는 종류 · in 이번 주 루틴에 있음 · out 개봉했는데 없음(만료·자리 부족·예민한 주·직접 고친 루틴)
  const rows = state.products.map(p => ({ p, l: left(p, now), e: expiryOf(p), r: !p.opened ? 'sealed' : !CATS[p.cat][1] ? 'skip' : inWeek.has(p.id) ? 'in' : 'out' }));
  const F = { all: ['전체', () => true], out: ['루틴에 없음', r => r.r === 'out'], sealed: ['미개봉', r => r.r === 'sealed'], soon: ['임박·만료', r => r.l !== null && r.l <= SOON], none: ['기한 없음', r => !r.e] };
  const chips = Object.entries(F).map(([k, [name, fn]]) =>
    `<button id="f-${k}" class="chip" data-act="filter" data-f="${k}" aria-pressed="${k === filter}">${name} ${rows.filter(fn).length}</button>`).join('');
  const cards = rows.filter(F[filter][1])
    .sort((a, b) => (a.e || '9').localeCompare(b.e || '9') || a.p.name.localeCompare(b.p.name, 'ko'))
    .map(({ p, l, e, r }) => `<article class="card prod">
      <button id="p-${esc(p.id)}" class="name" data-act="editProduct" data-id="${esc(p.id)}">${esc(p.name)}</button>${badge(l)}
      <small>${sub(p)} · ${p.opened ? `개봉 ${p.openedAt}` : '미개봉'}${e ? `<br>${e}까지${e === openLimit(p) ? ` (개봉 후 ${p.pao}개월)` : ''}` : ''}</small>
      ${r === 'sealed' ? `<button id="open-${esc(p.id)}" class="chip" data-act="open" data-id="${esc(p.id)}" aria-label="${esc(p.name)} 오늘 개봉" title="눌러서 오늘 개봉으로">미개봉</button>`
        : `<span class="tag ${r === 'in' ? 'on' : r === 'out' ? 'warn' : ''}">${{ in: '루틴 포함', out: '루틴에 없음', skip: '루틴 제외' }[r]}</span>`}</article>`).join('');
  return `<div class="adds"><button id="add" class="primary" data-act="add">＋ 직접 등록</button>
    <label class="btn"><input type="file" accept="image/*" class="sr" data-pick="product">📷 사진으로 등록</label></div>` + (state.products.length
    ? `<div class="filters" role="group" aria-label="걸러 보기">${chips}</div>${cards || '<p class="empty">해당하는 화장품이 없어요</p>'}`
    : '<div class="empty"><p><b>등록된 화장품이 없어요</b></p><p>사진으로 등록하면 AI가 이름·종류·기한을 읽어 줘요. 한 장에 여러 개를 찍어도 돼요. 뒷면(전성분·사용기한)이 보이게 찍으면 성분까지 채워요.<br>직접 등록할 땐 이름만 적어도 종류를 골라 줘요.</p></div>');

function shrink(file, max, q) {               // 긴 변 max px JPEG data URL 로 줄인다
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const out = c.toDataURL('image/jpeg', q); c.width = c.height = 0; ok(out);     // iOS 캔버스 메모리 반납
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('사진을 읽을 수 없어요.')); };
    img.src = url;
  });
}

  const blob = new Blob([JSON.stringify({ app: 'vanity', v: 1, at, state: { ...state, backupAt: at }, photos })], { type: 'application/json' });
  // 파일 공유를 받아 주는 브라우저(아이폰 등)는 공유 창으로, 아니면 내려받기로 — 안드로이드 크롬은 json 파일 공유를 막아 두어 「다운로드」 폴더로 간다

  }

async function importFile(file) {

    await idb.set('state', next);
  } catch (e) { return fail(e); }             // 그때 먼저 써 둔 사진은 다음 시작 때 sweepPhotos 가 치운다
  const keep = new Set(next.logs.map(l => l.id));
  for (const l of state.logs) if (!keep.has(l.id)) idb.del('photo:' + l.id).catch(() => {});
  state = next; dlg.close(); commit(); toast('백업을 가져왔어요');
}

  return { summary: line(r?.summary, 300),
    points: (Array.isArray(r?.points) ? r.points : []).filter(p => Object.hasOwn(CHECK_KINDS, p?.kind)).slice(0, 6)
      .map(p => ({ kind: p.kind, title: line(p.title, 60), detail: line(p.detail, 400), product: line(p.product, 80), memo: line(p.memo, 100), when: ['am', 'pm'].includes(p.when) ? p.when : '' }))
      .filter(p => p.title || p.detail) };
}
// 점검에 보낼 글: 제품(개봉 = 루틴 대상)·이번 주 루틴·가장 최근 피부 상태 태그 (사진·피부 메모는 안 보낸다)
function routineText(s, now) {
  const name = id => s.products.find(p => p.id === id)?.name ?? '';
  // 쓰는 때는 실제로 쓰이는 때로 적는다 — 「자동」이라고만 적으면 AI가 각질 패드를 아무 때나 쓰는 줄 알고 「저녁만으로 바꾸라」고 되풀이했다 (11-16 실측)
  const FIXED = { retinol: '레티놀 날 저녁(월·수·금) 고정', acid: '각질 날 저녁(화·토) 고정', pack: '팩 날 저녁(목·일) 고정' };
  const when = p => FIXED[group(p)] ?? ({ '': '자동', am: '아침만', pm: '저녁만' }[p.when]
    + (p.cat === 'cleanser' && p.actives.includes('acid') ? ' (씻어 내는 제품이라 매일 써도 되고, 레티놀·각질 날엔 앱이 순한 클렌저로 바꿈)' : ''));
  const line = p => `- ${p.name} | ${CATS[p.cat][0]} | 성분: ${p.actives.map(a => ACTIVES[a]).join('·') || '없음'} | 쓰는 때: ${when(p)}`
    + `${expired(p, now) ? ' | 기한 지남' : ''}${p.memo ? ` | 메모: ${p.memo.replace(/\s+/g, ' ')}` : ''}${name(p.pair) ? ` | 바로 앞에 함께 바름: ${name(p.pair)}` : ''}`;
  const opened = s.products.filter(p => p.opened), sealed = s.products.filter(p => !p.opened);
  const last = s.logs.filter(l => l.date <= now).sort((a, b) => b.date.localeCompare(a.date))[0];
  return [`[개봉한 제품 = 루틴 대상 ${opened.length}개]`, ...opened.map(line),
    `[아직 안 뜯은 제품 ${sealed.length}개]`, ...sealed.map(p => `- ${p.name} | ${CATS[p.cat][0]}`),
    `[이번 주 루틴 — ${s.routine.manual ? '사용자가 직접 고친 루틴' : '앱이 자동으로 짠 루틴'}]`,
    ...s.routine.days.flatMap((d, i) => [`${DAYS[i]} 아침: ${d.am.map(name).join(' → ') || '없음'}`, `${DAYS[i]} 저녁: ${d.pm.map(name).join(' → ') || '없음'}`]),
    `[가장 최근 피부 상태] ${last ? `${last.date}: ${last.tags.join(', ') || '태그 없음'}` : '기록 없음'}`].join('\n');
}
function cleanItems(r) {                      // AI 가 읽은 화장품도 믿지 않고 정해진 값만 (개봉은 사용자가 고른다)
  return (Array.isArray(r?.items) ? r.items : []).slice(0, 30).map(x => {
    const name = typeof x?.name === 'string' ? x.name.replace(/\s+/g, ' ') : '';
    // 이름에 성분 단어가 있는데 AI 가 빠뜨렸으면 이름 추측으로 채운다
    return cleanProduct({ name, cat: x?.cat, actives: [...(Array.isArray(x?.actives) ? x.actives : []), ...guess(name).actives], expiry: x?.expiry, pao: x?.pao });
  }).filter(p => p.name);
}
const jpeg = photo => ({ inlineData: { mimeType: 'image/jpeg', data: photo.slice(photo.indexOf(',') + 1) } });
const analyzeSkin = async (photo, key) => cleanAnalysis(await askGemini([jpeg(photo), { text: '이 사진의 피부 상태를 기록해 주세요.' }], key, SKIN_PROMPT, SKIN_SCHEMA));
const readProducts = async (photo, key) => cleanItems(await askGemini([jpeg(photo), { text: '이 사진 속 화장품을 읽어 주세요.' }], key, PRODUCT_PROMPT, PRODUCT_SCHEMA));
const checkRoutineAI = async key => cleanCheck(await askGemini([{ text: routineText(state, today()) }], key, CHECK_PROMPT, CHECK_SCHEMA));
async function askGemini(parts, apiKey, prompt, schema) {      // parts = 보낼 사진·글
  let err;
  for (const [model, think] of MODELS) {
    try { return readGemini(await callGemini(model, think, parts, apiKey, prompt, schema)); }
    catch (e) { if (!e.next) throw e; err = e; }      // 키·차단·연결 문제는 다른 모델로 보내도 같으니 바로 알린다
  }
  throw err;
}
async function callGemini(model, think, parts, apiKey, prompt, schema) {
  let res, body;
  const fail = (msg, next) => Object.assign(new Error(msg), { next });
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30e3);      // 30초 넘게 답이 없으면 끊는다 (옛 Safari 에도 있는 방법으로)
  try {
    res = await fetch(`${GEMINI}${model}:generateContent`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': apiKey },      // 키는 URL 이 아닌 헤더로 — 기록·리퍼러에 남지 않게
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: prompt }] },
        contents: [{ role: 'user', parts }],
        generationConfig: {
          responseMimeType: 'application/json', responseJsonSchema: schema,
          maxOutputTokens: 8192, ...(think ? { thinkingConfig: { thinkingLevel: think } } : {}),      // 답은 JSON 하나 — 생각은 짧게
        },
      }),
      signal: ac.signal,
    });
    body = await res.json().catch(e => { if (e?.name === 'AbortError') throw e; return {}; });
  } catch (e) {
    throw e?.name === 'AbortError' ? fail('응답이 늦어요. 잠시 뒤 다시 해 주세요.', true) : fail('연결하지 못했어요. 인터넷이나 광고 차단 확장 프로그램을 확인해 주세요.', false);
  } finally { clearTimeout(timer); }
  if (!res.ok) {
    const err = body?.error ?? {}, msg = String(err.message ?? ''), why = JSON.stringify(err.details ?? '');
    const gone = res.status === 404 || /limit: 0\b/.test(msg);      // 모델이 내려갔거나 무료에서 빠짐
    const keyIssue = res.status === 401 || res.status === 403 || /API_KEY|REFERRER_BLOCKED|SERVICE_BLOCKED/.test(why);
    // 다음 모델로: 내려감·한도(모델마다 따로)·서버 오류, 그리고 키 문제가 아닌 400 — 요청 형식을 이 모델만 못 받는 경우가 있다
    const next = gone || res.status === 429 || res.status >= 500 || (res.status === 400 && !keyIssue);
    throw fail(gone ? '이 AI 모델을 무료로 쓸 수 없게 됐어요. 앱의 모델 설정을 바꿔야 해요.'
      : res.status === 429 ? '무료 사용 한도에 걸렸어요. 잠시 뒤나 내일 다시 해 주세요.'
      : /REFERRER_BLOCKED|SERVICE_BLOCKED/.test(why) ? 'API 키의 웹사이트·API 제한 설정이 이 앱을 막고 있어요. Google Cloud 콘솔에서 확인해 주세요.'
      : res.status === 401 || res.status === 403 || /API_KEY/.test(why) ? 'API 키가 맞지 않아요. ⋯ 메뉴에서 확인해 주세요.'
      : res.status >= 500 ? 'Google 쪽에 잠깐 문제가 있어요. 잠시 뒤 다시 해 주세요.'
      : `분석 요청이 실패했어요 (${res.status}): ${msg.slice(0, 160)}`, next);
  }
  return body;
}
// generateContent 응답에서 JSON 답을 꺼낸다. 차단·잘림·깨진 답은 알아듣는 말로
function readGemini(r) {
  const c = r?.candidates?.[0];
  if (r?.promptFeedback?.blockReason || /SAFETY|PROHIBITED|BLOCKLIST|SPII/.test(c?.finishReason ?? '')) throw new Error('AI가 이 사진은 분석하지 않았어요.');
  const text = (c?.content?.parts ?? []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  // 답 없이 OTHER·RECITATION 등으로 끝나면 사실상 거절 — 다시 해도 같아서 무료 한도만 쓴다
  if (c && !text && !/^(STOP|MAX_TOKENS)$/.test(c.finishReason ?? '')) throw new Error('AI가 이 사진은 분석하지 않았어요.');
  try { return JSON.parse(text); } catch { throw new Error('분석 결과를 읽지 못했어요. 다시 해 주세요.'); }
}
// 결과는 AI가 체크했던 상태만 바꾸고(내가 고른 건 그대로) 메모의 'AI:' 줄을 바꾼다 — 저장 전에 고칠 수 있다
async function runAnalysis(form) {
  const out = form.querySelector('.ai'), btn = form.querySelector('[data-act=analyze]'), save = form.querySelector('.primary');
  const seq = form._aiSeq = (form._aiSeq || 0) + 1;      // 사진을 바꾸거나 다시 누르면 앞선 분석 결과는 버린다
  const live = () => seq === form._aiSeq && form.isConnected && dlg.open;      // 창을 닫았거나 바뀌었으면 결과도 버린다
  btn.disabled = save.disabled = true;                    // 끝나기 전에 저장하면 결과는 버려지고 무료 한도만 쓴다
  out.hidden = false;
  try {
    const photo = form._draft?.photo ?? form.querySelector('.preview').getAttribute('src');
    const key = await getKey();
    if (!live()) return;
    if (key === null) return void (out.textContent = '저장소를 읽지 못했어요. 다시 해 주세요.');
    if (!key) return void (out.textContent = '⋯ 메뉴에서 Gemini API 키(무료)를 등록하면 AI가 사진을 보고 상태를 채워 줘요.');
    if (!isPhoto(photo)) return void (out.textContent = '사진을 먼저 골라 주세요.');
    out.textContent = 'AI가 사진을 보는 중이에요… (보통 몇 초)';
    const r = await analyzeSkin(photo, key);
    if (!live()) return;
    if (r.ok) {
      for (const c of form.elements.tags) if (form._aiTags?.includes(c.value) || r.tags.includes(c.value)) c.checked = r.tags.includes(c.value);
      form._aiTags = r.tags;
      const memo = form.elements.memo, base = memo.value.split('\n').filter(s => !s.startsWith('AI: ')).join('\n').trimEnd();
      const room = 500 - (base ? base.length + 1 : 0);      // 메모는 500자까지라 AI 줄을 남은 자리에 맞춘다
      if (r.summary && room > 10) memo.value = (base ? base + '\n' : '') + ('AI: ' + r.summary).slice(0, room);
    }
    out.textContent = r.ok ? `AI: ${r.summary} 체크한 상태는 저장 전에 고칠 수 있어요.` : `AI: ${r.summary || '피부가 잘 보이는 사진으로 다시 골라 주세요.'}`;

}
// 화장품 사진 → 첫 제품으로 이 창을 채우고(이미 고른 개봉·메모는 그대로), 나머지는 저장할 때마다 하나씩 새 창으로. 사진은 저장하지 않는다

/* ───────── 동작 ───────── */
// 점검 창의 적용 버튼을 「적용됨」으로 바꾼다 (같은 제품을 가리킨 버튼 모두)
const applied = (act, id, label) => { for (const b of dlg.querySelectorAll(`[data-act="${act}"][data-id="${id}"]`)) { b.disabled = true; b.textContent = label; } };
const ACT = {
  tab(d) { tab = d.tab; editing = false; render(); scrollTo(0, 0); },
  day(d) { dayIdx = +d.i; render(); },
  edit() { editing = !editing; render(); },
  regen() {

    p.memo = text(p.memo ? `${p.memo} / ${d.memo}` : d.memo, 300); commit();

  },
  applyWhen(d) {                              // AI 점검 제안 → 쓰는 때 바꾸기
    const p = product(d.id); if (!p || !['am', 'pm'].includes(d.when)) return;
    p.when = d.when; commit();
    applied('applyWhen', d.id, `✓ ${d.when === 'am' ? '아침만' : '저녁만'}으로 바꿨어요`); toast(`‘${p.name}’을(를) ${d.when === 'am' ? '아침만' : '저녁만'}으로 바꿨어요`);
  },
  swap(d) {                                   // 다 쓴 제품을 목록·루틴에서 빼고, 고른 제품이 있으면 오늘 개봉 (직접 고친 루틴은 같은 자리에 바꿔 넣는다)

      const a = day[t], i = a.indexOf(p.id);

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (state && b && Object.hasOwn(ACT, b.dataset.act)) ACT[b.dataset.act](b.dataset); });
view.addEventListener('change', e => {        // 루틴에 제품 추가 · 화장품 사진으로 등록
  const file = e.target.files?.[0];
  if (file && e.target.dataset.pick === 'product') { ACT.add(); fillFromPhoto(dlg.querySelector('form'), file); e.target.value = ''; return; }
  const t = e.target.dataset.add;

dlg.addEventListener('input', e => {          // 화장품 폼: 이름으로 종류 추측, 개봉하면 개봉일 오늘
  const t = e.target, f = t.form;
  if (f?.dataset.form !== 'product') return;
  const el = f.elements;
  if (t.name === 'name' && f.dataset.auto) { const g = guess(t.value); el.cat.value = g.cat; for (const c of el.actives) c.checked = g.actives.includes(c.value); }
  if (t.name === 'cat' || t.name === 'actives') delete f.dataset.auto;        // 직접 고른 뒤에는 추측하지 않는다
  if (t.name === 'opened' && el.opened.checked && !el.openedAt.value) el.openedAt.value = today();
});
dlg.addEventListener('change', async e => {   // 사진·백업 파일 고르기
  const t = e.target, file = t.files?.[0];
  if (!file) return;
  if (t.dataset.pick === 'backup') importFile(file);
  if (t.dataset.pick === 'product') fillFromPhoto(t.form, file);
  if (t.dataset.pick === 'photo') {
    const form = t.form, ok = form.querySelector('.primary'), img = form.querySelector('.preview');
    ok.disabled = true;                       // 줄이는 동안 저장되면 사진이 빠진다
    // 고른 사진은 그 입력 창(form)에 붙인다 — 줄이는 사이 창을 닫고 다른 기록을 열어도 그쪽에 섞이지 않게
    let picked = false;
    try { form._draft = { photo: await shrink(file, 1280, .82), thumb: await shrink(file, 320, .6) }; img.src = form._draft.photo; img.hidden = false; picked = true; }
    catch { toast('사진을 읽을 수 없어요', true); }
    ok.disabled = false;
    if (picked && form.isConnected && dlg.open) { form.querySelector('[data-act=analyze]').hidden = false; runAnalysis(form); }   // 사진을 고르면 바로 분석
  }
  t.value = '';
});
dlg.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = new FormData(f);
  if (f.dataset.form === 'product') {
    const p = readProduct(f);
    if (!p.name) return;
    const i = state.products.findIndex(x => x.id === p.id);
    i < 0 ? state.products.push(p) : (state.products[i] = p);
    if (!f.dataset.id && queue.length) { productForm(queue.shift(), true); toast(`‘${p.name}’ 저장했어요`); return void commit(); }      // 사진에서 읽은 다음 제품
  } else if (f.dataset.form === 'log') {
    if (f.inert) return;                      // 사진을 저장하는 사이 한 번 더 눌러도 기록이 둘 생기지 않게
    const old = state.logs.find(l => l.id === f.dataset.id);
    const l = cleanLog({ id: f.dataset.id, date: d.get('date'), tags: d.getAll('tags'), memo: d.get('memo'), thumb: f._draft?.thumb ?? old?.thumb });
    if (!l.thumb && !l.tags.length && !l.memo) return toast('사진·상태·메모 중 하나는 남겨 주세요', true);
    f.inert = true;
    try { if (f._draft) await idb.set('photo:' + l.id, f._draft.photo); } catch (err) { f.inert = false; return fail(err); }
    old ? Object.assign(old, l) : state.logs.push(l);
  } else if (e.submitter?.name === 'saveKey') return ACT.saveKey();      // 「키 저장」 또는 키 칸에서 Enter
  else return dlg.close();
  if (f.isConnected) dlg.close();            // 저장을 기다리는 사이 다른 창을 열었으면 그 창은 두고
  commit();
});

}

  eq([cleanAnalysis({ ok: true, tags: ['좋음', '건조', '<b>', '건조'], summary: '  볼이 건조해요 ' }), cleanAnalysis({ ok: false, tags: ['트러블'], summary: '너무 어두워요' }), cleanAnalysis(null)],
    [{ ok: true, tags: ['건조'], summary: '볼이 건조해요' }, { ok: false, tags: [], summary: '너무 어두워요' }, { ok: false, tags: [], summary: '' }], 'AI 결과 정리');
  eq(cleanAnalysis({ ok: true, tags: [], summary: '볼이 붉어요.\n\n피부과 상담을 권해요.' }).summary, '볼이 붉어요. 피부과 상담을 권해요.', 'AI 요약은 한 줄로');
  eq([...cleanItems({ items: [{ name: ' 라운드랩\n독도  토너 ', cat: 'toner', actives: ['acid', 'x'], expiry: '2027-06-31', pao: 12, opened: true, inUse: true },
    { name: '', cat: 'serum' }, { name: 'B', cat: 'nope', pao: 5, expiry: '2027-06-30' }, 'junk', { name: '구달 청귤 비타C 세럼', cat: 'serum', actives: [] }] }).map(({ id, ...p }) => p), cleanItems(null)],
    [{ name: '라운드랩 독도 토너', cat: 'toner', actives: ['acid'], expiry: '', opened: false, openedAt: '', pao: 12, memo: '', when: '', pair: '' },
      { name: 'B', cat: 'etc', actives: [], expiry: '2027-06-30', opened: false, openedAt: '', pao: 0, memo: '', when: '', pair: '' },
      { name: '구달 청귤 비타C 세럼', cat: 'serum', actives: ['vitc'], expiry: '', opened: false, openedAt: '', pao: 0, memo: '', when: '', pair: '' }, []], 'AI가 읽은 화장품 정리 (이름에 보이는 성분은 채움)');
  eq(cleanCheck({ summary: ' 전반적으로\n좋아요 ', points: [{ kind: '조정', title: '크림은 저녁만', detail: '에스트라 크림의 쓰는 때를\n저녁만으로' }, { kind: '<b>', title: 'x', detail: 'y' }, { kind: '좋음', title: '', detail: '' }, 'junk'] }),
    { summary: '전반적으로 좋아요', points: [{ kind: '조정', title: '크림은 저녁만', detail: '에스트라 크림의 쓰는 때를 저녁만으로', product: '', memo: '', when: '' }] }, 'AI 루틴 점검 답 정리');
  eq(cleanCheck({ points: [{ kind: '조정', title: 't', detail: 'd', product: ' 에스트라\n크림 ', memo: '볼에만 얇게', when: 'am' }, { kind: '주의', title: 't', detail: 'd', when: 'noon' }] }).points.map(p => [p.product, p.memo, p.when]),
    [['에스트라 크림', '볼에만 얇게', 'am'], ['', '', '']], 'AI 점검 제안의 바로 적용 칸 정리');
  const rt = routineText({ products: [P({ id: 'a', name: '토너A', cat: 'toner', actives: ['acid'], when: 'pm', memo: '부드럽게\n닦기' }), { ...P({ id: 'b', name: '크림B', cat: 'cream' }), opened: false }],
    logs: [{ date: '2026-11-10', tags: ['건조'] }, { date: '2026-11-15', tags: ['예민', '홍조'] }, { date: '2027-01-01', tags: ['좋음'] }], routine: { manual: false, days: DAYS.map((_, i) => ({ am: [], pm: i === 1 ? ['a'] : [] })) } }, '2026-11-16').split('\n');
  ok(rt.includes('- 토너A | 토너·스킨 | 성분: AHA·BHA·효소 | 쓰는 때: 각질 날 저녁(화·토) 고정 | 메모: 부드럽게 닦기') && rt.includes('- 크림B | 크림') && rt.includes('화 저녁: 토너A') && rt.includes('월 아침: 없음')
    && rt.at(-1) === '[가장 최근 피부 상태] 2026-11-15: 예민, 홍조', 'AI 루틴 점검에 보내는 글 (앞날짜 기록은 무시)');
  const G = (parts, finishReason = 'STOP') => ({ candidates: [{ content: { parts }, finishReason }] });
  eq(readGemini(G([{ text: '생각 중', thought: true }, { text: '{"ok":true,' }, { text: '"tags":["건조"],"summary":"s"}' }])), { ok: true, tags: ['건조'], summary: 's' }, 'Gemini 답: 생각 부분은 빼고 이어 붙여 읽기');
  const why = r => { try { readGemini(r); return 'ok'; } catch (e) { return /분석하지 않았/.test(e.message) ? 'blocked' : 'broken'; } };
  eq([why({ promptFeedback: { blockReason: 'IMAGE_SAFETY' } }), why(G([], 'PROHIBITED_CONTENT')), why(G([], 'OTHER')), why(G([{ text: '{"ok":' }], 'MAX_TOKENS')), why(G([], 'MAX_TOKENS')), why(undefined)],
    ['blocked', 'blocked', 'blocked', 'broken', 'broken', 'broken'], 'Gemini 답: 차단·사실상 거절·잘림·빈 응답');

  const cs = cleanState({ products: [{ id: 'a', name: ' A ', cat: 'constructor', pao: 5, actives: ['x', 'vitc'], inUse: 1 }, { id: 'a', name: '중복' }, { name: '  ' }, 7],
    routine: { manual: 1, days: [{ am: ['a', 'a', 'ghost'], pm: 'x' }] }, logs: [{ id: 'l', date: 'nope', thumb: 'javascript:alert(1)', tags: ['예민', '<b>'] }] });
  eq(cs.products, [{ id: 'a', name: 'A', cat: 'etc', actives: ['vitc'], expiry: '', opened: true, openedAt: '', pao: 0, memo: '', when: '', pair: '' }], '가져온 화장품 정리 (옛 사용중 = 개봉)');
  eq([cs.routine.manual, cs.routine.days.length, cs.routine.days[0], cs.logs[0].thumb, cs.logs[0].tags, cs.logs[0].date === today()], [true, 7, { am: ['a'], pm: [] }, '', ['예민'], true], '가져온 루틴·기록 정리');
  eq(cleanState(cleanState(undefined)), { products: [], logs: [], routine: { manual: false, days: DAYS.map(() => ({ am: [], pm: [] })) }, backupAt: '' }, '빈 상태');
  const B = (backupAt, n = 1) => ({ products: Array(n).fill(P({})), logs: [], backupAt });
  eq([backupDue(B(''), '2026-11-16'), backupDue(B('', 0), '2026-11-16'), backupDue(B('2026-11-03'), '2026-11-16'), backupDue(B('2026-11-02'), '2026-11-16'),
    backupDue(cleanState({ products: [{ name: 'a' }], backupAt: '2026-02-30' }), '2026-11-16')],
    [true, false, false, true, true], '백업 알림: 기록이 있는데 백업이 없거나 14일 지났을 때 (없는 날짜는 백업 없음으로)');

  const bad = out.filter(([c]) => !c);
  document.title = bad.length ? `TEST FAIL ${bad.length}/${out.length}` : `TEST OK ${out.length}`;
  view.innerHTML = `<div class="card"><h2>${esc(document.title)}</h2><ol>${out.map(([c, m]) => `<li>${c ? '✅' : '❌'} ${esc(m)}</li>`).join('')}</ol></div>`;
}

/* ───────── 시작 ───────── */
(async () => {
  if (location.search === '?test') return selfTest();
  let loaded = false;
  try {
    const saved = await idb.get('state').catch(() => idb.get('state'));      // 연결이 끊겼으면 idb 가 다시 열어 한 번 더
    state = cleanState(saved); loaded = saved != null;
  } catch {
    state = cleanState(); noSave = true;
    toast('저장된 내용을 읽지 못했어요. 새로고침해 보세요. 지금 고친 내용은 저장되지 않아요.', true);
  }
  arrange();
  render();
  navigator.storage?.persist?.().catch(() => {});      // 브라우저가 임의로 비우지 않게 요청 (거절돼도 동작)
  idb.del('apiKey').catch(() => {});                   // ponytail: Claude 를 쓰던 때의 키 자리 — 남은 키가 있으면 지운다. 몇 달 뒤 이 줄은 지워도 된다
  // 사진 정리는 저장된 상태를 제대로 읽었을 때만(못 읽었는데 지우면 사진을 다 잃는다), 그리고 앱이 이 창 하나에서만 열려 있을 때만 —
  // 처음 연 창이 잠금을 닫힐 때까지 쥐고 있어서, 다른 창이 사진을 쓰는 도중에 지우지 않는다. 잠금을 못 쓰는 브라우저면 정리하지 않는다
  if (loaded) navigator.locks?.request('vanity-sweep', { ifAvailable: true }, lock => lock && sweepPhotos().then(() => new Promise(() => {}))).catch(() => {});
})();
// 기록이 가리키지 않는 사진(저장·가져오기가 중간에 실패한 흔적)을 치운다. 키 목록 읽기와 지우기를 한 트랜잭션으로
function sweepPhotos() {
  const keep = new Set(state.logs.map(l => 'photo:' + l.id));
  return idb.run('readwrite', s => {
    const q = s.getAllKeys();
    q.onsuccess = () => { for (const k of q.result) if (typeof k === 'string' && k.startsWith('photo:') && !keep.has(k)) s.delete(k); };
    return q;
  });
}
